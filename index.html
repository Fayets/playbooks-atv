cia; BOFU con el caso camuflado. Todo esto se entrena con recurrencia: lo hacés, lo estudiás, y en el momento en que menos te das cuenta, sale. CUANDO ENTRAN A TU PERFIL LO 1 SHOW RATE SHOW RATE CLOSERS SHOW RATE CLOSERS CLOSERS SHOW RATE SETTERS CLOSERS 2 3 EN ROJO, LO QUE SE REPITE «AH, ESTE ES IGUAL A ESTE, A ESTE, A ESTE» QUE TIENE QUE VERSE TOFU ABIERTOS, INCÓMODOS DE HACER AL PRINCIPIO, PERO TRAEN LAS VIEWS MOFU UN PARADIGMA, UNA CREENCIA ROTA BOFU EL CASO CAMUFLADO EN VALOR LOS TOFU AL PRINCIPIO INCOMODAN: SON LOS QUE NECESITÁS PORQUE SIN VIEWS NADIE PRESTA ATENCIÓN ESTO SE ENTRENA CON RECURRENCIA: LO HACÉS, LO ESTUDIÁS, Y EN EL MOMENTO EN QUE MENOS TE DAS CUENTA, SALE FIG. 06 — EL PERFIL SE LEE ENTERO: VARIEDAD DE INTENCIÓN, NO NUEVE VERSIONES DEL MISMO REEL CÓMO LEER TU PERFIL 01 Mirá tu perfil como quien entra por primera vez y marcá en rojo los reels que parecen el mismo. 02 Asegurate de que en los últimos nueve haya al menos tres TOFU abiertos. 03 Cada semana, un reel incómodo: uno que no le hable a tu nicho y que vos sepas por qué está ahí. → Competencia, hook, ejemplo, captura y perfil: ya sabés cómo engañar al algoritmo. Los próximos siete días lo ponen en marcha. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 02 — ENGAÑAR SIETE AL ALGORITMO ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 DIAGNÓSTICO DÍA 03 TEMA ABURRIDO DÍA 02 TRES HOOKS DÍA 05 CASO DE ÉXITO DÍA 04 PARA MOSTRAR DÍA 07 EL PERFIL LISTO DÍA 06 GRABAR DÍA 01 Diagnosticá tus diez últimos reels. Cuáles filtran en el hook y en cuántas views se estancaron. DÍA 02 Reescribí tres hooks abiertos. Que los sienta alguien ajeno al nicho, tu madre por ejemplo. DÍA 03 Elegí un tema aburrido. Buscá el número, la decisión o el caos que cualquiera entiende. DÍA 04 Preparé algo para mostrar. Un documento, un calendario, un estándar que valga una captura. DÍA 05 Reescribí un caso de éxito. Confesión, valor, proceso y el caso al final. DÍA 06 Grabá y subí el primero. Con el hook abierto y el nicho recién al final. DÍA 07 Revisá el perfil. Marcá en rojo lo repetido y programá los TOFU que faltan. Cómo sabés que funciona A las cuatro semanas hay reels que pasaron las mil views sin cambiar de tema, y los comentarios traen gente calificada. Si siguen estancados, volvé al día 02: el hook todavía filtra. AUMENTA TU VALOR 08","PLAYBOOK LA 02 — ENGAÑAR AL ALGORITMO ATV 2026 SERIE ESTE ES EL PLAYBOOK 02 DE 03 Los tres salen de la misma clase: Cómo crear contenido. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo convertir lo que explicás en llamadas en contenido grabado 01 El flow state: capturar tus mejores respuestas, pensar el hook en vivo y grabar apenas cortás, con la misma voz que usás en la llamada. Cómo hacer que un reel de nicho lo vea mucha gente 02 Engañar al algoritmo: hook abierto, mostrar cosas, revelar tarde y camuflar el caso de éxito en valor. Cómo explicar tu mecanismo en un video de YouTube y ponerle una promesa que venda 03 El mecanismo explicado sin nombrarlo, los fijados, las destacadas y por qué las bases se renuevan cada tres a seis meses. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s5-3":["PLAYBOOK 03 MECANISMO Y PROMESA","PLAYBOOK ANTES 03 DE — EL VIDEO MAIN Y LA PROMESA ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el tercer playbook de la serie: las bases que todo el contenido alimenta. Vas a ver qué son, cómo explicar el mecanismo sin esconderlo detrás de un nombre, cómo construir la promesa desde tu fuerza real, cómo armar fijados y destacadas que digan lo mismo, y por qué orgánico y anuncios alimentan las mismas bases. Al terminar, quien entra desde un reel sabe qué hacés y por qué sos distinto. CO N LAS BASES QUE ALIMENTAN : NI DO CA TO LI MÉ DA D EL PLAYBOOK 03 · EL VID OM QUE LO VEA MUCHA GENTE CO ZO O SI ID N EN HO NT OK CO PLAYBOOK 02 · ENGAÑAR AL ALGORITMO N DE TU E RE QU CO RT Z, ES VO DO : LO MÉ OS SI CH N MU CAPTURAR EL FLOW STATE N TO VE PLAYBOOK 01 · DE LA LLAMADA AL REEL Y VE HOY: TUS MEJORES IDEAS SE PIERDEN AL CORTAR LA LLAMADA ND E FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 Las bases — prioridad uno 02 El mecanismo — sin nombrarlo 03 La promesa — número, sin, algo raro 04 Fijados y destacadas — la misma historia desde tres lugares 05 El mejor funnel — orgánico y anuncios, mismas bases 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 03 — LAS EL VIDEO MAIN Y LA PROMESA ATV 2026 BASES PRIMERO LAS BASES DESPUÉS ALIMENTARLAS Las bases son la prioridad número uno, antes que cualquier calendario. Son el video main de YouTube (el video largo que explica tu mecanismo entero), los posts fijados, las destacadas, la foto y el branding. Todo tiene que transmitir lo mismo: cómo funciona lo tuyo, por qué sos único y por qué no te deberían comparar con nadie. Después, los reels TOFU, MOFU y BOFU, las historias y el tráfico alimentan esas bases lo mejor que puedan. HISTORIA A QUÉ TE ·DEDICÁS, MECANISMO TU ·STORY CASO CLIENTES · PROGRAMA · HISTORIA · WINS CARRUSELES FIJADOS DESTACADAS EL VIDEO MAIN TU MECANISMO EXPLICADO ENTERO FOTO Y BRANDING TODO TRANSMITE LO MISMO: CÓMO FUNCIONA, POR Y POR QUÉ NO TE DEBERÍAN COMPARAR CON NADIE CÓMO QUÉ TE SOS VEN ÚNICO AL ENTRAR LO QUE LAS ALIMENTA REELS TOFU · MOFU · BOFU TRÁFICO AL VIDEO MAIN FIG. 02 — LAS BASES SON LA PRIORIDAD UNO; DESPUÉS SE ALIMENTAN LO MEJOR QUE PUEDAS CÓMO ORDENAR LA HISTORIAS QUE REDIRIGEN PRIORIDAD 01 Antes de programar un calendario nuevo, revisá si tus bases existen: video main, tres fijados, cuatro destacadas, foto y bio. 02 Lo que falte es el próximo calendario: el reel de historia, los carruseles, el video main. 03 Recién con las bases hechas, el contenido semanal tiene a dónde llevar a la gente. → El corazón de las bases es el video main, y el error más común al hacerlo es ponerle un nombre al método y esperar que la gente compre el nombre. Es lo que sigue. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 03 EL — EL VIDEO MAIN Y LA PROMESA ATV 2026 MECANISMO NADIE QUIERE TU MÉTODO QUIERE LA SOLUCIÓN A SU PROBLEMA Un ejemplo real con dos nombres de método: nadie quiere comprar «el método antifrágil» ni «el método ever in value», porque nadie entiende qué son y los nombres no atraen. Lo que la persona quiere es que sus closers cierren más, que suba el show up rate, que se completen los reportes y no estar detrás del equipo de ventas. El nombre va adentro del video, un minuto, chiquito al fondo; lo que se explica lo mejor posible es el mecanismo, y se prueba con casos. Y si tenés tres formas de ayudar, explicás el método único que aplica a las tres. EJEMPLO LO QUE REAL: DOS NOMBRES DE MÉTODO QUE NADIE ENTIENDE «EL MÉTODO ANTIFRÁGIL» «CÓMO ESCALAR A 100K POR MES «EL MÉTODO EVER IN VALUE» SIN ANUNCIOS Y POCO EQUIPO» NADIE ENTIENDE QUÉ ES NI EL NOMBRE ES ATRACTIVO RARO, NADIE LO HIZO: ESO ES LO QUE QUIERO SABER A LA PERSONA LE INTERESA DÓNDE QUE MIS CLOSERS CIERREN MÁS VA EL NOMBRE ADENTRO DEL VIDEO, UN MINUTO, Y SEGUÍS CHIQUITO, AL FONDO; EL NOMBRE ES POR GUSTO QUE SUBA EL SHOW UP RATE Y EL MECANISMO SE EXPLICA LO MEJOR POSIBLE QUE SE COMPLETEN LOS REPORTES CON CASOS QUE MUESTREN QUE FUNCIONA NO ESTAR DETRÁS DEL EQUIPO DE VENTAS ESO ES LO QUE TE COMPRAN EXPLICÁ EL MECANISMO LO MEJOR QUE PUEDAS PARA QUE ATRAIGA; DESPUÉS, EN VENTAS, SE LE DA A CADA UNO LO QUE NECESITA SI TENÉS TRES FORMAS DE AYUDAR, EXPLICÁS EL MÉTODO ÚNICO QUE APLICA A LAS TRES, NO LAS TRES FIG. 03 — NADIE QUIERE COMPRAR TU MÉTODO; QUIERE COMPRAR LA SOLUCIÓN A SUS PROBLEMAS CÓMO 01 EXPLICAR EL MECANISMO SIN NOMBRARLO Escribí el mecanismo en una hoja sin usar su nombre ni una sola vez. Si no podés, todavía no está explicado. 02 Listá los cuatro problemas que resuelve, con las palabras del cliente. Ese es el guion del video main. 03 Nombrá el método una vez, en el medio, y seguí. → Explicado el mecanismo, falta la frase que lo encierra y que la gente quiere comprar: la promesa. Y sale de tu fuerza real, no de lo que suena bien. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 03 LA — EL VIDEO MAIN Y LA PROMESA ATV 2026 PROMESA UN NÚMERO, UN «SIN» Y ALGO QUE NADIE HIZO La promesa se construye desde lo que de verdad te diferencia. Un ejemplo real: una persona cuya fuerza es el equipo y la cultura, no el contenido; de ahí sale «cómo escalar a 100K por mes sin depender del contenido», más profundo, más entendible y más llamativo que «maximización de ventas», que es lo que decía antes. Una promesa tiene un número, un «sin» y algo raro que suene a que nadie lo hizo. Rompe un esquema, y el video explica por qué es real. ¿DE QUÉ DEPENDÉS DE VERDAD? (EJEMPLO REAL) LAS VERSIONES «CÓMO ESCALAR A 300K SIN PRESENCIA DEL FUNDADOR» DEL CONTENIDO DEL EQUIPO «CÓMO ESCALAR A 500K SOLO CON TU EQUIPO DE VENTAS» «CÓMO ESCALAR A 100K POR MES SIN DEPENDER DEL CONTENIDO» U FUERZA ES EL EQUIPO Y LA CULTURA: EL CONTENIDO INFLUYE, PERO NO DEPENDÉS DE ÉL Y DE ESO SALE LA PROMESA MÁS PROFUNDO, MÁS ENTENDIBLE, MÁS LLAMATIVO CÓMO SE ARMA 1 2 3 4 UN NÚMERO UN «SIN» ALGO RARO Y LO PROBÁS 100K, 300K, 900K SIN ANUNCIOS, SIN DEPENDER DEL CONTENIDO, SIN TU TIEMPO QUE SUENE A QUE NADIE LO HIZO EN EL VIDEO: CÓMO, CON QUÉ, CON QUIÉN EJEMPLOS REALES QUE FUNCIONAN: «ASÍ MI EQUIPO ME HIZO 900K SIN DEPENDER DE MÍ» · «MIS CLIENTES NO NECESITAN MI TIEMPO Y TENGO 0% DE REFUND» FIG. 04 — LA PROMESA ROMPE UN ESQUEMA Y DESPUÉS EL VIDEO EXPLICA POR QUÉ ES REAL EJEMPLO Ejemplos reales de promesas: «escalá a 100K sin hacer contenido» parece decir lo contrario de lo que se enseña, y en el video se explica: dejá de subir ese contenido y subí este. «Así mi equipo me hizo 900K sin depender de mí». «Mis clientes no necesitan mi tiempo y tengo 0% de refund». Todas abren una pregunta que el video responde. CÓMO 01 ARMAR LA PROMESA Respondé: ¿de qué dependés de verdad, del contenido o del equipo? Tu promesa sale de lo que no necesitás. 02 Escribí cinco versiones con número, «sin» y algo raro. Elegí la que más te incomoda decir en voz alta. 03 Comprobá que el video main la justifica de punta a punta. → Con mecanismo y promesa definidos, lo que queda del perfil fijo (fijados y destacadas) tiene que contar exactamente lo mismo, porque es lo primero que ve quien entra desde un reel. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 03 — EL FIJADOS VIDEO Y MAIN Y LA PROMESA ATV 2026 DESTACADAS LA MISMA HISTORIA DESDE TRES LUGARES Los tres fijados (tu historia, tu mecanismo y tus casos) y las cuatro destacadas (clientes, programa, historia y wins) tienen un solo trabajo: decir lo mismo que el video main, en corto, para quien entra desde un reel. Para armarlos conviene mirar los fijados de tus referentes, guardarlos en una carpeta y elegir lo que no hace todo el mundo: un reel contando tu historia en vez del carrusel típico. La destacada de wins es la que más se actualiza, porque es la prueba viva de que el mecanismo funciona. LOS TRES FIJADOS DICEN LO MISMO QUE EL VIDEO MAIN TU HISTORIA EL MECANISMO CASOS UN REEL CONTÁNDOLA, NO EL CARRUSEL QUE HACEN TODOS EL MISMO DEL VIDEO MAIN, EN UNA PIEZA CORTA LA PRUEBA DE QUE EL MECANISMO FUNCIONA CÓMO SE LAS DESTACADAS CLIENTES PROGRAMA HISTORIA WINS WINS: LA QUE MÁS SE ACTUALIZA ARMAN 1 MIRÁ LOS FIJADOS DE TUS REFERENTES 2 ELEGÍ EL QUE NO HACE TODO EL MUNDO 3 Y QUE DIGA LO MISMO QUE EL VIDEO MAIN UNA CARPETA CON TODOS LOS CARRUSELES Y REELS FIJADOS DE LA GENTE QUE SEGUÍS UN REEL DE HISTORIA EN VEZ DEL CARRUSEL TÍPICO MISMO MECANISMO, MISMA PROMESA, EN UNA PIEZA CORTA FIJADOS, DESTACADAS Y VIDEO MAIN CUENTAN LA MISMA HISTORIA DESDE TRES LUGARES FIG. 06 — EL PERFIL FIJO COMO PRIMERA IMPRESIÓN: LO QUE VE EL QUE ENTRA DESDE UN REEL CÓMO ARMAR FIJADOS Y DESTACADAS 01 Armá una carpeta con los fijados de cinco referentes y anotá qué hace cada uno. 02 Grabá el reel de tu historia con la promesa adentro, y fijalo primero. 03 Mantené la destacada de wins viva: es la que más se actualiza. → Con las bases completas, queda entender por qué son el mejor funnel que vas a correr, y por qué orgánico y anuncios terminan alimentando lo mismo. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 03 EL — EL VIDEO MEJOR MAIN Y LA PROMESA ATV 2026 FUNNEL ORGÁNICO Y ANUNCIOS ALIMENTAN LAS MISMAS BASES Buenas bases son buenos casos de éxito, un mecanismo bien explicado y los dolores bien tocados. El orgánico las alimenta con TOFU, MOFU y BOFU; los anuncios, cuando lleguen, son un espejo del orgánico: follow me, retargeting MOFU y BOFU con el mismo contenido. Un ejemplo real: una persona factura 300K por mes y lleva sesenta días sin grabar un anuncio, porque sus bases son buenas. Y se renuevan cada tres a seis meses: un video main de nueve meses sigue funcionando, pero ya está viejo. BUENAS BASES CASOS DE ÉXITO · MECANISMO BIEN EXPLICADO · DOLORES BIEN TOCADOS ORGÁNICO FOLLOW ME · RETARGETING MOFU · RETARGETING BOFU ANUNCIOS TOFU · MOFU · BOFU SE ARMAN CON EL MISMO CONTENIDO UN ESPEJO DEL ORGÁNICO EJEMPLO REAL: UNA PERSONA FACTURA 300K POR MES Y LLEVA 60 DÍAS SIN GRABAR UN ANUNCIO, PORQUE TIENE BUENAS BASES LAS BASES SE RENUEVAN CADA TRES A SEIS MESES: UN VIDEO MAIN GRABADO HACE NUEVE MESES SIGUE FUNCIONANDO, PERO YA ESTÁ VIEJO Y CUESTA ARMARLO: FUERON MESES DE DATOS HASTA PODER HACER UNA BUENA BASE ESTE ES EL MEJOR FUNNEL QUE VAS A CORRER: PRIMERO LAS BASES, DESPUÉS ALIMENTARLAS FIG. 05 — ORGÁNICO Y ANUNCIOS ALIMENTAN LAS MISMAS BASES; POR ESO PRIMERO SE ARMAN LAS BASES CÓMO MANTENER EL FUNNEL 01 Ponele fecha de vencimiento a tus bases: a los seis meses se regraban con los datos nuevos. 02 Si vas a correr anuncios, usá las mismas piezas que ya funcionan en orgánico, no creativos nuevos. 03 Medí las bases por una sola cosa: cuánta gente que llega desde un reel termina viendo el video main. → Bases, mecanismo, promesa, fijados y funnel: el sistema está completo. Los próximos siete días lo instalan. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 03 — EL SIETE VIDEO MAIN Y LA PROMESA ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 INVENTARIO DÍA 03 PROMESA DÍA 02 MECANISMO DÍA 05 TU HISTORIA DÍA 04 VIDEO MAIN DÍA 07 RENOVACIÓN LISTO DÍA 06 DESTACADAS DÍA 01 Inventariá tus bases. Video main, fijados, destacadas, foto, bio. Qué existe y qué falta. DÍA 02 Escribí el mecanismo sin nombrarlo. Una hoja. Los cuatro problemas que resuelve, con las palabras del cliente. DÍA 03 Elegí la promesa. Cinco versiones con número, «sin» y algo raro. Quedate con la que incomoda. DÍA 04 Guionizá el video main. La promesa, el mecanismo, los casos. El nombre, un minuto en el medio. DÍA 05 Grabá el reel de tu historia. Con la promesa adentro. Es el primer fijado. DÍA 06 Armá las destacadas. Clientes, programa, historia y wins. DÍA 07 Fijá la fecha de renovación. Seis meses. Y el próximo calendario alimenta estas bases. Cómo sabés que funciona A las cuatro semanas quien entra desde un reel encuentra la misma historia en fijados, destacadas y YouTube. Si la gente llega y no sabe qué hacés, volvé al día 02: el mecanismo sigue escondido detrás del nombre. AUMENTA TU VALOR 08","PLAYBOOK LA 03 — EL VIDEO MAIN Y LA PROMESA ATV 2026 SERIE ESTE ES EL PLAYBOOK 03 DE 03 Los tres salen de la misma clase: Cómo crear contenido. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo convertir lo que explicás en llamadas en contenido grabado 01 El flow state: capturar tus mejores respuestas, pensar el hook en vivo y grabar apenas cortás, con la misma voz que usás en la llamada. Cómo hacer que un reel de nicho lo vea mucha gente 02 Engañar al algoritmo: hook abierto, mostrar cosas, revelar tarde y camuflar el caso de éxito echaza, no comenta y no va. Un tráiler hace otra cosa: te mete dentro del problema, te da un insight parcial que no viste en otro lado y te deja una pregunta abierta que solo se cierra en el video largo. Si el reel da todo el valor, nadie va; si no da nada, tampoco. EL ANUNCIO EL «TENGO UN VIDEO SOBRE TAL COSA, ANDÁ A VERLO» SE INTERPRETA COMO ANUNCIO Y SE RECHAZA NO COMENTAN, NO VAN AL VIDEO TRÁILER · TE METE DENTRO DEL PROBLEMA · TE DA UN INSIGHT PARCIAL: «ESTO NO LO VI EN OTRO LADO» · TE DEJA UNA PREGUNTA ABIERTA · QUE SOLO SE CIERRA EN EL VIDEO LARGO POR QUÉ FUNCIONA ASÍ: YOUTUBE ES DONDE ESTÁ EL VALOR QUE LA PERSONA RECIBE; TODO LO DEMÁS SON TRÁILERS SI EL REEL DA TODO EL VALOR, NADIE VA AL VIDEO; SI NO DA NADA, NADIE VA TAMPOCO COMO SPIDER-MAN: LA PELÍCULA PUEDE NO GUSTARTE, PERO EL TRÁILER TE LLEVA AL CINE; Y UN VIDEO MALO SE RECUPERA CON MEJORES TRÁILERS SI ENTENDÉS LA INTENCIÓN, PODÉS CREAR UN REEL Y SENTIR «ESTE SÉ QUE VA A FUNCIONAR» NO ES QUE LOS REELS O LOS VIDEOS NO FUNCIONEN: ES QUE NO SE HICIERON CON ESTA INTENCIÓN FIG. 02 — EL REEL QUE REDIRIGE A YOUTUBE TIENE QUE FUNCIONAR COMO TRÁILER DEL VIDEO, NO COMO SU ANUNCIO CÓMO DISTINGUIR UN TRÁILER DE UN ANUNCIO 01 Mirá tus últimos reels que redirigen a YouTube y marcá cuáles son anuncios («tengo un video sobre…»). 02 Para cada uno, escribí qué pregunta tendría que dejar abierta para que la persona necesite el video. 03 Antes de grabar el próximo, decí en voz alta: «este lo subo porque sé que va a funcionar». Si no podés decirlo, falta la intención. → La estructura completa del tráiler se ve mejor con un ejemplo real: un reel corto que llevó 1600 personas a un video. Es lo que sigue. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 01 LA — REELS COMO TRÁILER ATV 2026 ESTRUCTURA UN INSIGHT PARCIAL Y UNA PREGUNTA QUE NO SE CIERRA Un ejemplo real: el reel que mejor funcionó en una cuenta era corto y costó menos que otros, pero cumplió la función de tráiler a la perfección. Identifica al avatar con una historia, toca el dolor profundo (gano plata pero no vivo), le dice que lo de antes estaba bien pero ya no, suelta un insight parcial (dividí el negocio en tres áreas y me hice una sola pregunta) y deja la pregunta abierta: «si mañana esto deja de funcionar, ¿alguien sabe qué hacer sin preguntarme?». El CTA cierra con fuerza: comentá la palabra y te mando el video entero. EJEMPLO REAL: EL REEL QUE MEJOR FUNCIONÓ 1 IDENTIFICA AL AVATAR CON UNA HISTORIA 2 TOCA EL DOLOR PROFUNDO 3 LE DICE QUE LO DE ANTES ESTABA BIEN 4 EL INSIGHT PARCIAL 5 LA PREGUNTA ABIERTA 6 EL CTA CON FUERZA EN UNA CUENTA, PASO POR PASO «DEJÉ DE TRABAJAR PARA MI NEGOCIO QUE ME GENERABA 40K Y FUE LA MEJOR DECISIÓN» «GANO PLATA PERO NO VIVO: ESTOY DETRÁS DEL EQUIPO, DE LOS PROCESOS, CREANDO TODO YO» «AL PRINCIPIO ES NECESARIO; PERO YA TENÉS EQUIPO Y NADA CRECE SIN VOS» «DIVIDÍ EL NEGOCIO EN TRES ÁREAS Y ME HICE UNA SOLA PREGUNTA POR ÁREA» «SI MAÑANA ESTO DEJA DE FUNCIONAR, ¿ALGUIEN SABE QUÉ HACER SIN PREGUNTARME?» «SI QUERÉS EL VIDEO ENTERO MÁS EL PROMPT, COMENTÁ PROCESO» EL REEL ERA CORTO Y COSTÓ MENOS QUE OTROS; PERO CUMPLIÓ LA FUNCIÓN: 2000 VIEWS EN EL REEL, 1600 EN EL VIDEO Y ES EL ÚNICO REEL QUE SE SUBIÓ SABIENDO QUE IBA A FUNCIONAR FIG. 03 — LA PREGUNTA NO SE CIERRA EN EL REEL: LA GENTE COMENTA Y VA AL VIDEO A CERRARLA CÓMO ESCRIBIR UN TRÁILER 01 Tomá tu mejor video de YouTube y escribí su tráiler con los seis pasos de la figura. 02 El insight parcial tiene que ser real: un pedazo del método, no una promesa. 03 La pregunta abierta es la que el video responde en el minuto diez, no en el primero. → Para que el tráiler sea fácil de escribir, el video largo tiene que existir primero, y tiene que ser algo que la gente quiera. Por eso se piensa desde YouTube hacia atrás, y es lo que sigue. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 01 — REELS DESDE COMO YOUTUBE TRÁILER HACIA ATV 2026 ATRÁS PRIMERO EL VIDEO LARGO DESPUÉS EL TRÁILER Un error común: grabás un video teórico, lo subís a historias y ahí te das cuenta de que la gente no quiere ese recurso. Al revés funciona: primero pensás qué quiere la gente, eso es el video largo, y después el tráiler. Así ya sabés que la secuencia que lo anuncia va a funcionar. La cadencia semanal que lo sostiene es dos reels de atracción más dos con CTA a YouTube: uno hacia un video nuevo y uno hacia un video que ya existe. EL ORDEN EQUIVOCADO DESDE GRABÁS UN VIDEO TEÓRICO LO SUBÍS A HISTORIAS «LA GENTE NO QUIERE ESTE RECURSO» YOUTUBE HACIA ¿QUÉ QUIERE LA GENTE? ATRÁS ESE ES EL VIDEO LARGO DESPUÉS, EL TRÁILER SI PENSÁS PRIMERO EL VIDEO COMO ALGO QUE LA GENTE VA A QUERER, YA SABÉS QUE LA SECUENCIA QUE LO ANUNCIA VA A FUNCIONAR LA CADENCIA REEL DE ATRACCIÓN REEL DE ATRACCIÓN REEL CON CTA A YOUTUBE REEL CON CTA A YOUTUBE TOFU TOFU TRÁILER DE UN VIDEO NUEVO TRÁILER DE UN VIDEO QUE VENDIÓ DOS DE ATRACCIÓN MÁS DOS CON CTA POR SEMANA: SOSTENIBLE, Y APROVECHA LOS VIDEOS QUE YA EXISTEN CADA REEL CON CTA APUNTA A UN VIDEO DISTINTO: UNO NUEVO, UNO QUE YA EXISTE LOS VIDEOS DE YOUTUBE NO ESTÁN MUERTOS: HAY QUE APROVECHARLOS CON MEJORES TRÁILERS Y ASÍ EL CANAL QUEDA BONITO: 1K, 1K, 1.5K, 2K FIG. 04 — PRIMERO LA IDEA LARGA, DESPUÉS EL REEL QUE LA CUENTA; DOS MÁS DOS POR SEMANA CÓMO ORDENAR YOUTUBE Y REELS 01 Antes de grabar un video, preguntale a tu audiencia qué quiere o mirá qué pidieron en el DM. Eso es el video. 02 Armá la semana con las cuatro casillas: dos de atracción, dos tráilers. 03 Cada semana, uno de los dos tráilers apunta a un video que ya tenés subido. → De los dos tráilers semanales, uno no apunta a un video nuevo sino a uno que ya existe. Por qué los videos que ya funcionaron valen más es lo que sigue. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 01 — REELS COMO TRÁILER ATV 2026 ROTAR UN VIDEO QUE YA VENDIÓ SOLO NECESITA UN MEJOR TRÁILER Un ejemplo real: un canal con videos de 2500, 1400 y 1200 views. Son activos que ya se probaron y funcionaron. YouTube los califica por retención, no solo por el tráfico que traés, así que uno o dos tráilers al mes tienen que apuntar a esos videos, no a los últimos tres. Un video que ya vendió solo necesita que una persona más llegue a él. ¿Cómo saber cuál vendió? Dos preguntas al cliente: cuál te gustó más (el que lo hizo seguirte) y cuál te dio más valor (el que lo hizo comprar, en el cien por ciento de los casos). EJEMPLO REAL: LOS VIDEOS DE UN CANAL 2500 views 1400 1200 nuevo YA PROBADO YA PROBADO YA PROBADO DE ESTA SEMANA TRÁILER NUEVO TRÁILER NUEVO TRÁILER NUEVO TRÁILER NUEVO ACTIVOS QUE YA PROBASTE Y FUNCIONARON: YOUTUBE LOS CALIFICA POR RETENCIÓN, NO SOLO POR EL TRÁFICO QUE TRAÉS UNO O DOS AL MES DE ESTE ESTILO TIENEN QUE EXISTIR ENTRE TUS REELS; LO ÚNICO QUE CAMBIA ES EL TRÁILER CÓMO SABER CUÁL VENDIÓ «¿CUÁL FUE EL VIDEO MÍO QUE MÁS TE GUSTÓ?» «¿CUÁL FUE EL VIDEO QUE MÁS VALOR TE DIO?» EL QUE LOS HIZO SEGUIRTE O CONECTAR EL VIDEO CON EL QUE TE COMPRARON, EN EL CIEN POR CIENTO DE LOS CASOS ESO ES ATRACCIÓN ESO ES CONVERSIÓN SI NO LO PUEDEN DECIR, MIRÁ QUÉ HISTORIAS O REELS CONTESTARON ANTES DE AGENDAR: AHÍ ESTÁ EL VIDEO QUE LOS NUTRIÓ FIG. 05 — UN VIDEO QUE YA FUNCIONÓ SOLO NECESITA QUE UNA PERSONA MÁS LLEGUE A ÉL CÓMO ROTAR HACIA LO QUE YA VENDE 01 Hacele a tus últimos cinco clientes las dos preguntas. Los videos de la segunda respuesta son los que rotan. 02 Si no lo pueden decir, mirá qué historias o reels contestaron antes de agendar. 03 Programá un tráiler al mes para cada uno de esos videos, con un gancho distinto cada vez. → Rotar tráilers hacia los mismos videos abre una pregunta: de todos los ganchos posibles, ¿cuál convierte mejor? Para responderla hay un laboratorio, y es lo último. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 01 EL — REELS COMO TRÁILER ATV 2026 LABORATORIO DOS SEMANAS DE PRUEBA Y DESPUÉS, SISTEMA El laboratorio de reels es simple: para cada video de YouTube que ya tenés, probás tres ganchos distintos durante dos semanas y mirás qué formato de CTA convierte mejor. Gancho, cuerpo y cómo tirás el CTA; lo que funciona se sistematiza y se replica al resto de los videos. Y una aclaración que ahorra frustración: en YouTube, calidad es la idea y el valor, no la edición. Pelearse con el editor por correcciones no es hacer calidad. UN VIDEO DE YOUTUBE SE REPLICA AL RESTO TRES GANCHOS DISTINTOS EL LABORATORIO DE REELS EL CTA QUE CONVIERTE DOS SEMANAS DE PRUEBA GANCHO, CUERPO Y CÓMO TIRÁS EL CTA: LO QUE CONVIERTE MEJOR SE SISTEMATIZA PARA TODOS LOS VIDEOS QUE YA TENÉS Y UNA ACLARACIÓN: EN YOUTUBE, CALIDAD ES LA IDEA Y EL VALOR, NO LA EDICIÓN FRUSTRARSE PORQUE EL EDITOR RECIBE MUCHAS CORRECCIONES NO ES HACER CALIDAD: ES HACER EDICIÓN «TENEMOS QUE CREAR ESTE VIDEO PORQUE LA GENTE QUIERE TAL COSA»: ESO ES CALIDAD FIG. 06 — DOS SEMANAS DE PRUEBA POR VIDEO Y DESPUÉS, SISTEMA CÓMO MONTAR EL LABORATORIO 01 Elegí el video que más vendió y escribí tres ganchos para su tráiler. Subí uno por semana. 02 Anotá qué gancho trajo más comentarios con la palabra. Ese se replica a los demás videos. 03 Cuando discutas calidad, preguntate si hablás de la idea o de la edición. Solo la primera importa. → Tráiler, estructura, orden, rotación y laboratorio: el sistema de reels está completo. Los próximos siete días lo instalan. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 01 — REELS SIETE DÍAS COMO TRÁILER ATV 2026 LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 ANUNCIO O TRÁILER DÍA 03 LOS QUE VENDEN DÍA 02 DOS PREGUNTAS DÍA 05 DOS MÁS DOS DÍA 04 UN TRÁILER DÍA 07 PRÓXIMO VIDEO LISTO DÍA 06 LABORATORIO DÍA 01 Separá tus reels en anuncios y tráilers. Los últimos diez que redirigen a YouTube. DÍA 02 Preguntales a cinco clientes. Cuál les gustó más y cuál les dio más valor. DÍA 03 Elegí los tres videos que venden. Los de la segunda respuesta, aunque tengan pocas views. DÍA 04 Escribí un tráiler con los seis pasos. Para el video que más vendió. DÍA 05 Armá la semana dos más dos. Dos de atracción, un tráiler nuevo, un tráiler a un video que ya vende. DÍA 06 Lanzá el laboratorio. Tres ganchos para el mismo video, uno por semana. DÍA 07 Pensá el próximo video desde la gente. Qué pidieron en el DM. Ese es el video del mes. Cómo sabés que funciona A las cuatro semanas los videos viejos vuelven a recibir visitas y los comentarios con la palabra suben. Si siguen sin ir al video, volvé al día 04: el reel está dando todo o no está dando nada. AUMENTA TU VALOR 08","PLAYBOOK LA 01 — REELS COMO TRÁILER ATV 2026 SERIE ESTE ES EL PLAYBOOK 01 DE 03 Los tres salen de la misma clase: Estrategia de contenido: reels, historias y YouTube. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo hacer que tus reels lleven gente a YouTube 01 El reel como tráiler, no como anuncio: un insight parcial y una pregunta que solo se cierra en el video largo. Cómo tener muchas respuestas en tus CTAs 02 La urgencia en el CTA, la pieza que falta del rompecabezas y las historias que educan antes de la llamada. Cómo adaptar lo que le funciona a otro a tu propia marca 03 Entender la intención detrás de cada formato, la calidad como idea y no como edición, y tus sistemas como contenido. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s6-2":["PLAYBOOK 02 RESPUESTAS EN TUS CTAS","PLAYBOOK ANTES 02 DE — RESPUESTAS EN TUS CTAS ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el segundo playbook de la serie: cómo pedir desde historias sin sonar a anuncio. Vas a ver por qué un CTA tiene que sentirse urgente, cómo usar tu propio tono para pedir, por qué siempre tiene que faltar una pieza, cómo hacer que el video mismo pida con un código y cómo educar una objeción antes de la PLAYBOOK 03 · ADAPTA A EL AN N UN CO CI O llamada. Al terminar, las redirecciones tienen decenas de respuestas y los leads llegan educados. NA CT CA AS DA QU CA E : SU DO EN TO AN MÉ LA INTENCIÓN, NO LA COP L Y PLAYBOOK 02 · RESPUESTAS EN TUS CTAS CU VE URGENCIA Y LA PIEZA QUE FALTA FU QU E SU NA LE DI E MP VI DEL REEL AL VIDEO LARGO TO IM MÉ AL EN N SE HOY: YOUTUBE NO TE TRAE CLIENTES Y LOS REELS NO LLEVAN A NADIE N FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS TA SI Y DO N : DE IÓ OS NC PLAYBOOK 01 · REELS COMO TRÁILER ÍNDICE 01 La urgencia — lo tengo que ver ahora 02 El tono — el formato que ya funciona, también para pedir 03 La pieza que falta — el qué y el por qué, no todo 04 El código — que el video te haga pedir 05 Educar — la objeción antes de la llamada 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 02 LA — RESPUESTAS EN TUS CTAS ATV 2026 URGENCIA NO «QUÉ INTERESANTE» «LO TENGO QUE VER AHORA» Cuando redirigís desde historias a un video y contestan cinco personas, no es un problema de la audiencia: es cómo vendiste el video. Un ejemplo real con el mismo video: «subí un video nuevo sobre x» suena interesante, y lo interesante se ve después; en la segunda historia dijo «mis clientes me pagan 25.000 por esto», que suena urgente y exclusivo, y explotó. La audiencia tiene que sentir que perderse el video es una pérdida: por eso funcionan «lo borro en 24 horas», la exclusividad o camuflarlo en una historia de viaje. EJEMPLO REAL: DOS FORMAS DE REDIRIGIR AL MISMO VIDEO «SUBÍ UN VIDEO NUEVO SOBRE X» QUÉ SINTIÓ LA «MIS CLIENTES ME PAGAN 25.000 POR ESTO» SUENA INTERESANTE SUENA URGENTE Y EXCLUSIVO «LO VEO DESPUÉS»: CINCO RESPUESTAS «LO TENGO QUE VER AHORA»: EXPLOTÓ AUDIENCIA EN LA SECUENCIA QUE FUNCIONÓ QUE PERDERSE EL VIDEO ERA UNA PÉRDIDA NO ES UN PROBLEMA DE LA AUDIENCIA: ES UN PROBLEMA DE CÓMO VENDISTE EL VIDEO FORMAS DE CREAR LA URGENCIA EXCLUSIVIDAD TIEMPO CAMUFLAJE UN 50% OFF «POR ESTO ME PAGAN 25K» «LO BORRO EN 24 HORAS» UNA HISTORIA DE VIAJE QUE TERMINA EN EL LINK TODOS VAN CUANDO SIENTEN QUE SE LO PIERDEN EN TU CUENTA FUNCIONA LO QUE EN OTRA NO: PROBÁ CUÁL URGENCIA ES LA TUYA FIG. 02 — EL CTA HACIA UN RECURSO TIENE QUE SONAR A «LO TENGO QUE VER AHORA», NO A «QUÉ INTERESANTE» CÓMO CREAR LA URGENCIA 01 Antes de redirigir, escribí el CTA y preguntate: ¿suena a «qué interesante» o a «lo tengo que ver ahora»? 02 Probá una urgencia distinta cada semana: exclusividad, tiempo, camuflaje. Anotá cuál funciona en tu cuenta. 03 Si contestaron cinco, no cambies el video: cambiá cómo lo vendiste. → La urgencia es qué decís al pedir; el tono es cómo lo decís. Y el tono que funciona ya lo tenés en tus propias historias, en las que mejor te responden. Es lo que sigue. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 02 EL — RESPUESTAS EN TUS CTAS ATV 2026 TONO USÁ EL FORMATO QUE FUNCIONA TAMBIÉN PARA PEDIR Un ejemplo real: en una cuenta, las historias de conversación, confianza y valor funcionan muy bien (la secuencia de los lunes tiene 216 respuestas), pero cuando redirigen a YouTube con tono de anuncio, casi nadie responde. Esa secuencia de los lunes es el formato que su audiencia consume y el tono que acepta. Cuando redirigís con tono de anuncio, la gente dice «no quiero ver este recurso». La solución no es inventar otro tono: es adaptar el CTA a YouTube desde el mismo tono de los lunes. Y una corrección a las historias de valor: no solo plantear el problema, también cerrar la idea. LO QUE SÍ FUNCIONA EN TUS HISTORIAS (EJEMPLO REAL) LO QUE NO FUNCIONA LA SECUENCIA DE LOS LUNES REDIRIGIR CON TONO DE ANUNCIO 216 RESPUESTAS: CONVERSACIÓN, CONFIANZA Y VALOR «NUEVO RECURSO, ANDÁ A VERLO» ESE ES EL FORMATO QUE TU AUDIENCIA CONSUME LA GENTE DICE «NO QUIERO VER ESTE RECURSO» Y EL TONO QUE ACEPTA ADAPTÁ EL CTA A YOUTUBE DESDE ESE MISMO TONO: USÁ LOS CONCEPTOS QUE YA PROBASTE Y REPLICALOS Y UNA CORRECCIÓN A LAS HISTORIAS DE VALOR 1 2 3 PLANTEAR EL PROBLEMA CERRAR LA IDEA Y RECIÉN AHÍ, EL PEDIDO LO QUE YA HACÉS LO QUE FALTABA: LA PERSONA SE VA CON UNA CONCLUSIÓN CON EL FORMATO QUE FUNCIONA LAS HISTORIAS SIGUEN SIENDO PARA CONVERSACIÓN, CONFIANZA Y VALOR; CUANDO REDIRIGEN, LO HACEN CON SU PROPIO TONO FIG. 03 — NO CAMBIES LO QUE FUNCIONA: USALO TAMBIÉN PARA PEDIR CÓMO USAR TU PROPIO TONO PARA PEDIR 01 Identificá tu secuencia con más respuestas y escribí qué tiene: ritmo, lenguaje, estructura. 02 Reescribí el próximo CTA a YouTube con exactamente ese formato. 03 En cada historia de valor, agregá el cierre: la conclusión con la que la persona se va. → Pedir bien trae gente al video. Para que del video pasen a la conversación y de la conversación a la compra, siempre tiene que faltarles una pieza. Es lo que sigue. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 02 LA — RESPUESTAS PIEZA QUE EN TUS CTAS ATV 2026 FALTA DALES EL QUÉ Y EL POR QUÉ PERO QUE SIEMPRE FALTE ALGO La gente quiere lo práctico y copiable: por ejemplo, «los cinco prompts» o «el laboratorio para facturar 50K con historias». Está bien darlo, con el qué y el por qué, incluso el prompt. Pero si das todo para copiar y pegar, no te compran. Siempre tiene que faltar una pieza para completar el rompecabezas, y esa pieza está adentro de tu programa. Así se arma la cadena: en el reel falta algo y comentan; en el video falta algo y abren conversación; en la conversación falta algo y compran. LA QUÉ POR QUÉ CÓMO CADENA 1 2 EL PROMPT ? EL CASO 3 DAS EL QUÉ Y EL POR QUÉ, MOSTRÁS LOS SISTEMAS, DE «ME FALTA ALGO» EN EL REEL «ME FALTA ALGO» → COMENTA LA PALABRA EN EL VIDEO «ME FALTA ALGO» → ABRE CONVERSACIÓN EN LA CONVERSACIÓN «ME FALTA ALGO» → COMPRA INCLUSO EL PROMPT; PERO A TUS CLIENTES LES DAS TODO HECHO Y LA ESTRATEGIA SIEMPRE TIENE QUE FALTAR UNA PIEZA SI DAS TODO PARA COPIAR Y PEGAR, NO TE COMPRAN LA GENTE QUIERE LO PRÁCTICO Y COPIABLE: «LOS 5 PROMPTS QUE ME HICIERON FACTURAR 20K CON UNA SECUENCIA DE STORIES» Y ESTÁ BIEN, MIENTRAS SIENTAN QUE DENTRO DE TU PROGRAMA ESTÁN LAS PIEZAS QUE FALTAN MOSTRALE A LA GENTE QUE TE TIENE QUE PEDIR ALGO: DESDE EL VIDEO HACIA TUS CONVERSACIONES FIG. 04 — EL VALOR ABRE LA CONVERSACIÓN; LA PIEZA QUE FALTA CIERRA LA VENTA EJEMPLO Mostrás los sistemas que usás para crear contenido y por qué funcionan. Cerrás con: «si querés el prompt, está acá; a mis clientes les doy todos los sistemas hechos, más el laboratorio, más la estrategia». La persona siente qué le falta y te lo pide. → Hasta acá, las historias piden. Hay una forma de hacer que el propio video también pida: un código escondido que la persona tiene que mandarte para completar lo que le falta. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 02 EL — RESPUESTAS EN TUS CTAS ATV 2026 CÓDIGO QUE EL VIDEO TE HAGA PEDIR Al principio del video decís que hay un código escondido y no decís en qué minuto. La persona lo ve entero por el FOMO de encontrarlo, te lo manda a tus conversaciones y recibe el recurso; y después lo comenta («está en el 3:15»), lo que suma comentarios. Es lo mismo que hace un influencer cuando te da un código para la página: te hace pedir. Una variante es sortear el recurso entre los que lo piden. El objetivo siempre es que la gente abra la conversación. AL PRINCIPIO DEL VIDEO LA PERSONA LO VE ENTERO LO MANDA A TUS CONVERSACIONES Y LO COMENTA HAY UN CÓDIGO ESCONDIDO; NO DIGO EL MINUTO» FOMO POR ENCONTRARLO Y RECIBE EL RECURSO «ESTÁ EN EL 3:15»: MÁS COMENTARIOS COMO EL INFLUENCER QUE TE DA UN CÓDIGO PARA LA PÁGINA: TE HACE PEDIR VARIANTE: SORTEAR EL RECURSO DE VALOR ENTRE LOS QUE LO PIDEN EL OBJETIVO ES EL MISMO: QUE LA GENTE ABRA LA CONVERSACIÓN FUNCIONA ESPECIALMENTE CON EL TIPO DE GENTE QUE TE CONSUME A VOS: PROBALO Y NO DEJES DE TESTEAR FIG. 05 — EL VIDEO TAMBIÉN PUEDE PEDIR: QUE LA PERSONA TENGA QUE MANDARTE ALGO PARA COMPLETAR CÓMO HACER QUE EL VIDEO PIDA 01 Elegí un video de valor y escondé un código en un punto que obligue a ver más de la mitad. 02 Anunciálo al principio, sin el minuto, y explicá qué recibe el que lo manda. 03 Medí una sola cosa: cuántas conversaciones abrió ese video contra el anterior. → Las historias piden y el video pide. Queda un último uso de las historias, pensado para ventas: resolver una objeción antes de que llegue a la llamada. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 02 — RESPUESTAS EN TUS CTAS ATV 2026 EDUCAR LA OBJECIÓN SE RESUELVE ANTES DE LA LLAMADA Un ejemplo real: en un negocio, la única objeción que no dejaba cerrar el mes era la garantía. Si llega así es porque nadie la educó antes, y el trabajo de marketing es que lleguen educados: dos o tres veces por semana, en historias. Cómo se educa, en ese caso: mostrás un cliente que probó catorce programas antes de entrar (con los nombres tachados): todos le dieron garantía y ninguno cumplió. Reencuadrás: si pedís garantía es porque ya probaste y te fallaron; la garantía está hecha para no devolver. Y la única garantía real son los resultados que se suben todas las semanas. LA OBJECIÓN CÓMO SE QUE FRENA EL MES «¿QUÉ GARANTÍA TENGO?» EDUCAR DESDE EL CONTENIDO LA ÚNICA OBJECIÓN QUE NO DEJA CERRAR DOS O TRES VECES ESTA SEMANA, EN HISTORIAS LLEGA ASÍ PORQUE NADIE LA EDUCÓ ANTES HASTA QUE DÉ VERGÜENZA LLEGAR ASÍ EDUCA MOSTRÁ UN CASO QUE PROBÓ 14 PROGRAMAS ANTES TACHÁS LOS NOMBRES; TODOS LE DIERON GARANTÍA Y NINGUNO CUMPLIÓ EL REENCUADRE SI PEDÍS GARANTÍA ES PORQUE YA PROBASTE Y TE FALLARON; LA GARANTÍA ESTÁ HECHA PARA NO DEVOLVER LA ÚNICA GARANTÍA LOS RESULTADOS, QUE SE SUBEN TODAS LAS SEMANAS METELO EN UN RECURSO «¿DÓNDE PUEDO TOCAR LA OBJECIÓN ACÁ?»: CUALQUIER RECURSO DE VALOR SIRVE EN LA LLAMADA SE HACE LO MISMO, PERO ESO YA ES VENTAS; ACÁ EL TRABAJO ES QUE LLEGUEN EDUCADOS FIG. 06 — LAS HISTORIAS TAMBIÉN RESUELVEN OBJECIONES ANTES DE QUE APAREZCAN CÓMO EDUCAR ANTES DE LA LLAMADA 01 Preguntale al closer cuál es la objeción del mes. Esa es tu historia de esta semana, tres veces. 02 Buscá en tus onboardings un cliente que probó muchos programas antes y contalo, sin nombres. 03 Cuando subas un recurso de valor, preguntate dónde entra la objeción y metela ahí. → Urgencia, tono, pieza, código y educación: las historias ya piden y se responden. Los próximos siete días lo instalan. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 02 — RESPUESTAS SIETE EN TUS CTAS ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 URGENCIA DÍA 03 EL CIERRE DÍA 02 EL TONO DÍA 05 EL CÓDIGO DÍA 04 LA PIEZA DÍA 07 EDUCAR LISTO DÍA 06 LA OBJECIÓN DÍA 01 Reescribí el último CTA a YouTube. De «qué interesante» a «lo tengo que ver ahora». Elegí una urgencia. DÍA 02 Desarmá tu secuencia con más respuestas. Ritmo, lenguaje, estructura. Ese es el tono. DÍA 03 Agregá el cierre a tus historias de valor. La conclusión con la que la persona se va. DÍA 04 Marcá la pieza que falta. En tu próximo recurso: qué das y qué queda adentro del programa. DÍA 05 Escondé un código en un video. Anunciado al principio, sin el minuto. DÍA 06 Preguntale al closer la objeción del mes. Y buscá el caso que la desarma. DÍA 07 Subí la historia de educación. Tres veces en la semana, en distintos formatos. Cómo sabés que funciona A las cuatro semanas las redirecciones a YouTube tienen decenas de respuestas, no cinco, y el closer dice que la objeción bajó. Si siguen contestando pocos, volvé al día 02: estás pidiendo con tono de anuncio. AUMENTA TU VALOR 08","PLAYBOOK LA 02 — RESPUESTAS EN TUS CTAS ATV 2026 SERIE ESTE ES EL PLAYBOOK 02 DE 03 Los tres salen de la misma clase: Estrategia de contenido: reels, historias y YouTube. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo hacer que tus reels lleven gente a YouTube 01 El reel como tráiler, no como anuncio: un insight parcial y una pregunta que solo se cierra en el video largo. Cómo tener muchas respuestas en tus CTAs 02 La urgencia en el CTA, la pieza que falta del rompecabezas y las historias que educan antes de la llamada. Cómo adaptar lo que le funciona a otro a tu propia marca 03 Entender la intención detrás de cada formato, la calidad como idea y no como edición, y tus sistemas como contenido. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s6-3":["PLAYBOOK 03 ADAPTARLO A TU MARCA","PLAYBOOK ANTES 03 DE — ADAPTARLO A TU MARCA ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el tercer playbook de la serie: cómo adaptar lo que le funciona a otro sin copiarlo. Vas a ver por qué la forma no se transfiere y la intención sí, cómo romper la misma objeción desde tu mundo, cómo simplificar un sistema ajeno hasta que se ejecuta, cómo tus propios sistemas se vuelven video, tendencia y oferta, y cómo calibrar el ritmo a tu marca. Al terminar, tenés una estrategia que es tuya y no una copia PLAYBOOK 03 · ADAPTA A EL AN N UN CO CI O que no funciona. NA CT CA AS DA QU CA E : SU DO EN TO AN MÉ LA INTENCIÓN, NO LA COP L Y PLAYBOOK 02 · RESPUESTAS EN TUS CTAS CU VE URGENCIA Y LA PIEZA QUE FALTA FU QU E SU NA LE DI E MP VI DEL REEL AL VIDEO LARGO TO IM MÉ AL EN N SE HOY: YOUTUBE NO TE TRAE CLIENTES Y LOS REELS NO LLEVAN A NADIE N FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS TA SI Y DO N : DE IÓ OS NC PLAYBOOK 01 · REELS COMO TRÁILER ÍNDICE 01 La intención — no la forma 02 El ejemplo — la misma objeción desde tu mundo 03 Simplificar — hasta que se ejecuta 04 Tus sistemas — contenido y oferta 05 El ritmo — menos videos, mejor pensados, más reels 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 03 LA — ADAPTARLO A TU MARCA ATV 2026 INTENCIÓN NO COPIES LA FORMA REPLICÁ LA INTENCIÓN «Lo que le funciona a otro no me funciona a mí» es una de las cosas que más cuesta aprender. Y es verdad, pero no es un problema tuyo: la copia vive en otra marca, otro público y otro momento. Todo contenido que funciona tiene tres capas: la forma (edición, duración, tono), la intención (qué quiere provocar) y la marca (quién lo dice, a quién, desde dónde). Lo que se copia es la forma, y la forma no se transfiere. Lo que se replica es la intención, y se replica con tu propia marca. LO QUE LAS PASA CUANDO COPIÁS LO QUE PASA CUANDO ENTENDÉS «ESE FORMATO LE FUNCIONA A OTRO» «¿POR QUÉ LE FUNCIONA?» LO HACÉS IGUAL: MISMO TONO, MISMO RITMO LA INTENCIÓN DETRÁS DEL FORMATO A ÉL LE FUNCIONA, A MÍ NO Y CÓMO LA REPLICÁS CON TU VOZ LA COPIA VIVE EN OTRA MARCA, OTRO PÚBLICO, OTRO MOMENTO ADAPTÁS LA IDEA, NO EL VIDEO TRES CAPAS DE CUALQUIER CONTENIDO QUE FUNCIONA LA FORMA SE COPIA Y NO SE TRANSFIERE EDICIÓN, DURACIÓN, TONO LA INTENCIÓN SE REPLICA QUÉ QUIERE PROVOCAR: UNA DUDA, UN CASO, UN PEDIDO LA MARCA FORMA INTENCIÓN · MARCA LO HACE TUYO QUIÉN LO DICE, A QUIÉN, DESDE DÓNDE EL TRABAJO ES LLEGAR A LA CAPA DEL MEDIO Y SUBIR DESDE AHÍ FIG. 02 — NO COPIES EL FORMATO: REPLICÁ LA INTENCIÓN CON TU PROPIA MARCA CÓMO BAJAR A LA CAPA DEL MEDIO 01 Agarrá el último contenido que copiaste y que no funcionó. Escribí en una línea qué quería provocar el original. 02 Preguntate si tu versión provocaba lo mismo o solo se parecía. 03 Rehacelo desde la intención: mismo objetivo, tu voz, tu ejemplo. → La diferencia entre copiar la forma y replicar la intención se entiende mejor con dos ejemplos reales: una objeción que dos marcas del mismo nicho rompen de forma distinta, y un formato copiado sin entender para qué servía. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 03 EL — ADAPTARLO A TU MARCA ATV 2026 EJEMPLO LA MISMA OBJECIÓN DESDE TU MUNDO Un ejemplo real: dos marcas del mismo nicho, con auras completamente distintas, tienen que romper la misma objeción en historias, la de las garantías. Una la rompe desde una foto con mucha aura en un lugar de lujo, porque ese es su mundo. La otra no puede comunicarlo así: lo tiene que hacer desde el dentista o desde la calle, el mundo que su audiencia reconoce. La intención es la misma; cambia desde dónde se dice. El error contrario, también real: un director de marketing que, porque a su jefe le funcionaban los videos explicados en Miro, mandaba a un coach fitness a hacer lo mismo. Copió el formato sin la intención, y no tenía nada que ver con lo que a ese cliente le funcionaba. EL LA MISMO MENSAJE, DOS MARCAS (EJEMPLOS REALES) OBJECIÓN A ROMPER: «¿QUÉ GARANTÍAS ME DAN?» EL DIRECTOR QUE MANDABA A TODOS A HACER MIRO UNA MARCA DEL MISMO NICHO LA ROMPE DESDE UNA FOTO A SU JEFE LE FUNCIONABAN LOS VIDEOS EXPLICADOS EN MIRO CON MUCHA AURA, EN UN LUGAR DE LUJO Y MANDABA A UN COACH FITNESS A HACER LO MISMO OTRA MARCA, MISMO NICHO, OTRA AURA: COPIÓ EL FORMATO SIN LA INTENCIÓN LA ROMPE DESDE EL DENTISTA O DESDE LA CALLE NO TENÍA NADA QUE VER CON LO QUE MISMA INTENCIÓN, EL MUNDO QUE SU AUDIENCIA RECONOCE LE FUNCIONABA A ESE CLIENTE PREGUNTA QUE SEPARA COPIAR DE ADAPTAR 1 2 3 4 ¿QUÉ QUIERE PROVOCAR? ¿DESDE DÓNDE LO DICE? ¿DESDE DÓNDE LO DIGO YO? ¿QUÉ CAMBIA Y QUÉ QUEDA? ROMPER UNA OBJECIÓN, ABRIR UNA DUDA, MOSTRAR UN CASO UN MUNDO QUE SU AUDIENCIA RECONOCE EL MUNDO QUE MI AUDIENCIA RECONOCE QUEDA LA INTENCIÓN, CAMBIA EL EJEMPLO SI CAMBIÁS EL EJEMPLO Y LA INTENCIÓN SE SOSTIENE, LO ADAPTASTE; SI LA INTENCIÓN SE CAE, SOLO COPIASTE FIG. 03 — LA OBJECIÓN ES LA MISMA; EL MUNDO DESDE EL QUE LA ROMPÉS ES EL TUYO CÓMO 01 ADAPTAR UNA PIEZA CONCRETA Antes de adaptar un contenido de otro, escribí en una línea qué quiere provocar: romper una objeción, abrir una duda, mostrar un caso. 02 Escribí desde qué mundo lo dice él y desde qué mundo lo vas a decir vos: el lugar, la ropa, el ejemplo. 03 Cambiá el ejemplo y dejá la intención. Si la intención se sostiene, lo adaptaste; si se cae, solo copiaste. → Entender la intención no alcanza si lo que querés replicar sigue siendo demasiado grande para hacerlo con lo que tenés. El siguiente paso es simplificar hasta que se pueda ejecutar. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 03 — ADAPTARLO A TU MARCA ATV 2026 SIMPLIFICAR HASTA EL PUNTO EN QUE SE EJECUTA Cuando mirás a alguien que ya lo resolvió, ves un sistema completo: video main, reels, historias, YouTube, equipo. La mayoría intenta el sistema entero y abandona en dos semanas. Simplificar no es hacer menos: es bajar escalón por escalón hasta la versión que sí se ejecuta mañana con tu tiempo, tu equipo y tu volumen real. Una pieza, repetible, que después se amplía. DE LA ESTRATEGIA AJENA A LO EJECUTABLE LO QUE VES UN SISTEMA COMPLETO: VIDEO MAIN, REELS, HISTORIAS, YOUTUBE, EQUIPO LO QUE ENTENDÉS LA INTENCIÓN DE CADA PIEZA Y CUÁL TE SIRVE HOY LO QUE PODÉS HACER CON TU TIEMPO, TU EQUIPO Y TU VOLUMEN REAL LO QUE EJECUTÁS MAÑANA UNA PIEZA, REPETIBLE, QUE DESPUÉS SE AMPLÍA LA MAYORÍA SE QUEDA EN EL PRIMER ESCALÓN: VE EL SISTEMA ENTERO, LO INTENTA ENTERO Y ABANDONA SIMPLIFICAR NO ES HACER MENOS: ES LLEGAR A LA VERSIÓN QUE SÍ SE EJECUTA FIG. 04 — CADA ESCALÓN BAJA HASTA ALGO QUE SE HACE MAÑANA CÓMO LLEGAR A LO EJECUTABLE 01 Escribí el sistema que querés replicar en una sola hoja: todas las piezas. 02 Tachá todo lo que no podés sostener cuatro semanas seguidas con lo que tenés hoy. 03 Lo que queda es tu versión. Hacé eso un mes antes de agregar la siguiente pieza. → Hasta acá, cómo adaptar lo de otro. Hay una fuente de contenido que no necesita adaptarse de nadie porque ya es tuya, y casi nadie la muestra: tus propios sistemas. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 03 — TUS ADAPTARLO A TU MARCA ATV 2026 SISTEMAS LO QUE YA HACÉS ES CONTENIDO Y ES OFERTA Los claudes, procesos y plantillas que armaste para trabajar son contenido que nadie más puede copiar. Cada sistema vale tres veces: un video en YouTube («cómo organizo x»), una tendencia (la gente hoy busca sistemas, IA y automatización, y entra por ahí aunque no te conozca) y una pieza de la oferta: «los claudes que muestro están incluidos en el programa». El sistema es la prueba de cómo trabajás, y el programa deja de ser abstracto porque la gente ve qué se lleva. LO QUE YA TENÉS Y NO ESTÁS MOSTRANDO YOUTUBE UN VIDEO POR SISTEMA: «CÓMO ORGANIZO X» TUS SISTEMAS TENDENCIA CLAUDES, PROCESOS, PLANTILLAS LO QUE LA GENTE BUSCA AHORA: IA, AUTOMATIZACIÓN, SISTEMAS REEMPAQUETADO «LOS CLAUDES QUE MUESTRO ESTÁN INCLUIDOS EN EL PROGRAMA» POR QUÉ FUNCIONA COMO OFERTA EL SISTEMA ES LA PRUEBA EL PROGRAMA DEJA DE SER ABSTRACTO LA TENDENCIA TRAE GENTE NUEVA MOSTRÁS CÓMO TRABAJÁS, NO LO QUE PROMETÉS LA GENTE VE QUÉ SE LLEVA: LOS CLAUDES DEL VIDEO EL QUE BUSCA SISTEMAS ENTRA POR AHÍ, AUNQUE NO TE CONOZCA CADA SISTEMA QUE CREÁS PARA VOS ES UN VIDEO, UNA TENDENCIA Y UNA PIEZA DE LA OFERTA NO HAY QUE INVENTAR CONTENIDO: HAY QUE MOSTRAR LO QUE YA HACÉS FIG. 05 — TUS SISTEMAS VALEN TRES VECES: VIDEO, TENDENCIA Y OFERTA CÓMO CONVERTIR TUS SISTEMAS EN CONTENIDO 01 Listá los sistemas que usás todas las semanas. Cada uno es un video. 02 Grabá el primero mostrando la pantalla real, no una versión limpia. 03 Cerrá con la frase de reempaquetado: lo que viste está adentro del programa. → Queda la última adaptación, y es la que más se copia mal: el ritmo, es decir, cuántos videos y cuántos reels por mes puede sostener tu marca con calidad. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 03 EL — ADAPTARLO A TU MARCA ATV 2026 RITMO MENOS VIDEOS, MEJOR PENSADOS Y MÁS REELS La última adaptación es el ritmo, y es la que más se copia mal. Cuatro videos de YouTube por mes sin tiempo para pensarlos rinden menos que dos bien pensados, en los que además probás cosas nuevas. Un ejemplo real: una cuenta bajó a dos videos por mes, mejor pensados, y movió el volumen a reels, que son los que llevan gente al canal. La estrategia es la misma; la cadencia es la que tu marca puede sostener con calidad. Cada video que subís tiene que ser uno que sabés por qué va a funcionar. EL RITMO COPIADO EL RITMO CALIBRADO YOUTUBE / MES REELS / SEMANA YOUTUBE / MES REELS / SEMANA 4 VIDEOS 3 REELS 2 VIDEOS 10 REELS CUATRO VIDEOS QUE NO SE PIENSAN Y TRES REELS SUELTOS DOS VIDEOS MEJOR PENSADOS Y VOLUMEN REAL EN REELS CUATRO VIDEOS POR MES SIN TIEMPO PARA PENSARLOS RINDEN MENOS QUE DOS BIEN PENSADOS, PROBANDO COSAS NUEVAS EL VOLUMEN VA A LOS REELS, QUE SON LOS QUE LLEVAN GENTE A ESOS DOS VIDEOS CALIBRAR EL RITMO ES LA ÚLTIMA ADAPTACIÓN: LA ESTRATEGIA ES LA MISMA, LA CADENCIA ES TUYA CADA VIDEO QUE SUBÍS TIENE QUE SER UNO QUE SABÉS POR QUÉ VA A FUNCIONAR FIG. 06 — EL RITMO TAMBIÉN SE ADAPTA: MENOS VIDEOS, MEJOR PENSADOS, Y MÁS REELS CÓMO 01 CALIBRAR EL RITMO Contá cuántos videos publicaste el último mes y cuántos pensaste de verdad, con una razón escrita de por qué iban a funcionar. 02 Fijá dos por mes: uno que muestre un sistema tuyo, uno que pruebe algo nuevo. 03 El tiempo que ahorrás en videos va a reels, que son los que llevan gente a esos dos videos. → Intención, ejemplo, simplificar, sistemas y ritmo: así se adapta lo de otro a tu marca. Los próximos siete días lo instalan. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 03 — ADAPTARLO SIETE A TU MARCA ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 LA INTENCIÓN DÍA 03 EL SISTEMA DÍA 02 TU MUNDO DÍA 05 TUS SISTEMAS DÍA 04 TACHAR DÍA 07 EL RITMO LISTO DÍA 06 GRABAR DÍA 01 Elegí el contenido copiado que no funcionó. Escribí la intención del original en una línea. DÍA 02 Rehacelo desde tu mundo. Misma intención, tu ejemplo, tu voz. DÍA 03 Escribí el sistema que querés replicar. Todas las piezas, en una hoja. DÍA 04 Tachá lo que no sostenés cuatro semanas. Lo que queda es tu versión. DÍA 05 Listá tus sistemas. Elegí el primero que vas a grabar. DÍA 06 Grabalo con la pantalla real. Cerrá con el reempaquetado. DÍA 07 Fijá el ritmo del mes. Dos videos bien pensados y el volumen en reels. Calendarizalo. Cómo sabés que funciona A los treinta días tenés un sistema propio grabado, dos videos pensados y reels todas las semanas, sin haber copiado el formato de nadie. Si algo copiado sigue sin funcionar, volvé al día 01: todavía estás en la capa de la forma. AUMENTA TU VALOR 08","PLAYBOOK LA 03 — ADAPTARLO A TU MARCA ATV 2026 SERIE ESTE ES EL PLAYBOOK 03 DE 03 Los tres salen de la misma clase: Estrategia de contenido: reels, historias y YouTube. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo hacer que tus reels lleven gente a YouTube 01 El reel como tráiler, no como anuncio: un insight parcial y una pregunta que solo se cierra en el video largo. Cómo tener muchas respuestas en tus CTAs 02 La urgencia en el CTA, la pieza que falta del rompecabezas y las historias que educan antes de la llamada. Cómo adaptar lo que le funciona a otro a tu propia marca 03 Entender la intención detrás de cada formato, la calidad como idea y no como edición, y tus sistemas como contenido. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"]}</script>

    if(!cur) return;
    var m=window.matchMedia('(max-width:900px)').matches;
    if(m!==PV.mobile){ PV.mobile=m; observe(); if(PV.io) watch(); if(m){ $('rd-aside').classList.add('closed'); syncToggle(); } }
    var w=$('rd-pages').clientWidth; if(w===PV.width) return; PV.width=w;
    refit();
  }).observe($('rd-pages'));

  /* ---------- reader ---------- */
  var cur=null, shown=1, lastFocus=null, io=null, dl=null;
  function openPb(id,page,fromHash){
    var j=pbIndex(id); if(j<0) return;
    var pb=C.playbooks[j]; cur=pb;
    $('rd-eyebrow').textContent='Serie '+pad(serieOf(pb))+' · Playbook '+pad(posOf(pb))+' / 03';
    $('rd-title').setAttribute('data-k','playbooks.'+j+'.title');
    $('rd-pages').innerHTML=bandsHtml(pb);
    $('rd-aside').innerHTML=
      '<div class="sum">'+
        '<section class="sum-card"><div class="sum-head">'+SPARK+'<h3>Resumen</h3><button class="sum-toggle" type="button" id="sum-toggle" aria-expanded="true">Cerrar</button></div>'+
        '<p class="sum-sub">Lo que resolvés con este playbook</p>'+
        '<ul>'+pb.resuelve.map(function(b,i){ return '<li><span data-k="playbooks.'+j+'.resuelve.'+i+'"></span></li>'; }).join('')+'</ul></section>'+
        '<section class="sum-block"><h4 class="eyebrow">Contenido</h4><ol class="toc">'+pb.sections.map(function(s,i){ return '<li><button type="button" data-goto="'+(i+3)+'"><span class="n">'+pad(i+1)+'</span><span data-k="playbooks.'+j+'.sections.'+i+'"></span><span class="p">p. '+(i+3)+'</span></button></li>'; }).join('')+'</ol></section>'+
        '<section class="sum-block"><h4 class="eyebrow">Cómo sabés que funciona</h4><p class="works" data-k="playbooks.'+j+'.funciona"></p></section>'+
        '<section class="sum-block"><h4 class="eyebrow">Te sirve si…</h4><div class="tags">'+pb.problemas.slice(0,6).map(function(t){ return '<button type="button" data-q="'+esc(t)+'">'+esc(t)+'</button>'; }).join('')+'</div></section>'+
        '<div class="sum-nav"><button class="btn btn-line btn-sm" type="button" data-nav="-1" aria-label="Playbook anterior"'+(j===0?' disabled':'')+'>‹ Anterior</button><button class="btn btn-line btn-sm" type="button" data-nav="1" aria-label="Playbook siguiente"'+(j===C.playbooks.length-1?' disabled':'')+'>Siguiente ›</button><button class="btn btn-solid btn-sm sum-close" type="button">Volver a la lectura</button></div>'+
      '</div>';
    fill($('reader'));
    $('rd-prev').disabled = j===0; $('rd-next').disabled = j===C.playbooks.length-1;
    var opening = $('reader').hidden;
    if(opening){ lastFocus=document.activeElement; }
    $('reader').hidden=false; document.documentElement.classList.add('reading');
    $('rd-aside').classList.toggle('closed', window.matchMedia('(max-width:900px)').matches); syncToggle();
    PV.mobile=window.matchMedia('(max-width:900px)').matches; setZoom(0); fit(); wake();
    $('rd-pages').scrollTop=0; $('rd-body').scrollTop=0;
    updPg(page||1);
    if(page>1){ requestAnimationFrame(function(){ goTo(page,false); }); }
    if(opening) $('rd-close').focus();
    observe();
    openDoc(pb);
    if(!fromHash){ try{ if(location.hash!=='#pb-'+id) location.hash='pb-'+id; }catch(e){} }
  }
  function syncToggle(){ var t=$('sum-toggle'); if(!t) return; var closed=$('rd-aside').classList.contains('closed'); t.textContent='Cerrar'; t.setAttribute('aria-expanded',closed?'false':'true'); $('rd-sum').setAttribute('aria-expanded',closed?'false':'true'); }
  function sheet(open){
    var a=$('rd-aside'); a.classList.toggle('closed',!open); syncToggle();
    if(!window.matchMedia('(max-width:900px)').matches) return;
    if(open){ a.scrollTop=0; var t=$('sum-toggle'); if(t) t.focus(); } else $('rd-sum').focus();
  }
  function closePb(){
    if($('reader').hidden) return;
    $('reader').hidden=true; document.documentElement.classList.remove('reading'); cur=null;
    if(io) io.disconnect();
    closeDoc(); if($('rd-body').classList.contains('foco')) setFoco(false);
    try{ if(location.hash) history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function goTo(p,smooth){ var el=$('pg-'+p); if(el) el.scrollIntoView({behavior:smooth?'smooth':'auto',block:'start'}); updPg(p); }
  function updPg(p){
    if(!cur) return; shown=p; $('pv-up').disabled=p<=1; $('pv-down').disabled=p>=cur.pages; $('rd-pg').textContent='Pág. '+p+' / '+cur.pages;
    $('rd-aside').querySelectorAll('[data-goto]').forEach(function(b){ b.setAttribute('aria-current', +b.getAttribute('data-goto')===p ? 'true':'false'); });
  }
  var URLS=[];
  function observe(){
    if(io) io.disconnect(); if(!('IntersectionObserver' in window)) return;
    /* the current page is the one crossing the upper quarter of the screen, at any zoom */
    io=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting) updPg(+e.target.getAttribute('data-p')); });
    },{root:scroller(),rootMargin:'-25% 0px -75% 0px'});
    $('rd-pages').querySelectorAll('.page').forEach(function(f){ io.observe(f); });
  }
  document.addEventListener('click',function(e){
    var o=e.target.closest('[data-open]'); if(o){ e.preventDefault(); openPb(o.getAttribute('data-open'), +o.getAttribute('data-page')||1); return; }
    var g=e.target.closest('[data-goto]'); if(g){ goTo(+g.getAttribute('data-goto'),true); if(window.matchMedia('(max-width:900px)').matches){ $('rd-aside').classList.add('closed'); syncToggle(); } return; }
    var t=e.target.closest('#sum-toggle,#rd-sum,.sum-close'); if(t){ sheet($('rd-aside').classList.contains('closed')); return; }
    var nv=e.target.closest('[data-nav]'); if(nv&&cur){ var k=pbIndex(cur.id)+(+nv.getAttribute('data-nav')); if(C.playbooks[k]) openPb(C.playbooks[k].id,1); return; }
    var q=e.target.closest('.tags [data-q]'); if(q){ closePb(); $('q').value=q.getAttribute('data-q'); runSearch(); bringResults(); }
  });
  $('rd-close').addEventListener('click',closePb);
  $('rd-prev').addEventListener('click',function(){ var j=pbIndex(cur.id); if(j>0) openPb(C.playbooks[j-1].id,1); });
  $('rd-next').addEventListener('click',function(){ var j=pbIndex(cur.id); if(j<C.playbooks.length-1) openPb(C.playbooks[j+1].id,1); });
  document.addEventListener('keydown',function(e){
    if($('reader').hidden) return;
    var typing=/^(INPUT|TEXTAREA)$/.test(e.target.tagName);
    if(e.key==='Escape' && window.matchMedia('(max-width:900px)').matches && !$('rd-aside').classList.contains('closed')){ sheet(false); return; }
    if(e.key==='Escape') closePb();
    if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key==='ArrowRight') pageBy(1); else if(e.key==='ArrowLeft') pageBy(-1);
    else if(e.key==='+'||e.key==='=') zoomBy(1); else if(e.key==='-') zoomBy(-1);
  });
  function fromHash(){
    var m=/^#pb-(s\d-\d)$/.exec(location.hash||'');
    if(m){ if(!cur||cur.id!==m[1]) openPb(m[1],1,true); } else if(cur){ closePb(); }
  }
  window.addEventListener('hashchange',fromHash);

  /* ---------- boot ---------- */
  var phone=window.matchMedia('(max-width:600px)'), longPh=$('q').placeholder;
  function setPh(){ $('q').placeholder=phone.matches?'¿Qué te está pasando?':longPh; }
  setPh(); if(phone.addEventListener) phone.addEventListener('change',setPh);
  renderLibrary();
  fromHash();
  var warm=function(){ loadFT(); };
  if('requestIdleCallback' in window) requestIdleCallback(warm,{timeout:3000}); else setTimeout(warm,1500);
})();
</script>
