<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Playbooks ATV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
@font-face{font-family:"Helvetica Now Display";font-weight:500;font-style:normal;font-display:swap;src:url("vendor/fuentes/helvetica-now-display-500.otf") format("opentype")}
@font-face{font-family:"Helvetica Now Display";font-weight:400;font-style:normal;font-display:swap;src:url("vendor/fuentes/helvetica-now-display-400.otf") format("opentype")}
@font-face{font-family:"Hoosegow JNL";font-weight:400;font-style:normal;font-display:swap;src:url("vendor/fuentes/hoosegow-jnl-400.woff2") format("woff2")}
/* Layout: a searchable library. Mono running head like the brandbook, one band per serie,
   playbooks open in a full-screen reader with a summary rail beside the pages. */
:root{
  --bg:#242321; --bg-2:#1d1c1a; --surface:#2c2b28; --surface-2:#343230; --line:#3d3b37;
  --fg:#F3F0E9; --muted:#B6B0A7; --muted-2:#8c877f;
  --red:#FF2518; --red-deep:#B40210; --red-wash:rgba(255,37,24,.12); --on-red:#F3F0E9;
  --mark:rgba(255,37,24,.28); --shadow:0 18px 40px rgba(0,0,0,.35);
  /* sampled from the PDFs: fixed in both themes because the pages do not change with the theme */
  --pdf-dark:#232322; --pdf-paper:#EBE8E2; --pill-bg:#1d1c1a; --pill-fg:#F3F0E9; --pill-line:rgba(243,240,233,.14);
  --font-display:"Helvetica Now Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:"Helvetica Now Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-slab:"Hoosegow JNL","Rockwell","Roboto Slab",Georgia,serif;
  --font-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --radius:4px; --gutter:max(clamp(20px,4vw,48px),env(safe-area-inset-left,0px)); --gutter-r:max(clamp(20px,4vw,48px),env(safe-area-inset-right,0px));
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F3F0E9; --bg-2:#ebe7df; --surface:#FBFAF7; --surface-2:#f1eee7; --line:#d9d4ca;
  --fg:#242321; --muted:#6f6a63; --muted-2:#9a948b;
  --red:#E31F13; --red-deep:#B40210; --red-wash:rgba(227,31,19,.08); --on-red:#FBFAF7;
  --mark:rgba(227,31,19,.18); --shadow:0 18px 40px rgba(36,35,33,.16); color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F3F0E9; --bg-2:#ebe7df; --surface:#FBFAF7; --surface-2:#f1eee7; --line:#d9d4ca;
  --fg:#242321; --muted:#6f6a63; --muted-2:#9a948b;
  --red:#E31F13; --red-deep:#B40210; --red-wash:rgba(227,31,19,.08); --on-red:#FBFAF7;
  --mark:rgba(227,31,19,.18); --shadow:0 18px 40px rgba(36,35,33,.16); color-scheme:light; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html.reading{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-weight:400;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter-r)}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* running head */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.head .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:14px}
.head .eyebrow{color:var(--fg)}
.head .eyebrow.r{text-align:right}
.head .logo{display:flex;justify-content:center;color:var(--fg)}
.head .logo .logo-img{height:28px;width:auto}
.logo-ink{display:none}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .logo-ink{display:block} :root:not([data-theme="dark"]) .logo-paper{display:none} }
:root[data-theme="light"] .logo-ink{display:block} :root[data-theme="light"] .logo-paper{display:none}

/* hero */
.hero{padding-block:clamp(56px,8vw,112px) clamp(48px,6vw,80px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px 72px;align-items:end}
.hero h1{font-family:var(--font-display);font-weight:500;font-size:clamp(38px,5.6vw,84px);line-height:.92;letter-spacing:-.035em;text-transform:uppercase;margin:0 0 30px;min-width:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--red);display:inline-block}
.hero-lede{font-size:clamp(17px,1.6vw,21px);line-height:1.4;color:var(--muted);max-width:58ch;margin:0}
.hero-side{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:24px;row-gap:30px;border-left:1px solid var(--line);padding-left:40px;align-self:center}
.stat{display:contents}
.stat b{font-family:var(--font-slab);font-weight:400;font-size:clamp(34px,3.6vw,48px);line-height:.9;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:2.2em}
.stat span{font-size:15px;line-height:1.35;color:var(--muted);min-width:0}
.stat span strong{color:var(--fg);font-weight:500;display:block}

/* toolbar + search */
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:4;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.toolbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:18px}
.search{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:0 6px 0 14px;transition:border-color .15s}
.search:focus-within{border-color:var(--muted)}
.search .s-ico{flex:none;color:var(--muted);font-size:20px;line-height:1;transform:rotate(-45deg) scaleX(-1)}
.search input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:inherit;font-size:16px;padding:13px 0;outline:0}
.search input::placeholder{color:var(--muted-2)}
.search input::-webkit-search-cancel-button{display:none}
.clear{flex:none;font-size:22px;line-height:1;border:0;background:transparent;color:var(--muted);cursor:pointer;width:36px;height:36px;border-radius:999px;display:grid;place-items:center}
.clear:hover{background:var(--surface-2);color:var(--fg)}
.count{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.suggest{padding-block:36px 8px}
.suggest .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 10px}
.suggest .eyebrow{margin-right:6px}
.sug{font-family:var(--font-body);font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.sug:hover{border-color:var(--red)}
.sug[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.hint{font-size:14px;color:var(--muted);margin:0 0 6px;flex-basis:100%}

/* series chips */
.index{padding-block:24px 8px}
.index .wrap{display:flex;flex-wrap:wrap;gap:12px 10px}
.chip{display:inline-flex;align-items:baseline;gap:8px;text-decoration:none;font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 10px}
.chip:hover{color:var(--fg);border-color:var(--muted)}
.chip::before{content:attr(data-n);font-family:var(--font-slab);font-size:15px;color:var(--red)}

/* series bands */
.serie{padding-block:80px 16px;scroll-margin-top:160px}
.serie-head{display:grid;grid-template-columns:auto 1fr auto;align-items:end;align-items:last baseline;gap:18px 20px;padding-bottom:24px;margin-bottom:32px;border-bottom:1px solid var(--line)}
.serie-num{font-family:var(--font-slab);font-size:clamp(26px,2.6vw,34px);line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.serie-meta{display:grid;gap:6px;min-width:0}
.serie-title{font-family:var(--font-display);font-weight:500;font-size:clamp(22px,2.6vw,32px);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.serie-count{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid{grid-template-columns:1fr}}

.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.cover{position:relative;display:block;width:100%;aspect-ratio:4/3;max-width:100%;padding:0;border:0;background:var(--bg-2);cursor:pointer;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.cover:hover img{transform:scale(1.035)}
.cover .read-pill{position:absolute;right:12px;bottom:12px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--red);color:var(--on-red);border-radius:3px;padding:6px 9px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.cover:hover .read-pill,.cover:focus-visible .read-pill{opacity:1;transform:none}
.card-body{display:flex;flex-direction:column;gap:12px;padding:18px 18px 20px;flex:1}
.card-title{font-family:var(--font-display);font-weight:500;font-size:19px;line-height:1.2;letter-spacing:-.015em;margin:0;text-wrap:balance}
.card-desc{margin:0;font-size:14.5px;line-height:1.5;color:var(--muted);flex:1}
.tag{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:5px 9px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-display);font-weight:500;font-size:14.5px;letter-spacing:-.005em;text-decoration:none;border-radius:var(--radius);padding:12px 16px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.btn .arr{display:inline-block;transition:transform .15s}
.btn:hover .arr{transform:translateX(3px)}
.btn-solid{background:var(--red);color:var(--on-red);border:1px solid var(--red)}
.btn-solid:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn-line{background:transparent;color:var(--fg);border:1px solid var(--muted-2)}
.btn-line:hover{border-color:var(--fg);background:var(--surface-2)}
.btn-sm{padding:8px 12px;font-size:13.5px}

/* search results */
.results{padding-block:28px 8px}
.results-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.results-head h2{font-family:var(--font-display);font-weight:500;font-size:clamp(20px,2.2vw,26px);letter-spacing:-.02em;margin:0;text-wrap:balance}
.results-head h2 span{color:var(--red)}
.res{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding-block:20px;border-bottom:1px solid var(--line)}
.res .cover{border-radius:4px;border:1px solid var(--line)}
.res-body{display:grid;gap:9px;align-content:start;min-width:0}
.res-title{font-family:var(--font-display);font-weight:500;font-size:20px;line-height:1.2;letter-spacing:-.015em;margin:0;text-wrap:balance}
.res-why{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:15px;line-height:1.45}
.res-why .chk{flex:none;color:var(--red);font-weight:600}
.res-snip{margin:0;font-size:14px;line-height:1.5;color:var(--muted);border-left:2px solid var(--line);padding-left:12px;overflow-wrap:anywhere}
.res-snip b{font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-right:6px}
.res-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.empty{padding-block:44px;color:var(--muted);max-width:52ch}
.empty strong{color:var(--fg);font-weight:500;display:block;font-size:18px;margin-bottom:6px}
@media (max-width:600px){.res{grid-template-columns:92px minmax(0,1fr);gap:14px}.res-title{font-size:17px}}

/* footer */
.foot{border-top:1px solid var(--line);margin-top:56px}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;padding-block:18px}
.foot .eyebrow{color:var(--muted-2)}

/* reader */
.reader{position:fixed;inset:0;z-index:30;background:var(--bg-2);display:grid;grid-template-rows:auto minmax(0,1fr);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rd-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px var(--gutter-r) 10px var(--gutter);background:var(--bg)}
.rd-meta{display:grid;gap:2px;min-width:0}
.rd-title{font-family:var(--font-display);font-weight:500;font-size:16px;line-height:1.25;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-actions{display:flex;align-items:center;gap:6px}
.icon-btn{font-size:18px;display:inline-grid;place-items:center;min-width:38px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:var(--radius);background:transparent;cursor:pointer;color:var(--fg);gap:8px;grid-auto-flow:column;font-family:var(--font-display);font-weight:500;font-size:14px}
.icon-btn:hover{border-color:var(--muted)}
.icon-btn[disabled]{opacity:.35;cursor:default}
.pg{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-inline:6px}
.rd-body{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.rd-pages{grid-column:1;grid-row:1;overflow:auto;background:var(--pdf-dark);overscroll-behavior:contain;scrollbar-width:none}
.rd-pages::-webkit-scrollbar,.rd-body::-webkit-scrollbar{display:none}
.rd-pages:focus-visible{outline:0}
/* each page sits on a full-width band of its own paper colour, so no page edge is ever visible */
.band{display:flex;justify-content:center;min-width:100%;width:max-content;background:var(--pdf-paper)}
.band.dark{background:var(--pdf-dark)}
.band:last-child{padding-bottom:72px}
.page{position:relative;flex:none;width:var(--pw,100%);aspect-ratio:595.92/841.92;margin:0;overflow:hidden;scroll-margin-top:0}
.page[data-p="1"]{aspect-ratio:4/3}
.page canvas,.page>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.page canvas.first{animation:pv-in .22s ease-out}
@keyframes pv-in{from{opacity:0}}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer ::selection{background:rgba(255,37,24,.3)}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;-webkit-user-select:none;user-select:none}
/* floating controls: the viewer has no toolbar, only this pill, which fades while you read */
.pv-bar{grid-column:1;grid-row:1;align-self:end;justify-self:center;z-index:3;display:flex;align-items:center;gap:2px;margin-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:5px;border-radius:999px;background:var(--pill-bg);color:var(--pill-fg);box-shadow:0 0 0 1px var(--pill-line),0 10px 28px rgba(0,0,0,.28);transition:opacity .25s}
.pv-bar.idle{opacity:0}
.pv-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:0;border-radius:999px;background:transparent;color:inherit;font-size:18px;line-height:1;cursor:pointer;text-decoration:none;transition:background .15s}
.pv-btn:hover{background:var(--pill-line)}
.pv-btn[disabled]{opacity:.3;cursor:default;background:transparent}
.pv-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pv-z{min-width:44px;text-align:center}
.pv-bar .pg,.pv-bar .pv-z{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:inherit;font-variant-numeric:tabular-nums;white-space:nowrap}
.pv-sep{width:1px;height:16px;margin-inline:5px;background:var(--pill-line)}
.rd-body.foco{grid-template-columns:minmax(0,1fr)}
.rd-body.foco .rd-aside{display:none}
.rd-aside{grid-column:2;grid-row:1;overflow:auto;background:var(--bg);padding:22px 22px 40px;overscroll-behavior:contain}
.sum{display:grid;gap:22px}
.sum-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 20px;display:grid;gap:14px;position:relative;overflow:hidden}
.sum-card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--red),var(--red-deep) 60%,transparent)}
.sum-head{display:flex;align-items:center;gap:10px}
.sum-head .spark{color:var(--red);flex:none;font-size:20px;line-height:1}
.sum-head h3{font-family:var(--font-display);font-weight:500;font-size:17px;letter-spacing:-.01em;margin:0}
.sum-sub{margin:-6px 0 0;font-size:13.5px;color:var(--muted)}
.sum ul{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.sum-card li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14.5px;line-height:1.45}
.sum-card li::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--red);margin-top:8px;justify-self:center}
.sum-block{display:grid;gap:10px}
.sum-block h4{margin:0}
.toc{list-style:none;margin:0;padding:0;display:grid}
.toc button{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:baseline;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer;font-size:14.5px}
.toc button:hover{color:var(--red)}
.toc .n{font-family:var(--font-mono);color:var(--red);font-size:11px;letter-spacing:.06em}
.toc .p{font-family:var(--font-mono);font-size:11px;color:var(--muted-2)}
.toc button[aria-current="true"]{color:var(--red)}
.works{margin:0;font-size:14px;line-height:1.5;color:var(--muted);border-left:2px solid var(--red);padding-left:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{font-size:13px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--muted)}
.tags button:hover{color:var(--fg);border-color:var(--red)}
.sum-toggle{display:none}
@media (max-width:900px){
  .rd-body{display:block;overflow:auto;overscroll-behavior:contain}
  .rd-pages{overflow:visible}
  .rd-body{scrollbar-width:none}
  .rd-aside{position:sticky;left:0}
  .pv-bar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:calc(100vw - 24px)}
  .rd-aside{overflow:visible;border-left:0;border-bottom:1px solid var(--line);padding:16px var(--gutter-r) 18px var(--gutter)}
  .rd-aside.closed .sum > :not(.sum-card){display:none}
  .sum-toggle{display:inline-flex;margin-left:auto;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:4px 0}
  .rd-top{grid-template-columns:auto minmax(0,1fr)}
  .rd-actions{grid-column:1 / -1;justify-content:space-between}
  .rd-actions .lbl{display:none}
}


@media (max-width:820px){
  .hero-grid{grid-template-columns:1fr}
  .hero-side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:18px}
  .head .wrap{grid-template-columns:1fr auto}
  .head .eyebrow.r{display:none}

<script type="application/json" id="content">{"site":{"eyebrow":"Playbooks ATV","byline":"Por Juan Carrizo · @juanxcarrizo","title1":"SISTEMA DE CONTENIDO","title2":"$200K/MES","lede":"18 playbooks para dejar de depender de anuncios, armar una marca personal de cero, hacer que las historias vendan y leer las métricas. Escribí tu problema en el buscador, abrí el playbook que lo resuelve y aplicalo esta semana.","stat1n":"18","stat1a":"Playbooks","stat1b":"tres por serie, con la instalación día por día","stat2n":"06","stat2a":"Series","stat2b":"de la marca personal a las métricas","stat3n":"161","stat3a":"Páginas para leer acá","stat3b":"sin salir de la plataforma ni abrir Drive","searchHint":"Escribí lo que te está pasando y te mostramos el playbook que lo resuelve.","footer":"El valor se potencia en la conexión"},"suggestions":["No sé qué subir","Me quedo sin ideas","Mis historias no venden","Mis reels no pasan de 1000 views","Tengo views pero no vendo","Nadie responde mis CTAs","Arranco mi marca de cero","Mi equipo no entiende qué hacer"],"series":[{"id":"s1","title":"Cómo no depender de anuncios"},{"id":"s2","title":"Cómo crear una marca personal de 0"},{"id":"s3","title":"Rendimiento en el contenido"},{"id":"s4","title":"Entender las métricas para tener resultados"},{"id":"s5","title":"Cómo crear contenido"},{"id":"s6","title":"Estrategia de contenido: reels, historias y YouTube"}],"playbooks":[{"id":"s1-1","file":"NoDependerAnuncios_01_Contenido_que_se_crea_solo.pdf","pages":9,"title":"Cómo hacer que tu contenido se cree solo","desc":"De las métricas a la estrategia y recién después a la creación: la cuenta que te dice qué subir cada semana.","sections":["El orden","Ingeniería inversa","La meta","La salida","El análisis semanal","Siete días"],"resuelve":["Dejás de subir a ciegas: sabés qué número tiene que mover tu contenido este mes.","Hacés la cuenta de tu mejor mes al revés, de la facturación hasta los chats que la abrieron.","Convertís el resultado que querés en una meta mensual de chats, repartida entre reels e historias.","Cada pieza sale con una salida pensada para abrir una conversación.","Instalás un análisis de los lunes que mira chats, no views, y repite lo que funcionó."],"funciona":"A las cuatro semanas sabés cuántos chats necesitás y qué contenido los abre. Si seguís subiendo sin saber por qué, volvé al día 03: la meta no está clara.","problemas":["no sé qué subir","subo contenido y no sé si funciona","dependo de anuncios","quiero más chats y conversaciones","cómo medir mi contenido","contenido sin resultados","quiero duplicar mis ventas","meta mensual de contenido","estrategia de contenido orgánico"]},{"id":"s1-2","file":"NoDependerAnuncios_02_Metodo_de_las_semillas.pdf","pages":9,"title":"Cómo crear contenido sin quedarte sin ideas","desc":"El método de las semillas: de dónde salen las ideas, cómo se juntan y cómo se convierten en un formato que repetís.","sections":["Creador, no hacedor","Las semillas","Dónde buscar","La mezcla","Referencia e intención","Siete días"],"resuelve":["Dejás de trabarte frente a la hoja en blanco, sin depender de la inspiración ni de la IA.","Armás un banco de semillas con lo que te llama la atención y con tus videos que mejor funcionaron.","Mezclás semillas de referentes de otros nichos en una pieza concreta, como un caso de éxito rehecho.","Convertís lo que funcionó en un formato propio que podés repetir.","Cada pieza del calendario lleva su ficha de referencia e intención."],"funciona":"A las cuatro semanas no te sentás nunca con la hoja en blanco: cada pieza arranca con semillas y una referencia. Si todavía te trabás, volvé al día 02: te faltan semillas propias.","problemas":["me quedo sin ideas","no sé de qué hablar","bloqueo creativo","hoja en blanco","dependo de la IA para crear","no tengo inspiración","cómo usar referentes","crear un formato propio"]},{"id":"s1-3","file":"NoDependerAnuncios_03_Embudo_organico.pdf","pages":8,"title":"Cómo atraer leads calificados con orgánico sin perder alcance","desc":"El embudo orgánico como equilibrio: qué le mostrás a muchos, qué a pocos y cómo entretener sin dejar de calificar.","sections":["Tu voz","El embudo","YouTube","El tiempo","Siete días"],"resuelve":["Tu contenido suena a vos: decís lo que pensás de tu nicho en vez de repetir lo que dicen todos.","Entendés por qué algunas piezas las ve poca gente y por qué eso es parte del embudo.","Repartís la semana en tres capas: mayoría TOFU, algo de MOFU y una o dos piezas BOFU.","Escribís videos de YouTube con un valor distinto, un título que ahorra tiempo y una razón para llegar al final.","Fijás una cantidad semanal que no baja y le das 60 días antes de juzgar el resultado."],"funciona":"A los dos meses los testimonios tienen menos views que el lifestyle y más gente calificada escribiendo. Si todo tiene las mismas views, no estás usando las tres capas: volvé al día 03.","problemas":["atraer leads calificados","pierdo alcance cuando vendo","mi contenido suena igual a todos","bajaron mis views","tofu mofu bofu","embudo orgánico","cuánto tarda el orgánico","no soy constante"]},{"id":"s2-1","file":"MarcaPersonal_01_Las_bases.pdf","pages":9,"title":"Cómo definir las bases de tu marca personal antes de grabar","desc":"Los primeros diez días: a quién le hablás, qué te hace distinto, qué vendés y cómo se ve tu perfil.","sections":["Las bases","El ICP","El diferencial","La oferta","El perfil","Diez días"],"resuelve":["Definís a quién le hablás: un dream follower concreto, no un grupo.","Encontrás tu diferencial y lo cerrás en una frase: «no soy otro…, soy el que…».","Dibujás el vehículo (punto A, punto B y los pasos del medio) y empaquetás la oferta en una frase.","Optimizás el perfil: foto, bio y tres posts fijados con tu historia, tu mecanismo y tus casos.","Llegás al primer reel sabiendo a quién le hablás, con qué y para vender qué."],"funciona":"Al día 10 podés explicar en una frase a quién ayudás, con qué y a pasar de qué a qué, y tu perfil lo muestra. Si todavía no sabés qué grabar, la base floja es la oferta: volvé al día 04.","problemas":["arranco mi marca de cero","empezar marca personal","no sé a quién hablarle","definir mi cliente ideal icp","no tengo diferencial","no sé qué vender","armar mi oferta","optimizar perfil y bio"]},{"id":"s2-2","file":"MarcaPersonal_02_Primeros_30_dias.pdf","pages":9,"title":"Cómo armar tus primeros 30 días de contenido","desc":"Del día 10 al 40: volumen con intención, cuatro reels por semana, un video de YouTube y las historias como laboratorio.","sections":["Volumen","La semana","El MOFU","YouTube","Historias","Siete días"],"resuelve":["Pasás de sobrepensar cada video a tener volumen: cuatro reels por semana y un video de YouTube.","Cada reel tiene una intención escrita: dos TOFU, un MOFU y un BOFU.","Armás reels que rompen una creencia de tu nicho y la llevan a tu territorio.","Usás YouTube como un curso gratuito semanal y las historias como laboratorio con encuestas.","Al día 40 tenés dos o tres ángulos que pegaron, listos para convertir."],"funciona":"Al día 40 tenés 16 a 20 reels y 4 o 5 videos subidos, dos o tres ángulos que pegaron y encuestas que te confirman a quién estás trayendo. Si no llegaste al volumen, el problema no es de ideas: volvé al día 05 y grabá.","problemas":["cuánto subir por semana","frecuencia de publicación","sobrepienso cada video","calendario de contenido","primer mes de contenido","qué subir en youtube","encuestas en historias","no soy constante"]},{"id":"s2-3","file":"MarcaPersonal_03_De_views_a_DMs_calificados.pdf","pages":9,"title":"Cómo pasar de views y guardados a DMs calificados que agendan","desc":"Del día 40 al 90: duplicar lo que funcionó, pasar de valor a venta y medir DMs en vez de views.","sections":["Duplicar","YouTube que vende","Precio y producto","Historias que convierten","El diagnóstico","Siete días"],"resuelve":["Duplicás los tres ángulos que más DMs y comentarios trajeron y cortás el resto.","Sumás en YouTube un video que vende: valor más un VSL suave.","Definís un precio de lanzamiento y armás el producto con tus primeros clientes.","Activás secuencias de historias que se convierten en DMs calificados.","Medís una sola cosa por semana, los DMs calificados, con una regla para saber dónde se traba."],"funciona":"Al día 90 tenés tres a cinco clientes, diez a catorce videos, el perfil consistente y cincuenta DMs calificados procesados. Si falta alguno, el diagnóstico de la página 05 te dice en qué capa trabajar.","problemas":["tengo views pero no vendo","muchos seguidores pocas ventas","conseguir mis primeros clientes","pasar de views a ventas","dms calificados","ponerle precio a mi oferta","vsl","convertir seguidores en clientes"]},{"id":"s3-1","file":"Rendimiento_01_Historias_que_venden.pdf","pages":9,"title":"Cómo hacer historias que venden sin parecer marketing","desc":"El marco A → B → vehículo: hablar de lo que la gente quiere y camuflar en el medio lo que vendés.","sections":["El síntoma","El marco","El ejemplo","La medida","La variedad","Siete días"],"resuelve":["Entendés por qué las historias que venden las ve poca gente: hablan del vehículo y no del cambio.","Aplicás el marco A → B → vehículo: mostrás el deseo y camuflás en el medio lo que vendés.","Reescribís una secuencia completa de historias con ese marco.","Medís cada secuencia por calificados y ventas, no por respuestas ni views.","Variás el formato cada semana manteniendo el mismo marco."],"funciona":"A las cuatro semanas las secuencias que más calificados traen son las que hablan del cambio, no del vehículo, y cada semana hay una de un formato nuevo. Si las views siguen cayendo cuando aparece lo que vendés, volvé al día 03: el vehículo todavía no está camuflado.","problemas":["mis historias no venden","historias con pocas views","vender en historias sin parecer vendedor","secuencias de historias","caen las views cuando vendo","stories que convierten","sueno a anuncio"]},{"id":"s3-2","file":"Rendimiento_02_Encontrar_lo_que_funciona.pdf","pages":9,"title":"Cómo encontrar siempre el formato que funciona con un registro de pruebas","desc":"Cambiar de proyector, apagar lámparas y construir el edificio: la mentalidad con la que se afronta el marketing.","sections":["El proyector","Las lámparas","El edificio","El registro","La mente","Siete días"],"resuelve":["Entendés que tu resultado de hoy es lo que probaste ayer.","Listás los formatos, ángulos y canales que todavía no probaste.","Programás una prueba nueva por semana, con tu predicción escrita.","Registrás cada prueba (formato, resultado y aprendizaje) para que siempre deje un dato.","Sostenés el ritmo de tres errores por cada acierto sin frustrarte."],"funciona":"A las cuatro semanas tenés cuatro pruebas registradas, una que pegó y tres caminos descartados. Si no probaste nada nuevo, el problema no es de contenido: volvé al día 05 y mirá qué cifra estás cuidando.","problemas":["no sé qué formato funciona","estoy estancado","siempre hago el mismo contenido","me frustran los resultados","probar formatos nuevos","mentalidad","miedo a fallar","registro de pruebas"]},{"id":"s3-3","file":"Rendimiento_03_Ideas_y_organizacion.pdf","pages":9,"title":"De dónde sacar ideas y cómo organizar tu semana de contenido","desc":"Las dos fuentes de ideas, la hoja de una página y los referentes que ya tienen los datos que a vos te faltan.","sections":["Las dos fuentes","La hoja","Las respuestas","Los referentes","El respaldo","Siete días"],"resuelve":["Sacás ideas de dos fuentes que ya tenés: el onboarding de tus clientes y lo que les respondés.","Armás la semana en una hoja de una página: qué falta, tres canales, qué y dónde buscar.","Usás a tus referentes como datos de pruebas que otros ya pagaron.","Buscás un molde por idea: el video con más visitas sobre ese mismo problema.","Dejás listo tu respaldo (un caso, un video de valor y un perfil claro) para cuando te entren a mirar."],"funciona":"A las cuatro semanas no te sentás a pensar ideas: las sacás del onboarding, de tus clientes y de los referentes, y la hoja se arma en tres minutos. Si todavía te quedás en blanco, volvé al día 04: no estás anotando lo que respondés.","problemas":["organizar mi semana de contenido","no sé de dónde sacar ideas","planificar contenido","no tengo tiempo para crear","referentes","ideas a partir de clientes","poco tiempo por semana"]},{"id":"s4-1","file":"Metricas_01_Que_atrae_y_que_convierte.pdf","pages":9,"title":"Cómo saber qué atrae y qué convierte a tu cliente ideal","desc":"Ingeniería inversa de tus veinte mejores clientes: de qué historias vinieron, qué dolor los trajo y desde qué posicionamiento compraron.","sections":["La pregunta","La ingeniería inversa","Las conclusiones","El cruce","El dato manda","Siete días"],"resuelve":["Achicás la pregunta a tus diez o veinte mejores clientes, los que pagaron.","Rastreás de dónde vino cada uno y qué historia contestó antes de agendar.","Separás dolor y posicionamiento para encontrar los patrones que se repiten.","Escribís un documento de conclusiones de una página del que sale todo el contenido.","Lo cruzás cada semana con los reportes de venta y dejás que el dato decida."],"funciona":"A las cuatro semanas el creador no te pregunta de qué hablar: lo saca del documento. Si todavía hay ruido, volvé al día 01: estás analizando toda la base en vez de a los que pagaron.","problemas":["no sé quién me compra","qué contenido convierte","por qué me compran","conocer a mi cliente ideal","análisis de clientes","posicionamiento","de qué hablar en mi contenido"]},{"id":"s4-2","file":"Metricas_02_Una_accion_por_mes.pdf","pages":9,"title":"Cómo arreglar una métrica baja con una sola acción por mes","desc":"Las métricas solo te dicen dónde estás; el crecimiento sale de resolver un problema grande por mes y de objetivos simples.","sections":["El mapa","Un problema por mes","La acción inevitable","El objetivo simple","El ciclo","Siete días"],"resuelve":["Leés tus métricas como un mapa: te dicen dónde estás, no cómo llegar.","Elegís un solo problema por mes, el que más te traba.","Encontrás la acción inevitable que produce el número sola: una reunión, un laboratorio o un formulario.","Escribís un objetivo simple por persona, visible y lograble.","Cerrás cada mes sabiendo qué número se movió y por qué."],"funciona":"Al cierre del mes un número se movió y sabés por qué acción. Si solo tenés métricas nuevas y ninguna acción cumplida, volvé al día 05: el objetivo todavía era una métrica.","problemas":["tengo métricas y no sé qué hacer","métrica baja","objetivos del mes","no sé qué priorizar","mi negocio no crece","kpis","hago muchas cosas a la vez"]},{"id":"s4-3","file":"Metricas_03_Tareas_simples.pdf","pages":9,"title":"Cómo convertir tu estrategia de marketing en tareas simples que se cumplen","desc":"Sos el traductor: del qué al cómo, un formulario para el setter, un calendario para el creador, un solo documento para todo.","sections":["El traductor","El setter","El creador","El CTA","Un solo lugar","Siete días"],"resuelve":["Te ponés en rol de traductor: de lo que vos entendés a lo que cada persona puede ejecutar.","Armás un formulario diario para el setter con tus preguntas escondidas adentro.","Le das al creador un avatar de cinco líneas, pilares de contenido y un objetivo de una línea.","Acompañás cada CTA con una ficha para ventas: dolor, fricción, recurso y objetivo.","Guardás marketing, ventas y producto en un solo tablero."],"funciona":"A las cuatro semanas nadie del equipo te pregunta «¿y cómo hago esto?». Si siguen preguntando, volvé al día 01: la instrucción todavía está en chino.","problemas":["mi equipo no entiende qué hacer","delegar contenido","setter","creador de contenido o editor","dar instrucciones claras","el equipo me pregunta todo","procesos de marketing"]},{"id":"s5-1","file":"CrearContenido_01_De_la_llamada_al_reel.pdf","pages":9,"title":"Cómo convertir lo que explicás en llamadas en contenido grabado","desc":"El flow state: capturar tus mejores respuestas, pensar el hook en vivo y grabar apenas terminás, con la misma voz con la que le hablás a un cliente.","sections":["El flow state","La captura","El hook en vivo","La voz","Rehacer","Siete días"],"resuelve":["Capturás las ideas que salen cuando explicás algo en vivo, antes de que se pierdan.","Instalás un sistema simple: cámara fija, libreta y grabar apenas terminás.","Pensás el hook primero y grabás con la misma voz con la que le hablás a un cliente.","Rehacés tus reels viejos de valor con un mejor formato.","Cada bloque de reuniones te deja uno o dos reels grabados."],"funciona":"A las cuatro semanas cada bloque de reuniones deja uno o dos reels grabados, y ninguno es un recorte. Si capturás ideas y no las grabás, volvé al día 04: estás esperando el guion perfecto.","problemas":["me cuesta grabar","sueno robótico en cámara","no sé hacer hooks","aprovechar mis reuniones para contenido","reciclar contenido viejo","guion perfecto","grabar rápido con poco tiempo"]},{"id":"s5-2","file":"CrearContenido_02_Reel_de_nicho_mucha_gente.pdf","pages":9,"title":"Cómo hacer que un reel de nicho lo vea mucha gente","desc":"Engañar al algoritmo: hook abierto, mostrar cosas, revelar tarde y camuflar el caso de éxito en valor.","sections":["La competencia","El hook abierto","El ejemplo","Mostrar y camuflar","El perfil","Siete días"],"resuelve":["Entendés contra qué compite tu reel y por qué el contenido hecho solo para tu ICP se estanca.","Escribís hooks abiertos que entiende cualquiera, sin cambiar de tema.","Mostrás cosas reales (documentos, calendarios) que valen una captura y un guardado.","Camuflás el caso de éxito al final, después del valor.","Revisás tu perfil para que tenga variedad de intención."],"funciona":"A las cuatro semanas hay reels que pasaron las mil views sin cambiar de tema, y los comentarios traen gente calificada. Si siguen estancados, volvé al día 02: el hook todavía filtra.","problemas":["mis reels no pasan de 1000 views","reels estancados","más alcance","hooks","algoritmo de instagram","guardados","casos de éxito aburridos","tema aburrido"]},{"id":"s5-3","file":"CrearContenido_03_Mecanismo_y_promesa.pdf","pages":9,"title":"Cómo explicar tu mecanismo en un video de YouTube y ponerle una promesa que venda","desc":"El mecanismo explicado sin nombrarlo, los fijados, las destacadas y por qué las bases se renuevan cada tres a seis meses.","sections":["Las bases","El mecanismo","La promesa","Fijados y destacadas","El mejor funnel","Siete días"],"resuelve":["Ordenás las bases que alimenta todo tu contenido: video principal, fijados, destacadas, foto y bio.","Explicás tu mecanismo con las palabras del cliente, sin esconderlo detrás de un nombre.","Armás una promesa con un número, un «sin» y algo raro.","Hacés que fijados, destacadas y YouTube cuenten la misma historia.","Fijás una fecha de renovación de tus bases cada seis meses."],"funciona":"A las cuatro semanas quien entra desde un reel encuentra la misma historia en fijados, destacadas y YouTube. Si la gente llega y no sabe qué hacés, volvé al día 02: el mecanismo sigue escondido detrás del nombre.","problemas":["la gente no entiende qué hago","propuesta de valor","promesa","mecanismo único","destacadas","posts fijados","video de youtube que venda","diferenciarme"]},{"id":"s6-1","file":"AlvaroOlga_01_Reels_como_trailer.pdf","pages":9,"title":"Cómo hacer que tus reels lleven gente a YouTube","desc":"El reel como tráiler, no como anuncio: un insight parcial y una pregunta que solo se cierra en el video largo.","sections":["Tráiler, no anuncio","La estructura","Desde YouTube hacia atrás","Rotar","El laboratorio","Siete días"],"resuelve":["Entendés por qué tus reels no llevan a nadie a YouTube: funcionan como anuncio y no como tráiler.","Escribís reels con un insight parcial y una pregunta que solo se cierra en el video largo.","Ordenás el proceso: primero el video largo, después el reel.","Rotás tráilers nuevos hacia los videos que ya vendieron.","Montás un laboratorio de ganchos: tres por video, uno por semana."],"funciona":"A las cuatro semanas los videos viejos vuelven a recibir visitas y los comentarios con la palabra suben. Si siguen sin ir al video, volvé al día 04: el reel está dando todo o no está dando nada.","problemas":["mis reels no llevan a youtube","pocas vistas en youtube","youtube no me trae clientes","reel como tráiler","ganchos","videos viejos sin visitas"]},{"id":"s6-2","file":"AlvaroOlga_02_Respuestas_en_tus_CTAs.pdf","pages":9,"title":"Cómo tener muchas respuestas en tus CTAs","desc":"La urgencia en el CTA, la pieza que falta del rompecabezas y las historias que educan antes de que la persona agende.","sections":["La urgencia","El tono","La pieza que falta","El código","Educar","Siete días"],"resuelve":["Pedís con urgencia: de «qué interesante» a «lo tengo que ver ahora».","Pedís con tu propio tono, el mismo de tus secuencias con más respuestas.","Siempre dejás una pieza afuera: das el qué y el por qué, no todo.","Escondés un código en el video para que el contenido mismo pida.","Educás la objeción del mes con historias antes de que la persona agende."],"funciona":"A las cuatro semanas las redirecciones a YouTube tienen decenas de respuestas, no cinco, y ventas nota que la objeción bajó. Si siguen contestando pocos, volvé al día 02: estás pidiendo con tono de anuncio.","problemas":["nadie responde mis ctas","pocas respuestas en historias","llamado a la acción","sueno a anuncio","objeciones","los leads llegan fríos","pedir sin vender"]},{"id":"s6-3","file":"AlvaroOlga_03_Adaptarlo_a_tu_marca.pdf","pages":9,"title":"Cómo adaptar lo que le funciona a otro a tu propia marca","desc":"Entender la intención detrás de cada formato, la calidad como idea y no como edición, y tus sistemas como contenido.","sections":["La intención","El ejemplo","Simplificar","Tus sistemas","El ritmo","Siete días"],"resuelve":["Copiás la intención de un formato ajeno, no la forma.","Rompés la misma objeción con ejemplos de tu mundo y con tu voz.","Simplificás un sistema ajeno hasta que lo podés sostener cuatro semanas.","Convertís tus propios sistemas en videos, tendencias y oferta.","Calibrás el ritmo: menos videos, mejor pensados, y el volumen en reels."],"funciona":"A los treinta días tenés un sistema propio grabado, dos videos pensados y reels todas las semanas, sin haber copiado el formato de nadie. Si algo copiado sigue sin funcionar, volvé al día 01: todavía estás en la capa de la forma.","problemas":["copio y no me funciona","adaptar referentes","mi marca se parece a otra","copiar formatos","cuántos videos hacer","ritmo de publicación","calidad de edición"]}]}</script>

<script type="application/json" id="ft">{"s1-1":["PLAYBOOK 01 CONTENIDO QUE SE CREA SOLO","PLAYBOOK ANTES 01 DE — CONTENIDO PREDECIBLE ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el primer playbook de la serie: cómo hacer que el contenido orgánico deje de ser una apuesta. Vas a hacer la cuenta de tu mejor mes al revés, sacar de ahí una meta en chats, pensar cada pieza desde esa meta y analizar cada semana qué la cumplió. Al terminar tenés tu tabla de referencia, una meta mensual y un calendario donde cada pieza sabe para qué existe. CO PLAYBOOK 03 · EMBUDO N QUÉ MOSTRAR A MUCHOS Y Y DE DÓNDE SALEN LAS IDEAS OR S EL VE S A: QU EM É ST PA SI SA EL PLAYBOOK 02 · MÉTODO DE LAS SEMILLAS EL SI VU ST EM SE A: CO SU NI BÍ GÁ SI N VE ED DE LA MÉTRICA A LA ESTRATEGIA PR PLAYBOOK 01 · CONTENIDO PREDECIBLE EC IB LE HOY: DEPENDÉS DE ANUNCIOS O DE LA SUERTE FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 El orden — métricas, estrategia y recién después creación 02 Ingeniería inversa — de dónde salió tu mejor mes 03 La meta — para duplicar, duplicás los chats 04 La salida — cada pieza pensada desde la meta 05 El análisis semanal — dónde buscar, qué mirar, qué hacer 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 01 EL — CONTENIDO PREDECIBLE ATV 2026 ORDEN NO TE FALTAN IDEAS TE FALTA LA ESTRATEGIA Cuando no sabés qué subir, o subís algo y no sabés si está bien, el problema no es de ideas: es que arrancaste por el final. La mayoría se sienta a crear sin haber definido una estrategia, y la estrategia no se inventa: sale de las métricas. Si sabés qué número tenés que mover esta semana, la pregunta «¿qué grabo?» se contesta sola. DE ACÁ NACE DE ACÁ NACE ACÁ RECIÉN SE GRABA MÉTRICAS ESTRATEGIA CREACIÓN QUÉ PASÓ EL MES PASADO QUÉ NÚMERO TENGO QUE MOVER QUÉ SUBO ESTA SEMANA LA OTRA TRAMPA: QUEDARSE MIDIENDO LA MAYORÍA ARRANCA ACÁ Y NO PASAR NUNCA A LA ESTRATEGIA Y POR ESO NO SABE SI LO QUE HACE ESTÁ BIEN LA ESTRATEGIA ES MÁS INTUITIVA DE LO QUE PARECE: A VECES ES UNA SOLA FRASE, «SUBÍ MÁS CONTENIDO» FIG. 02 — PRIMERO EL NÚMERO, DESPUÉS LA DIRECCIÓN, AL FINAL LA IDEA Hay dos trampas. La primera es saltarse las métricas y crear a ciegas. La segunda es la contraria: quedarse midiendo todo y no pasar nunca a la estrategia. Una estrategia no es un tablero gigante; puede ser una sola frase, como «esta semana subo más contenido». Lo importante es que venga de un número. CÓMO ARRANCAR EN EL ORDEN CORRECTO 01 Antes de pensar una idea, escribí en una línea qué número querés mover este mes. 02 Escribí debajo qué vas a hacer para moverlo. Esa línea es tu estrategia. 03 Recién ahí abrí el calendario y pensá las piezas. → Para saber qué número mover, primero hay que ver de dónde salió tu mejor resultado. Eso es lo que sigue. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 01 — CONTENIDO INGENIERÍA PREDECIBLE ATV 2026 INVERSA TU MEJOR MES ES UNA CUENTA, NO UNA CASUALIDAD Agarrá tu mejor mes y hacé la cuenta al revés. Ese resultado no apareció de la nada: fue consecuencia de una cantidad de llamadas, que fue consecuencia de una cantidad de agendas, que salieron de una cantidad de conversaciones, que empezaron como chats que abrió tu contenido. Cada escalón tiene una tasa, y esa tasa es la tuya, no la de otro. 12k SECUENCIA DE CASH COLLECTED EL RESULTADO CÓMO LEERLO LOS 12K NO APARECIERON: SALIERON DE 1600 CH 20 SECUENCIA DE LLAMADAS HECHAS CLOSE RATE CADA ESCALÓN TIENE SU TASA, Y ESA TASA ES T SI NO TOCÁS NINGUNA TASA, EL RESULTADO SIGU 30 SECUENCIA DE AGENDAS SHOW RATE 1000 SECUENCIA DE CONVERSACIONES TASA DE AGENDA 1600 SECUENCIA DE 1000 POR ESO LA PREGUNTA ES: ¿CUÁNTOS CHATS NECE CHATS ABIERTOS CONVERSIÓN A CONVERSACIÓN 600 FIG. 03 — UN MES DE EJEMPLO; PONÉ TUS NÚMEROS EN LOS MISMOS ESCALONES VINIERON DE REELS VINIERON DE HISTORIAS CÓMO HACER TU INGENIERÍA INVERSA 01 Elegí tu mejor mes (no el actual) y anotá cuánto facturaste. 02 Completá hacia abajo: llamadas, agendas, conversaciones y chats. Si no tenés un número exacto, usá el más cercano que tengas. 03 Separá los chats por origen: cuántos vinieron de reels y cuántos de historias. 04 Guardá esa tabla: es tu tabla de referencia para todo lo que sigue. → Con la cuenta hecha, la estrategia aparece sola: para un resultado más grande, hay que mover el primer escalón. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 01 — LA CONTENIDO PREDECIBLE ATV 2026 META PARA DUPLICAR EL RESULTADO DUPLICÁS LOS CHATS Si querés el doble, la matemática dice que necesitás el doble de chats. Podrías mejorar el cierre o el show rate, pero eso depende de ventas. Lo único que marketing controla hoy mismo es cuántas conversaciones abre el contenido. Por eso la estrategia se enfoca en una sola cosa. TU MEJOR CASH 12k LLAMADAS 20 AGENDAS 30 CONVERSACIONES 1000 CHATS 1600 RESPUESTAS EN HISTORIAS 600 MES 1000 CHATS DESDE REELS EL MES × 2 QUE QUERÉS 24k × 2 40 × 2 60 × 2 2000 × 2 3200 LO ÚNICO QUE × 2 MARKETING CONTROL 1200 × 2 HOY MISMO: CUÁNTOS CHATS 2000 ABRE EL CONTENIDO SI SUBISTE UN CTA POR SEMANA Y DIO 600 RESPUESTAS, SUBÍS DOS; SI DOS FUERON FUERTES Y DOS FLOJAS, SUBÍS CUATRO FUERTES FIG. 04 — SIN TOCAR NINGUNA TASA, EL DOBLE DE CHATS DEBERÍA DAR EL DOBLE DE RESULTADO Y una regla para no dispersarse: no te preocupes por una métrica que todavía no se vio afectada. Si todavía no abrís 4000 chats, no pienses en el setter que vas a necesitar para atenderlos. ABRIR CHATS INTERÉS DE LOS QUE LLEGAN AGENDAS Y SHOW RATE SETTER NUEVO HOY SE VE DESPUÉS MÁS ABAJO CUANDO NO DES ABASTO AFECTÁ LA PRIMERA MÉTRICA Y RECIÉN AHÍ MIRÁ LAS QUE SIGUEN; NO RESUELVAS UN PROBLEMA QUE TODAVÍA NO TENÉS CÓMO FIJAR LA META 01 Escribí el resultado que querés este mes y dividilo por tus tasas hasta llegar a chats: esa es la meta. 02 Repartí esa meta entre reels e historias según de dónde vinieron los chats de tu mejor mes. 03 Dividí por cuatro: eso es lo que el contenido tiene que abrir cada semana. → Ya tenés el número. Lo que sigue es usarlo para que la creatividad
