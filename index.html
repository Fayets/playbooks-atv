. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 01 — CONTENIDO SIETE PREDECIBLE ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 MEJOR MES DÍA 03 META EN CHATS DÍA 02 TUS TASAS DÍA 01 DÍA 05 CALENDARIO DÍA 04 ESTRATEGIA DÍA 07 PRIMERA SEMANA LISTO DÍA 06 QUÉ REPETIR Armá la tabla de tu mejor mes. Cash, llamadas, agendas, conversaciones y chats, con el origen de los chats (reels o historias). DÍA 02 Calculá tus tasas. De chat a conversación, de conversación a agenda, de agenda a llamada y de llamada a cierre. Son tuyas y sirven para proyectar. DÍA 03 Definí la meta del mes en chats. Partí del resultado que querés y dividí por tus tasas hasta llegar a cuántos chats necesitás. DÍA 04 Escribí la estrategia en una línea. Qué vas a hacer para abrir esa cantidad de chats: más CTAs, más piezas, otro formato. DÍA 05 Armá tu calendario con la meta arriba. Al lado de cada pieza, una línea: cómo va a abrir una conversación. DÍA 06 Elegí qué repetir. Buscá en tus historias y reels los que más chats abrieron y programá versiones nuevas. DÍA 07 Corré la primera semana y medí. El lunes siguiente, un solo dato: cuántos chats abrió el contenido de la semana. Cómo sabés que funciona A las cuatro semanas sabés cuántos chats necesitás y qué contenido los abre. Si seguís subiendo sin saber por qué, volvé al día 03: la meta no está clara. AUMENTA TU VALOR 08","PLAYBOOK LA 01 — CONTENIDO PREDECIBLE ATV 2026 SERIE ESTE ES EL PLAYBOOK 01 DE 03 Los tres salen de la misma clase: Cómo no depender de anuncios. Cada uno resuelve un problema distinto del contenido orgánico, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo hacer que tu contenido se cree solo 01 De las métricas a la estrategia y recién después a la creación: la cuenta que te dice qué subir cada semana. Cómo crear contenido sin quedarte sin ideas 02 El método de las semillas: de dónde salen las ideas, cómo se juntan y cómo se convierten en un formato que repetís. Cómo atraer leads calificados con orgánico sin perder alcance 03 El embudo orgánico como equilibrio: qué le mostrás a muchos, qué a pocos y cómo entretener sin dejar de calificar. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s1-2":["PLAYBOOK 02 MÉTODO DE LAS SEMILLAS","PLAYBOOK ANTES 02 DE — MÉTODO DE LAS SEMILLAS ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el segundo playbook de la serie: cómo crear contenido sin depender de la inspiración ni de la IA. Vas a entender por qué te trabás, qué es una semilla y dónde buscarlas, cómo se mezclan en una pieza concreta y cómo dejar una ficha para que cada video tenga referencia e intención. Al terminar tenés un banco de semillas, un formato propio y un calendario donde nada se graba a ciegas. CO PLAYBOOK 03 · EMBUDO N QUÉ MOSTRAR A MUCHOS Y Y DE DÓNDE SALEN LAS IDEAS OR S EL VE S A: QU EM É ST PA SI SA EL PLAYBOOK 02 · MÉTODO DE LAS SEMILLAS EL SI VU ST EM SE A: CO SU NI BÍ GÁ SI N VE ED DE LA MÉTRICA A LA ESTRATEGIA PR PLAYBOOK 01 · CONTENIDO PREDECIBLE EC IB LE HOY: DEPENDÉS DE ANUNCIOS O DE LA SUERTE FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 Creador, no hacedor — por qué te trabás 02 Las semillas — nadie crea desde cero 03 Dónde buscar — entretener y calificar a la vez 04 La mezcla — un caso de éxito rehecho 05 Referencia e intención — la ficha de cada pieza 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 02 — MÉTODO CREADOR, DE NO LAS SEMILLAS ATV 2026 HACEDOR NO TE FALTAN IDEAS TE SALTEÁS EL PROCESO Si sentís que no encontrás el flow, que repetís lo mismo o que el guion no te sale, no te falta talento: estás haciendo en vez de creando. Hacer es querer que salga rápido y sin que cueste. Crear es un proceso: juntás ideas de distintos lados, las mezclás, te frustrás con el guion, das una vuelta y volvés. Los primeros videos que te trajeron seguidores salieron así, y por eso funcionaron. HACER CREAR SALE UN FORMATO SALE LA IDEA QUERÉS QUE SALGA RÁPIDO TE FRUSTRA EL GUION TE FRUSTRÁS Y SEGUÍS LE PEDÍS LA IDEA A LA IA REPETÍS LO MISMO CADA VEZ CON MENOS SEMILLAS: MÁS DÉBIL, MENOS IDEAS JUNTÁS SEMILLAS CADA IDEA DEJA UNA SEMILLA NUEVA: MÁS FUERTE, MÁS IDEAS POR QUÉ CUESTA MENOS TIEMPO LA IA TE LO PROMETE EVITÁS EL PROCESO TE QUEDÁS SIN SEMILLAS MENOS ENERGÍA · RESULTADO YA EL 99% EVITA EL PROCESO DE CREACIÓN; QUIEN LO ATRAVIESA SE QUEDA CON LA VENTAJA FIG. 02 — HACER TE DEJA EN EL MISMO LUGAR; CREAR TE DEJA SEMILLAS PARA LA PRÓXIMA La IA empeoró esto porque juega con un deseo primitivo: menos tiempo, menos energía, resultado ya. Entonces le pedís la idea o el guion y evitás el proceso, y cada vez que lo evitás dejás de recoger una semilla. Como el 99% hace lo mismo, quien atraviesa el proceso se queda con la ventaja. CÓMO VOLVER A CREAR 01 La próxima vez que una idea te cueste, no cambies de idea: anotá qué parte se trabó y seguí. 02 Usá la IA para darle forma a algo que ya pensaste, nunca para que piense por vos. 03 Compará cómo creabas cuando empezaste con cómo creás hoy: ahí vas a ver qué paso te salteás. → Para crear hace falta materia prima. Esa materia prima son las semillas, y lo que sigue explica qué son. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 02 LAS — MÉTODO DE LAS SEMILLAS ATV 2026 SEMILLAS NADIE CREA DESDE CERO SE CREA JUNTANDO SEMILLAS Pensá en una idea como una flor. Para que crezca hacen falta semillas: pedazos de otras cosas que fuiste juntando. Un video tuyo que entretuvo, la miniatura de otro creador, un dolor que escuchaste en una llamada con un cliente, una historia de un referente. Las ponés en la misma maceta, que es tu proceso de creación, y las regás escribiendo el guion. De ahí sale la idea. UNA MINIATURA LO QUE FUNCIONA UN VIDEO TUYO EJEMPLO REAL: UN VIDEO DE 21K VIEWS DE OTRO Y DE DÓNDE SALIÓ CADA PARTE EN INSTAGRAM QUE ENTRETUVO SEMILLA 1 UN 30 O 40% DE LA IDEA SALIÓ DE UN VIDEO DE OTRO CREADOR: «SI TE FALTAN CHATS, HACÉ MÁS CONTENIDO» UNA HISTORIA UN DOLOR SEMILLA 2 LA IDEA DE UNA LLAMADA DE UN REFERENTE LA MINIATURA SALIÓ DE UN CREADOR QUE VENDE LOS MISMOS PRODUCTOS CRECE CUANDO LAS SEMILLAS SE RIEGAN SEMILLA 3 EL TÍTULO SALIÓ DE LO QUE LES FUNCIONABA EN INSTAGRAM LA MACETA LA MACETA LAS TRES EN EL MISMO VIDEO, REGADAS CON SU GUION TU PROCESO DE CREACIÓN REGAR: ESCRIBIR EL GUION, FRUSTRARTE, DAR UNA VUELTA Y VOLVER FIG. 03 — NADIE CREA DESDE CERO: PICASSO TAMPOCO; ROBÁS COMO UN ARTISTA Y LO MEZCLÁS CON LO TUYO CÓMO 01 ARMAR TU BANCO DE SEMILLAS Abrí una carpeta de semillas: una nota por cada cosa que te llame la atención, con una línea que diga por qué. 02 Cada vez que un video tuyo funcione, anotá qué semillas tenía: de dónde salió el formato, el título y el tema. 03 Cuando te sientes a crear, empezá con tres semillas sobre la mesa, nunca con la hoja en blanco. → Ya sabés qué es una semilla. Lo que sigue es dónde buscarlas para que la pieza entretenga y al mismo tiempo califique. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 02 — MÉTODO DÓNDE DE LAS SEMILLAS ATV 2026 BUSCAR EL VIRAL TE DICE QUÉ ENTRETIENE EL CALIFICADO TE DICE EL TEMA Tenés que lograr dos cosas a la vez: traer leads calificados y entretenerlos. Para eso buscás semillas en cuatro lugares. Tus videos más vistos te dicen qué entretiene: el lugar donde grabaste, la ropa, cómo estaba puesto el título. No te dicen cómo comunicar, solo qué hizo que la gente se quede. Tus videos que trajeron calificados te dicen el tema. Los referentes de otros nichos te enseñan cómo poner en contexto. Y tus clientes te dan el ángulo, con sus palabras. TUS VIDEOS QUE ENTRETUVIERON TUS VIDEOS QUE TRAJERON CALIFICADOS FORMATO TEMA QUÉ HACE QUE LA GENTE SE QUEDE: EL LUGAR, LA ROPA, CÓMO VA EL TÍTULO LA PIEZA QUE SUBÍS QUÉ TEMA HACE QUE TE ESCRIBA LA PERSONA CORRECTA ENTRETIENE Y CALIFICA REFERENTES DE OTROS NICHOS DOS MUNDOS EN UNA PIEZA LO QUE DICEN TUS CLIENTES EL TEMA DEL CALIFICADO, CON EL FORMATO DEL VIRAL ESTRUCTURA ÁNGULO CÓMO PONEN EN CONTEXTO: UNA HISTORIA, UNA PREGUNTA EL DOLOR EXACTO, CON SUS PALABRAS DEL VIRAL NO COPIÁS LA COMUNICACIÓN: COPIÁS LO QUE HIZO QUE LA GENTE SE QUEDE, Y CON ESO LE HABLÁS AL CALIFICADO FIG. 04 — CUATRO FUENTES, UNA PIEZA: CADA SEMILLA APORTA UNA PARTE DISTINTA CÓMO MEZCLAR LOS DOS MUNDOS 01 Listá tus cinco videos más vistos y escribí al lado qué los hizo entretenidos: lugar, ropa, título, ritmo. 02 Listá los cinco que trajeron leads calificados y escribí el tema de cada uno. 03 Elegí un tema de la segunda lista y un formato de la primera: esa es la próxima pieza. EJEMPLO Un reel de caso de éxito trajo dos llamadas calificadas, pero casi nadie lo vio. Del video más visto de la misma cuenta se toma lo que entretuvo (dónde se grabó, cómo estaba vestida la persona, dónde iba el título) y se le aplica al próximo caso de éxito. Es el mismo tema que trae calificados, con el formato que hace que la gente se quede. → Con las semillas elegidas, falta ver cómo se mezclan en una pieza concreta. Lo mostramos con un reel rehecho de punta a punta. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 02 LA — MÉTODO DE LAS SEMILLAS ATV 2026 MEZCLA DE UNA IDEA TRABAJADA SALE UN FORMATO QUE REPETÍS Un ejemplo real de un asesor de imagen. Su reel de caso de éxito arrancaba con «él es mi cliente y, como ven, ya se vestía muy bien». Ese hook habla de él y de su cliente, no de la persona que está mirando, y además no muestra que fue él quien lo llevó a ese resultado. Rehecho con semillas, el mismo caso arranca poniendo a la persona en contexto, sigue con una historia conocida que le da peso a la idea (empresarios que se vistieron como ricos antes de serlo) y recién ahí presenta el caso como prueba de que él sabe hacer eso. COMO ESTABA LO «ÉL ES MI CLIENTE, Y COMO VERÁN YA SE VESTÍA MUY BIEN» HABLA DEL CLIENTE, NO DE LA PERSONA QUE MIRA QUE QUEDA UN FORMATO REPLICABLE Y NO MUESTRA QUE VOS LO LLEVASTE A ESE RESULTADO CONTEXTO → PREGUNTA → HISTORIA → CASO CINCO HORAS LA PRIMERA VEZ; DESPUÉS LO REPETÍS CON CADA CLIENTE REHECHO 1 CON SEMILLAS HOOK DE CONTEXTO «IMAGINATE UNA SALA CON GENTE QUE FACTURA UN MILLÓN… Y QUE LA PERSONA CON MÁS PODER SEAS VOS… SEMILLA: UNA PREGUNTA QUE PONE EN AMBIENTE 2 HISTORIA ONASSIS LLEGÓ SIN PLATA Y SE COMPRÓ TRAJES QUE NO PODÍA PAGAR; RALPH LAUREN VENDÍA CORBATAS … SEMILLA: REFERENTES DE OTROS NICHOS 3 EL CASO USÉ ESE MISMO PODER CON MI CLIENTE: DETOX DE ARMARIO Y AJUSTE DE ROPA SEMILLA: TU CLIENTE, PERO MOSTRANDO LA TRANSFORMACIÓN 4 LA SALIDA Y HOY SIGUE FUNCIONANDO: ESCRIBIME SI QUERÉS LO MISMO SEMILLA: EL CTA QUE ABRE CHATS FIG. 05 — EL MISMO CASO DE ÉXITO, PERO CREADO PARA LA PERSONA QUE MIRA CÓMO REHACER UNA PIEZA CON SEMILLAS 01 Agarrá tu último caso de éxito y escribí el hook como una pregunta que meta a la persona en una escena. 02 Buscá una historia conocida que pruebe el mismo principio y contala en dos frases. 03 Presentá el caso mostrando qué hiciste vos, no cómo era el cliente antes. 04 Anotá la estructura que te quedó: esa es tu plantilla para los próximos casos. → Una idea así lleva horas la primera vez, pero deja un formato. Para que no se pierda, cada pieza necesita una ficha. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 02 — MÉTODO REFERENCIA DE E LAS SEMILLAS ATV 2026 INTENCIÓN NO SE GRABA SIN REFERENCIA NI INTENCIÓN Cada pieza del calendario lleva una referencia y una intención. La referencia es el video que te guía y por qué creés que va a funcionar; sin referencia no se graba, porque la cabeza no se inspira de la nada. La intención es qué querés que pase: abrir chats, mostrar el producto o calificar. Con esas dos cosas escritas es imposible no saber si el video le fue bien o mal. LA FICHA DE INTENCIÓN DOLOR CADA PIEZA CÓMO QUÉ QUIERO QUE PASE: ABRIR CHATS, MOSTRAR EL P RODUCTO, CALIFICAR PEDIR FEEDBACK «¿QUÉ ONDA ESTE REEL?», Y NADA MÁS NO SE PUEDE RESPONDER: NO SÉ QUÉ QUISISTE LOGRAR QUÉ LE DUELE A LA PERSONA QUE MIRA «ESTA FUE LA INTENCIÓN, ESTE EL DOLOR, ME GUIÉ DE ESTE VIDEO, TUVO ESTE RESULTADO: REFERENCIA QUÉ VIDEO ME GUÍA Y POR QUÉ CREO QUE VA A FUNC IONAR RESULTADO QUÉ PASÓ DESPUÉS DE SUBIRLO ¿CUMPLÍ CON LA INTENCIÓN?» CON ESO EL FEEDBACK ES SOBRE LO QUE QUISISTE HACER, NO SOBRE UN GUS SIN REFERENCIA NO SE GRABA: LA CABEZA NO SE INSPIRA DE LA NADA LA RESPUESTA VUELVE A LA FICHA COMO SEMILLA NUEVA EN EL CALENDARIO LUN · REEL REF. MAR · HISTORIA ✓ · INTENCIÓN ✓ REF. ✓ · INTENCIÓN ✓ MIÉ · YOUTUBE REF. ✓ · INTENCIÓN ✓ JUE · REEL REF. ✓ · INTENCIÓN ✓ VIE · REEL REF. ✓ · INTENCIÓN ✓ FIG. 06 — CON INTENCIÓN Y REFERENCIA ES IMPOSIBLE NO SABER SI EL VIDEO LE FUE BIEN O MAL CÓMO CERRAR EL CIRCUITO 01 Agregá a tu calendario dos columnas: referencia e intención. Ninguna pieza se graba con una vacía. 02 Cuando pidas feedback, mandá siempre lo mismo: intención, dolor, referencia y resultado. 03 Guardá la respuesta en la ficha: cada feedback es una semilla para la próxima pieza. → Semillas, mezcla y ficha: el método está completo. Los próximos siete días lo ponen en marcha. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 02 — MÉTODO SIETE DE LAS SEMILLAS ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 SEMILLAS DÍA 03 REFERENTES DÍA 02 DOS LISTAS DÍA 01 DÍA 05 EL FORMATO DÍA 04 REHACER DÍA 07 FEEDBACK LISTO DÍA 06 LA FICHA Abrí tu banco de semillas. Una carpeta o nota. Cargá hoy cinco cosas que te llamaron la atención esta semana y por qué. DÍA 02 Separá tus videos en dos listas. Los que más entretuvieron y los que trajeron leads calificados. Anotá qué tenía cada uno. DÍA 03 Elegí tres referentes de otros nichos. Guardá una pieza de cada uno y escribí qué hacen para poner en contexto. DÍA 04 Rehacé un caso de éxito. Hook de contexto, historia, caso y salida. Dedicale el tiempo que haga falta. DÍA 05 Escribí el formato que te quedó. Los pasos de esa pieza, como plantilla para la próxima. DÍA 06 Completá la ficha del calendario. Referencia e intención para cada pieza de la semana que viene. DÍA 07 Pedí feedback con el formato. Intención, dolor, referencia y resultado. Guardá la respuesta como semilla. Cómo sabés que funciona A las cuatro semanas no te sentás nunca con la hoja en blanco: cada pieza arranca con semillas y una referencia. Si todavía te trabás, volvé al día 02: te faltan semillas propias. AUMENTA TU VALOR 08","PLAYBOOK LA 02 — MÉTODO DE LAS SEMILLAS ATV 2026 SERIE ESTE ES EL PLAYBOOK 02 DE 03 Los tres salen de la misma clase: Cómo no depender de anuncios. Cada uno resuelve un problema distinto del contenido orgánico, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo calcular cuántas conversaciones necesitás para duplicar tus ventas 01 De las métricas a la estrategia y recién después a la creación: la cuenta que te dice qué subir cada semana. Cómo crear contenido sin quedarte sin ideas 02 El método de las semillas: de dónde salen las ideas, cómo se juntan y cómo se convierten en un formato que repetís. Cómo atraer leads calificados con orgánico sin perder alcance 03 El embudo orgánico como equilibrio: qué le mostrás a muchos, qué a pocos y cómo entretener sin dejar de calificar. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s1-3":["PLAYBOOK 03 EMBUDO ORGÁNICO","PLAYBOOK ANTES 03 DE — EMBUDO ORGÁNICO ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el tercer playbook de la serie: cómo atraer leads calificados con contenido orgánico sin perder alcance. Vas a ver cómo hacer que tu contenido suene a vos, por qué el embudo hace que algunas piezas las vea poca gente, qué pide YouTube y cuánto tiempo hay que respetar. Al terminar tenés la semana repartida en tres capas y una cantidad fija de piezas que no baja. CO PLAYBOOK 03 · EMBUDO N QUÉ MOSTRAR A MUCHOS Y Y DE DÓNDE SALEN LAS IDEAS OR S EL VE S A: QU EM É ST PA SI SA EL PLAYBOOK 02 · MÉTODO DE LAS SEMILLAS EL SI VU ST EM SE A: CO SU NI BÍ GÁ SI N VE ED DE LA MÉTRICA A LA ESTRATEGIA PR PLAYBOOK 01 · CONTENIDO PREDECIBLE EC IB LE HOY: DEPENDÉS DE ANUNCIOS O DE LA SUERTE FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 Tu voz — decí lo que pensás 02 El embudo — que bajen las views es parte del equilibrio 03 YouTube — valor, retención y título 04 El tiempo — el orgánico paga con retraso 05 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 03 TU — EMBUDO ORGÁNICO ATV 2026 VOZ DECÍ LO QUE PENSÁS LA GENTE TE COMPRA A VOS Un ejemplo real: una persona sentía que su público todavía no lo veía como la solución a su problema, y cuando miraba a su competencia veía una forma de vender que no iba con él. La salida no es copiar esa forma ni bajar el tono para no llamar la atención: es comunicar más lo que pensás. La gente no compra un servicio, te compra a vos. La prueba fue una broma sobre el nicho, dicha sin filtro en historias: todos coincidieron, se rieron y respondieron. COPIAR CÓMO VENDE LA COMPETENCIA COMUNICAR LO QUE PENSÁS UNA FORMA DE HABLAR QUE NO VA CON VOS UNA OPINIÓN TUYA, DICHA COMO LA PENSÁS LA REPETÍS PORQUE PARECE QUE ES LO QUE FUNCIONA EJEMPLO REAL: UNA BROMA SOBRE EL NICHO EN HISTORIAS Y TERMINÁS SONANDO A TODOS LOS DEMÁS TODOS COINCIDIERON, SE RIERON Y RESPONDIERON RESULTADO: SOS UN SERVICIO MÁS, NO HAY NADIE A QUIEN COMPRARLE RESULTADO: TE COMPRAN A VOS, NO UN SERVICIO SI TU PÚBLICO ES DELICADO LA REACCIÓN NATURAL ES BAJAR EL TONO PARA NO DECIR NADA RARO; ES EXACTAMENTE LO QUE TE VUELVE GENÉRICO 1 2 3 NO LO ESQUIVES TOCALO MÁS DECILO COMO SOS BAJAR EL TONO TE DEJA IGUAL QUE LA COMPETENCIA ESA SENSIBILIDAD ES UNA EMOCIÓN, Y LAS EMOCIONES SE USAN A TU FAVOR SIN FILTRO, PERO CON INTENCIÓN Y SIN FALTAR EL RESPETO POSICIONARTE COMO LA SOLUCIÓN SIN SONAR A VENDEHUMO NO ES HABLAR MÁS BAJO: ES QUE SE ESCUCHE TU VOZ Y NO LA DE OTRO LA GENTE CONECTA CON LA AUTENTICIDAD, Y LA QUE CONECTA CON LO QUE PENSÁS ES LA GENTE CORRECTA FIG. 02 — LA AUTENTICIDAD CALIFICA: LA GENTE CORRECTA CONECTA CON LO QUE PENSÁS CÓMO ENCONTRAR TU VOZ 01 Escribí tres cosas que pensás sobre tu nicho y que nunca dijiste en cámara. 02 Elegí una y decila en historias esta semana, tal como la pensás. 03 Si tu público es delicado, no lo esquives: usá esa emoción a tu favor, con intención y sin faltar el respeto. → Con tu voz clara ya sabés cómo hablar. Lo que sigue es cuánta gente tiene que ver cada tipo de contenido, porque no todo lo que subís está hecho para que lo vean todos. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 03 EL — EMBUDO ORGÁNICO ATV 2026 EMBUDO QUE BAJEN LAS VIEWS ES PARTE DEL EQUILIBRIO Cuando subís testimonios y te bajan las views, no estás haciendo nada mal: estás viendo el embudo. El lifestyle es TOFU y lo ve mucha gente; el producto por dentro es MOFU y lo ve menos; los testimonios y los CTAs son BOFU y los ve poca gente, pero esa es la que agenda. Un ejemplo real: una historia de lifestyle hizo 9.600 views y, en la misma cuenta, un testimonio hizo 2.100. No es un problema: es el embudo funcionando. VIEWS POR TIPO DE CONTENIDO TOFU LO VEN MUCHOS 9.600 VIEWS EN UNA HISTORIA LIFESTYLE · LO QUE ENTRETIENE MOFU LO VEN MENOS TU PRODUCTO POR DENTRO · CÓMO PENSÁS IMPRESIONES, MENOS VIEWS TOFU MOFU BOFU QUE BAJEN LAS VIEWS EN BOFU ES LA LÓGICA DEL EMBUDO, NO UN ERROR BOFU LO VEN POCOS TESTIMONIOS · CASOS · CTA · 2.100 VIEWS EN UN TESTIMONIO EL EQUILIBRIO: NO SOLO PEDIR (CTAS), TAMBIÉN DAR: PRODUCTO POR DENTRO Y CASOS AGENDA FIG. 04 — EL EMBUDO ES UN EQUILIBRIO: CADA TIPO DE CONTENIDO TIENE SU CANTIDAD DE GENTE El equilibrio también va en la otra dirección. Si solo pedís (CTAs todo el tiempo para abrir chats) y nunca das, la gente llega con menos interés. Por eso en el medio va el producto por dentro y los casos de éxito: es lo que hace que quien te escribe llegue queriendo comprar. CÓMO EQUILIBRAR EL EMBUDO 01 Repartí la semana en tres partes: la mayoría TOFU, una parte MOFU y una o dos piezas BOFU. 02 Medí cada tipo contra sí mismo: un testimonio se compara con otro testimonio, no con un lifestyle. 03 Si las views bajan y los chats calificados suben, no cambies nada. → En Instagram el embudo perdona bastante. YouTube tiene sus propias reglas, y conviene conocerlas. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 03 — EMBUDO ORGÁNICO ATV 2026 YOUTUBE YOUTUBE PREMIA EL VALOR Y LA RETENCIÓN En YouTube lo más importante es el valor: si lo que das es igual a lo que la gente ya ve, no funciona. Instagram no te castiga tanto por eso; YouTube sí, porque premia la retención y es un juego largo: subís, subís y subís antes de que te empiece a premiar. Los títulos que mejor andan hacen sentir que la persona GENTE QUE SIGUE MIRANDO se ahorra el tiempo que a vos te costó. EL CON VALOR DISTINTO Y ALGO QUE BUSCAR HASTA EL FINAL TÍTULO LA VALIDACIÓN ESTÁ EN EL TIEMPO, NO EN EL DINERO «MIL HORAS DE PRUEBA EN DOS MINUTOS» «LO QUE ME COSTÓ UN AÑO, EN 30 MINUTOS» UN VIDEO PROMEDIO «20 LECCIONES DESPUÉS DE HACER PLATA CON CONTENIDO» MINUTO DEL VIDEO LA PERSONA SIENTE QUE SE AHORRA TIEMPO QUE A VOS TE COSTÓ BE PREMIA LA RETENCIÓN: CUANDO LA GENTE MIRA HASTA EL FINAL, EL VIDEO SE MUESTRA A MÁS EL GENTE LA REGLA DEL EQUIPO: JUSTIFICAR POR QUÉ VA A FUNCIONAR «ESTE VIDEO VA A FUNCIONAR» ¿POR QUÉ? «PORQUE SÍ» ENTONCES NO VA A FUNCIONAR «PORQUE EL TÍTULO HACE SENTIR QUE AHORRA UN AÑO» AHORA SÍ YOUTUBE ES UN JUEGO LARGO: SUBÍS, SUBÍS Y SUBÍS ANTES DE QUE TE PREMIE; PERO CUANDO LO HACÉS BIEN, ES MÁS PREDECIBLE QUE INSTAGRAM FIG. 05 — EN YOUTUBE GANA EL VALOR DISTINTO, LA RETENCIÓN Y UN TÍTULO QUE AHORRE TIEMPO CÓMO TRABAJAR YOUTUBE 01 Antes de grabar, escribí por qué ese video va a funcionar. Si la respuesta es «porque sí», no va a funcionar. 02 Inspirate en títulos que ya funcionan y adaptalos: la validación está en el tiempo que ahorra la persona. 03 Dale a la gente una razón para llegar al final: un recurso que se entrega recién al terminar, una lista que se completa. 04 Subí a Instagram en 1080 y 30 fps: más que eso no lo procesa bien y el video se ve trabado. → Con el embudo equilibrado y YouTube en marcha, queda lo más difícil de todo: sostenerlo el tiempo que necesita. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 03 EL — EMBUDO ORGÁNICO ATV 2026 TIEMPO EL ORGÁNICO LLEVA TIEMPO RESPETÁ ESE TIEMPO Si no usás anuncios, el contenido orgánico lleva tiempo, y hay que respetar ese tiempo. Es incómodo y a veces doloroso ver que un video no tiene views, pero el resultado de lo que grabás hoy se ve en dos o tres meses. Una semana con cuatro videos de YouTube y once reels no cambia este mes; cambia noviembre y RESULTADO diciembre. Nada cambia si no cambiás vos, y cuando vos cambiás, todo cambia. ACÁ SE VE TODO LO DE ANTES CAMBIÁS VOS «NADA CAMBIA SI NO CAMBIÁS» EL ESFUERZO POR SEMANA: 4 YOUTUBE · 11 REELS ACÁ PARECE QUE NO PASA NADA (Y ES NORMAL) SEP OCT NOV DIC MESES ES INCÓMODO, Y A VECES DOLOROSO, VER QUE UN VIDEO NO TIENE VIEWS; EL ORGÁNICO PIDE MADUREZ, IGUAL QUE LOS ANUNCIOS NO FALLAR NI UN DÍA, NI CON LAS HISTORIAS NI CON EL CONTENIDO FIG. 06 — EL ORGÁNICO PAGA CON RETRASO: LO QUE GRABÁS HOY SE COBRA EN DOS O TRES MESES CÓMO SOSTENERLO 01 Fijá una cantidad semanal de piezas y no la bajes aunque las views bajen. 02 No falles ni un día: ni con las historias ni con el contenido. 03 Medí el cambio en 60 o 90 días, no en una semana. Y mientras tanto, mirá señales chicas: más comentarios calificados, más gente que te escribe. EJEMPLO Un ejemplo real: una persona subió su primer caso de éxito y, aunque no fue viral, le llegaron más leads calificados y se nota en los comentarios. Están pasando cosas antes de que se vean en el número. → El embudo, YouTube y el tiempo: ya tenés el sistema completo. Los próximos siete días lo instalan. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 03 — EMBUDO SIETE ORGÁNICO ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 TU VOZ DÍA 03 TRES CAPAS DÍA 02 CLASIFICAR DÍA 01 DÍA 05 CANTIDAD DÍA 04 YOUTUBE DÍA 07 SEÑALES LISTO DÍA 06 FECHA Escribí tres opiniones que te guardás. Sobre tu nicho, con tus palabras. Elegí una para decir en historias esta semana. DÍA 02 Clasificá tu contenido del mes. TOFU, MOFU o BOFU. Mirá si hay equilibrio o si solo pedís. DÍA 03 Planificá la semana con las tres capas. Mayoría TOFU, algo de MOFU, una o dos piezas BOFU, cada una con su intención. DÍA 04 Escribí tu próximo video de YouTube. Qué valor distinto da, por qué el título ahorra tiempo y qué razón hay para llegar al final. DÍA 05 Fijá tu cantidad semanal. Cuántos reels, cuántas historias y cuántos videos de YouTube. Ese número no baja. DÍA 06 Marcá la fecha de revisión. Dentro de 60 días. Hasta entonces, constancia. DÍA 07 Anotá las señales chicas. Comentarios calificados, gente nueva que te escribe. Son el resultado antes del número. Cómo sabés que funciona A los dos meses los testimonios tienen menos views que el lifestyle y más gente calificada escribiendo. Si todo tiene las mismas views, no estás usando las tres capas: volvé al día 03. AUMENTA TU VALOR 07","PLAYBOOK LA 03 — EMBUDO ORGÁNICO ATV 2026 SERIE ESTE ES EL PLAYBOOK 03 DE 03 Los tres salen de la misma clase: Cómo no depender de anuncios. Cada uno resuelve un problema distinto del contenido orgánico, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo calcular cuántas conversaciones necesitás para duplicar tus ventas 01 De las métricas a la estrategia y recién después a la creación: la cuenta que te dice qué subir cada semana. Cómo crear contenido sin quedarte sin ideas 02 El método de las semillas: de dónde salen las ideas, cómo se juntan y cómo se convierten en un formato que repetís. Cómo atraer leads calificados con orgánico sin perder alcance 03 El embudo orgánico como equilibrio: qué le mostrás a muchos, qué a pocos y cómo entretener sin dejar de calificar. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s2-1":["PLAYBOOK 01 LAS BASES","PLAYBOOK ANTES 01 DE — LAS BASES ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el primer playbook de la serie: los diez días que van antes de grabar. Vas a definir a quién le hablás, qué tenés que nadie más tiene, qué vendés y cómo se ve tu perfil cuando alguien entra. Al terminar tenés las cuatro bases escritas y un perfil que las muestra; recién ahí empieza el contenido, que es el Playbook 02. DÍAS 40 A 90: OPTIMIZAR AN CU PL AL QU EL IE N R CO LA DO PLAYBOOK 03 · DE VIEW A : UN A TA UN AP MA PLAYBOOK 02 · LOS PRIMEROS 30 DÍAS SE PLAYBOOK 01 · LAS BASES EN S: A CO AD NT ID EN OL ID NS O CO QU A E RC DÍAS 10 A 40: CONSTRUCCIÓN Y VOLUMEN BA 90 DÍAS 1 A 10: ICP, DIFERENCIAL, OFERTA Y PERFIL AS SI N DÍ HOY: TU MARCA ESTÁ EN CERO FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 Las bases — cuatro cosas antes de grabar 02 El ICP — una persona, no un grupo 03 El diferencial — desde dónde lo sabés 04 La oferta — antes que el contenido 05 El perfil — tu carta de presentación 06 Diez días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 01 LAS — LAS BASES ATV 2026 BASES ANTES DE GRABAR HAY CUATRO COSAS QUE DEFINIR Cuando arrancás una marca personal de cero, lo primero que querés es grabar. Y ahí está el error que comete todo el mundo: se saltean las bases y van directo al contenido. Después aparece la confusión de no saber qué grabar, qué avatar encarar ni qué tipo de contenido hacer. Esa confusión no se arregla con más ideas: se arregla definiendo cuatro cosas en los primeros diez días. LOS PRIMEROS DIEZ DÍAS ICP DIFERENCIAL OFERTA PERFIL CONTENIDO A QUIÉN LE HABLÁS QUÉ TENÉS QUE NADIE MÁS DE QUÉ PUNTO A A QUÉ PUNTO B CÓMO TE VEN AL ENTRAR RECIÉN ACÁ SE GRABA «QUIERO CREAR CONTENIDO YA»: EL SALTO QUE DA TODO EL MUNDO Y LA CONFUSIÓN DE NO SABER QUÉ GRABAR VIENE EXACTAMENTE DE ACÁ CUANDO LAS CUATRO BASES ESTÁN, SE TE VIENE TODO: CUALQUIER SECUENCIA QUE VEAS LA PODÉS LLEVAR A LO TUYO LA PREGUNTA DEJA DE SER «QUÉ GRABO» Y PASA A SER «A QUIÉN, CON QUÉ Y PARA VENDER QUÉ» FIG. 02 — CUATRO BASES ANTES DE LA PRIMERA PIEZA; SIN ELLAS EL CONTENIDO APUNTA A CUALQUIER LADO CÓMO 01 USAR LOS PRIMEROS DIEZ DÍAS Bloqueá diez días antes de grabar la primera pieza. No es tiempo perdido: es lo que después te ahorra meses de contenido que no apunta a nadie. 02 Anotá hoy, en una línea cada una, tu respuesta actual a las cuatro bases. Si alguna te sale vaga, esa es la que trabajás primero. 03 Mientras tanto, mirá perfiles que te gusten y anotá qué secuencias te gustaría replicar; cuando tengas las bases vas a saber cómo adaptarlas. → La primera base es la persona a la que le vas a hablar, el ICP. Y el error más común es definirla demasiado amplia, como en el ejemplo con el que arranca la próxima página. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 01 EL — LAS BASES ATV 2026 ICP NO LE HABLÁS A UN GRUPO LE HABLÁS A UNA PERSONA Un ejemplo para entenderlo: una persona que arranca una marca personal para enseñarle a hombres a relacionarse con mujeres. Su primera respuesta sobre a quién le habla fue «hombres que quieren seducir», y eso no es un avatar: es demasiado amplio y no le habla a nadie. El ICP tiene que ser específico: qué edad tiene, en qué situación está, qué le duele de verdad todos los días y qué cree que le falta. Y hay una regla que lo ordena todo, en cualquier nicho: no es solo a quién te gustaría ayudar, sino a quién sabés ayudar más, y eso tiene que calzar con tu historia. EJEMPLO: «HOMBRES QUE QUIEREN SEDUCIR» DEMASIADO AMPLIO: NO LE HABLA A NADIE SOLTEROS, 25 A 35, CON PLATA YA ES ALGUIEN LAS PREGUNTAS 1 ¿QUÉ EDAD TIENE Y EN QUÉ SITUACIÓN ESTÁ? 2 ¿QUÉ LE DUELE TODOS LOS DÍAS? 3 ¿QUÉ CREE QUE LE FALTA? 4 ¿A QUIÉN SABÉS AYUDAR MÁS? 5 ¿RESUENA CON TU HISTORIA? TIENE TODO EL POTENCIAL QUE LO DEFINEN (PARA CUALQUIER NICHO) NO UN RANGO ENORME: UNA ETAPA DE VIDA CONCRETA EL PROBLEMA QUE SIENTE, NO EL QUE VOS VES Y QUÉ LE FALTA DE VERDAD: LA DIFERENCIA ES TU CONTENIDO Y NO SABE USARLO ESE ES SU DREAM FOLLOWER NO A QUIÉN TE GUSTARÍA: A QUIÉN YA ENTENDÉS TIENE QUE CALZAR CON LO QUE VOS VIVISTE CADA ANILLO HACIA ADENTRO ES MÁS ESPECÍFICO, CUANTO F I G . 0 3 — E L I C P E XYA C T O : N OMÁS U NESPECÍFICO, G R U P O , U N AMÁS P ERESUENA RSONA CON UN DOLOR QUE VOS ENTENDÉS DESDE ADENTRO EJEMPLO DE DREAM FOLLOWER (EL MISMO CASO) Siguiendo el mismo caso, el dream follower quedó así: el hombre que tiene todo el potencial (plata, estatus, cuerpo) y no sabe usarlo con una mujer. Pagó cursos de negocios toda su vida y nunca le dedicó tiempo a esta habilidad. Ese dolor es enorme, y calza con la historia de quien le habla, que es lo que vas a ver en la próxima base. CÓMO 01 DEFINIR TU ICP Hacé el ejercicio del dream follower: describí a una sola persona, con nombre inventado, edad, situación y el dolor que tiene un martes a la noche. 02 Respondé por escrito las cinco preguntas de la figura. Si alguna respuesta te sale vaga, el ICP todavía no está. 03 Al principio no te cierres: probá dos o tres variantes de esa persona en los primeros reels y quedate con la que responde. → Ya tenés a quién. La segunda base responde otra pregunta: por qué esa persona te va a escuchar a vos y no a cualquier otro que hable del mismo tema. Eso es el diferencial. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 01 EL — LAS BASES ATV 2026 DIFERENCIAL NO ES LO QUE SABÉS ES DESDE DÓNDE LO SABÉS Tu diferencial no es lo que sabés: es desde dónde lo sabés. Siguiendo el mismo ejemplo: esa persona viene de manejar durante años una agencia de creadoras de contenido para adultos. Lo que sabe sobre cómo las mujeres perciben a los hombres no lo leyó en un libro: lo vio desde adentro, trabajando todos los días con mujeres que viven de atraer. Un coach de relaciones convencional habla desde la teoría; él habla desde ese lugar, y por eso no es otro coach más. Toda la narrativa de la marca se construye alrededor de ese lugar. CÓMO VEN LAS MUJERES A LOS HOMBRES, VISTO DESDE ADENTRO CÓMO ENCONTRAR EL TUYO: CINCO PREGUNTAS QUÉ HACÉS HOY QUE CASI NADIE EN TU NICHO HACE TU HISTORIA LO CONFIRMA QUÉ VES DESDE ADENTRO QUE LOS DEMÁS VEN DESDE AFUERA NO OTRO COACH DE RELACIONES: EL QUE TRABAJÓ CON ELLAS LO QUE SOLO QUÉ DE TU HISTORIA LO EXPLICA VOS TENÉS EJEMPLO: AÑOS MANEJANDO UNA AGENCIA DE CREADORAS CADA PIEZA VUELVE A ESE LUGAR QUÉ DIRÍAS QUE EL RESTO NO PUEDE DECIR HOOKS QUE NADIE MÁS PUEDE DECIR LA NARRATIVA ENTERA SE CONSTRUYE ALREDEDOR DE ESTO QUÉ TE HARÍA INSOPORTABLE COPIAR DE OTRO NO ES LO QUE SABÉS: ES DESDE DÓNDE LO SABÉS FIG. 04 — EL DIFERENCIAL NO ES UNA HABILIDAD MÁS; ES EL LUGAR DESDE DONDE CONTÁS TODO CÓMO 01 ENCONTRAR TU DIFERENCIAL Respondé por escrito las cinco preguntas de la figura, que sirven para cualquier nicho. La respuesta que más te incomode compartir suele ser el diferencial. 02 Escribí en una frase: «no soy otro [rol]: soy el que [lo que solo vos tenés]». 03 Pegá esa frase donde planifiques contenido: cada pieza tiene que poder volver a ese lugar. → Con la persona y el diferencial definidos, la tercera base es la que casi todos dejan para el final y en realidad va antes del contenido: qué vendés, es decir, la oferta. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 01 LA — LAS BASES ATV 2026 OFERTA LA OFERTA VA ANTES QUE EL CONTENIDO La oferta va antes que el contenido, porque el contenido tiene que apuntar a algún lado. Pensá tu marca al revés: si sabés qué querés que alguien te compre, sabés quién lo compra y, por lo tanto, de qué hablar. Si en cambio arrancás por el contenido sin saber qué vendés, atraés gente que mira, pasa de largo y no compra, porque nada de lo que publicás la lleva a ningún lado. EL VEHÍCULO: DE A A B (CON EL MISMO EJEMPLO) PUNTO A PUNTO B CÓMO LLEGA CÓMO SE VA AUTOIMAGEN AUTOESTIMA FÍSICO MENTALIDAD PERFIL HABILIDADES SOCIALES CAMA RELACIÓN CADA PASO ES PARTE DEL MECANISMO Y NINGUNO ALCANZA SOLO: EN EL EJEMPLO, LA MEJOR TÉCNICA NO SALVA UNA IMAGEN MAL VISTA EMPAQUETADO EN UNA FRASE «AYUDO A [ICP] A PASAR DE [PUNTO A] A [PUNTO B] CON [TU DIFERENCIAL]» EJEMPLO DE OFERTA EN UNA FRASE: «ESCALO NEGOCIOS A 100K POR MES SIN ANUNCIOS Y CON POCO CONTENIDO» POR QUÉ LA OFERTA VA ANTES QUE EL CONTENIDO CONTENIDO PRIMERO OFERTA PRIMERO ATRAÉS GENTE QUE MIRA, PASA DE LARGO Y NO COMPRA SABÉS QUIÉN LA COMPRA, Y ESO TE DICE DE QUÉ HABLAR FIG. 05 — INGENIERÍA INVERSA: DEFINÍS LA OFERTA Y HACÉS EL RECORRIDO HACIA ATRÁS HASTA EL CONTENIDO Del precio no te preocupes todavía: primero hay que ver si lo que vendés la gente lo quiere. Arrancás con una oferta irresistible y un precio de lanzamiento, y el precio sube cuando haya resultados. No podés ponerte en la posición de un rey cuando todavía sos príncipe. CÓMO ARMAR LA OFERTA 01 Escribí el punto A (cómo llega la persona) y el punto B (cómo se va) en una línea cada uno. 02 Listá los pasos que tiene que atravesar entre uno y otro, en orden. Eso es tu vehículo, y después se convierte en tu producto. 03 Empaquetalo en una frase con la plantilla de la figura y leela en voz alta: si no la entiende alguien de afuera, todavía no está. → Esa frase de la oferta es, literalmente, lo que después va en tu bio. Por eso la última base es el perfil: el lugar donde las tres anteriores se vuelven visibles. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 01 EL — LAS BASES ATV 2026 PERFIL TU PERFIL ES TU CARTA DE PRESENTACIÓN Tu perfil es tu carta de presentación: hoy la gente pasa más tiempo mirando el teléfono que el mundo real, y antes de ver un reel tuyo entra a ver quién sos. El perfil es lo último que se arma porque necesita las tres bases anteriores: la bio se escribe con la frase de la oferta, la foto transmite lo que tu diferencial quiere transmitir, y los tres posts fijados muestran tu historia, tu mecanismo (cómo llevás a alguien de A a B y por qué lo tuyo es distinto) y tus casos. LA FOTO TRANSMITE LO QUE QUERÉS TRANSMITIR: LUZ, LUGAR, AURA; NO UNA SELFIE TU NOMBRE FOTO BIO: UNA LÍNEA CON LA OFERTA Y PARA QUIÉN ES LA BIO CLARA: QUÉ RESULTADO DAS Y A QUIÉN; NADA DE FRASES BONITAS HISTORIA MECANISMO CASOS HISTORIA TRES POSTS FIJADOS QUIÉN SOS Y POR QUÉ SABÉS ESTO DESDE ADENTRO MECANISMO CÓMO LLEVÁS A ALGUIEN DE A A B Y POR QUÉ LO TUYO ES DISTINTO CASOS CUANDO TODAVÍA NO TENÉS, TU PROPIO PROCESO DE TRANSFORMACIÓN VIVIMOS EN UN JUEGO DE REDES: EL PERFIL ES TU CARTA DE PRESENTACIÓN ANTES DE CUALQUIER REEL REELS CON INTENCIÓN FIG. 06 — EL PERFIL SE ARMA CON LAS TRES BASES ANTERIORES; POR ESO ES LO ÚLTIMO QUE SE HACE CÓMO OPTIMIZAR EL PERFIL 01 Sacate una foto pensada para el perfil, con la luz y el lugar que van con tu marca. No una selfie. 02 Escribí la bio con la frase de la oferta: resultado, para quién y tu diferencial. Nada más. 03 Armá los tres posts fijados: historia (por qué sabés esto desde adentro), mecanismo (cómo llevás a alguien de A a B) y casos (si todavía no tenés, tu propio proceso de transformación). 04 Recién después abrí el calendario de contenido. Con las bases hechas, vas a poder adaptar cualquier secuencia que veas a lo tuyo. → Diez días, cuatro bases, y un perfil que las muestra. Lo que sigue es el orden en que se definen, un día por vez. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 01 — DIEZ LAS BASES ATV 2026 DÍAS LA INSTALACIÓN Los primeros diez días no se graba nada: se define. Una base por día, en orden, y al final el perfil que las muestra. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 DREAM FOLLOWER DÍA 03 DIFERENCIAL DÍA 02 A QUIÉN DÍA 05 LA FRASE DÍA 04 VEHÍCULO DÍA 07 REFERENCIAS LISTO DÍA 06 PERFIL DÍA 01 Escribí tu dream follower. Una persona, con edad, situación, dolor diario y qué cree que le falta. DÍA 02 Elegí a quién sabés ayudar más. Cruzá ese dream follower con tu historia: si no calza, ajustalo hasta que calce. DÍA 03 Encontrá tu diferencial. Las cinco preguntas de la página 03, por escrito. Cerrá con la frase «no soy otro…, soy el que…». DÍA 04 Dibujá el vehículo. Punto A, punto B y los pasos del medio, en orden. DÍA 05 Empaquetá la oferta en una frase. Con la plantilla. Probala con alguien de afuera. DÍA 06 Optimizá el perfil. Foto, bio y los tres posts fijados: historia, mecanismo y casos. DÍA 07 Armá la lista de referencias. Perfiles y secuencias que querés adaptar, ahora que sabés a quién, con qué y para vender qué. Cómo sabés que funciona Al día 10 podés explicar en una frase a quién ayudás, con qué y a pasar de qué a qué, y tu perfil lo muestra. Si todavía no sabés qué grabar, la base floja es la oferta: volvé al día 04. AUMENTA TU VALOR 08","PLAYBOOK LA 01 — LAS BASES ATV 2026 SERIE ESTE ES EL PLAYBOOK 01 DE 03 Los tres salen de la misma clase: Cómo crear una marca personal de 0. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo definir las bases de tu marca personal antes de grabar 01 Los primeros diez días: a quién le hablás, qué te hace distinto, qué vendés y cómo se ve tu perfil. Cómo armar tus primeros 30 días de contenido 02 Del día 10 al 40: volumen con intención, cuatro reels por semana, un video de YouTube y las historias como laboratorio. Cómo pasar de views y guardados a DMs calificados que agendan 03 Del día 40 al 90: duplicar lo que funcionó, pasar de valor a venta y medir DMs en vez de views. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s2-2":["PLAYBOOK 02 PRIMEROS 30 DÍAS","PLAYBOOK ANTES 02 DE — LOS PRIMEROS 30 DÍAS ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el segundo playbook de la serie: los 30 días de construcción y volumen que van después de las bases. Vas a ver cuánto subir y por qué no sobrepensarlo, la semana tipo de cuatro reels con una intención cada uno, cómo se arma el reel que rompe creencias, qué video de YouTube hacer cada semana y cómo usar las historias para saber si estás trayendo a la persona correcta. Al terminar tenés dos o tres ángulos que pegaron, listos para la fase que convierte. DÍAS 40 A 90: OPTIMIZAR AN CU PL AL QU EL IE N R CO LA DO PLAYBOOK 03 · DE VIEW A : UN A TA UN AP MA PLAYBOOK 02 · LOS PRIMEROS 30 DÍAS SE PLAYBOOK 01 · LAS BASES EN S: A CO AD NT ID EN OL ID NS O CO QU A E RC DÍAS 10 A 40: CONSTRUCCIÓN Y VOLUMEN BA 90 DÍAS 1 A 10: ICP, DIFERENCIAL, OFERTA Y PERFIL AS SI N DÍ HOY: TU MARCA ESTÁ EN CERO FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 Volumen — primero el hábito, después el ángulo 02 La semana — cuatro reels, cuatro intenciones 03 El MOFU — rompé una creencia y llevala a tu territorio 04 YouTube — un curso gratuito por semana 05 Historias — el laboratorio 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 02 — LOS PRIMEROS 30 DÍAS ATV 2026 VOLUMEN TREINTA DÍAS DE CONTENIDO PRIMERO EL HÁBITO, DESPUÉS EL ÁNGULO Del día 10 al 40 no hay estrategia fina: hay construcción y volumen. Vas a tener setecientas dudas y la respuesta a todas es la misma: subí. De diez reels, uno te va a ir bien y uno más o menos, y esos dos te dicen qué ángulo seguir. Lo primero que se construye no es el ángulo: es el hábito de subir contenido. DIEZ REELS EN DOS SEMANAS UNO PEGA ESE ES EL ÁNGULO QUE SEGUÍS UNO MÁS O MENOS MÁS GUARDADOS, MÁS ENVIADOS 01 AL 02 PRINCIPIO NO TE 03 CERRÁS (EJEMPLO: 04 05 TRES VARIANTES A 06 DEL MISMO CASO 07 DEL PLAYBOOK 08 09 10 01) B C EL QUE TIENE PLATA Y NO SABE SEDUCIR EL QUE TIENE POTENCIAL Y NO LO USA EL QUE NO SE ANIMA NI A MIRARLA CAPAZ TIENE EGO Y NO TE VE NADIE CAPAZ RESUENA CON TU FORMA DE HABLAR CAPAZ ES EL QUE MÁS TE ESCRIBE SI TE CERRÁS EN UNA SOLA IDEA, LA CABEZA NO SE EXPANDE Y TE TRABÁS; LA PRUEBA LO DECIDE FIG. 02 — TREINTA DÍAS DE PURO CONTENIDO: PRIMERO EL HÁBITO, DESPUÉS EL ÁNGULO Por eso al principio no te cerrás a un solo avatar. Todavía no te conoce nadie y no sabés qué te funciona; si te encerrás en una idea, la cabeza no se expande y te trabás. Probás dos o tres variantes de tu dream follower y la prueba decide. CÓMO 01 HACER VOLUMEN SIN SOBREPENSAR Fijá el mínimo de la fase: 16 a 20 reels y 4 o 5 videos de YouTube en 30 días. Pasate un poco: el mínimo es el piso, no la meta. 02 No te sientes a escribir desde cero: partí de ángulos que ya le funcionaron a tu competencia y decilos al revés. 03 Después de cada semana, marcá cuál pegó y cuál fue más guardado o enviado. Esa es toda la estrategia de esta fase. → Volumen no es subir cualquier cosa: cada uno de los cuatro reels de la semana sale con una intención distinta. Esa semana tipo es lo que sigue. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 02 — LA LOS PRIMEROS 30 DÍAS ATV 2026 SEMANA CUATRO REELS CUATRO INTENCIONES La estructura son cuatro reels por semana, cada uno con una intención clara. Dos son TOFU puro: hablan al dolor sin mencionar el programa y solo buscan que la persona se identifique y te siga. Uno es MOFU: rompe una creencia convencional y la lleva a tu territorio. Y uno es BOFU: tu experiencia convertida en un paso a paso, que vive en YouTube y al que el reel manda con «comentá la palabra». Los ejemplos de la figura siguen el caso del Playbook 01, la marca de relaciones para hombres: en tu nicho cambian los temas, no las intenciones. TOFU 2 POR SEMANA HABLA AL DOLOR SIN MENCIONAR EL PROGRAMA MOFU 1 POR SEMANA ROMPE UN PARADIGMA Y LO LLEVA A TU TERRITORIO «POR QUÉ LOS QUE MÁS SE ESFUERZAN EN SEDUCIR SON LOS QUE MENOS CONSIGUEN» «SEDUCIR NO ES TÉCNICA: CON LA AUTOIMAGEN BAJA NO SIRVE DE NADA» «LO QUE APRENDÍ MANEJANDO MUJERES EN ONLYFANS SOBRE CÓMO TE PERCIBEN» «LA ROPA OVERSIZED DE MODA TE HACE PARECER UN PITUFO» CTA: «SEGUIME SI QUERÉS ENTENDER…» CTA: NINGUNO; QUE SE QUEDE LA IDEA BOFU 1 POR SEMANA TU EXPERIENCIA CONVERTIDA EN UN PASO A PASO «¿SABÉS POR QUÉ NADIE TE DA BOLA? POR ESTO; LO RESOLVÍ ASÍ: HICE UN VIDEO COMPLETO» CTA: «COMENTÁ LA PALABRA X Y TE LO MANDO» CUATRO REELS, CUATRO INTENCIONES; LOS EJEMPLOS SON DEL CASO DEL PLAYBOOK 01: EN TU NICHO CAMBIAN LOS TEMAS, NO LAS INTENCIONES FIG. 03 — UNA SEMANA TIPO DE LA FASE DE VOLUMEN, CON EJEMPLOS DEL MISMO CASO CÓMO ARMAR LA SEMANA 01 Armá el calendario de la semana con las cuatro casillas vacías y la intención escrita antes que la idea. 02 Los TOFU no llevan CTA de compra: «seguime si querés entender…» y nada más. 03 El BOFU nace del video de YouTube de la semana: primero la idea larga, después el reel que la cuenta. → De los cuatro, el que más cuesta pensar es el MOFU, el que rompe una creencia. Le dedicamos la próxima página. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 02 EL — LOS PRIMEROS 30 DÍAS ATV 2026 MOFU ROMPÉ UNA CREENCIA Y LLEVALA A TU TERRITORIO El MOFU no vende: cambia una creencia. Tomás una idea que la mayoría de tu público da por cierta (en el caso del ejemplo: que seducir es saber qué decir, o que la ropa oversized queda bien) y mostrás dónde falla, desde tu diferencial. No atacás a una persona ni a un competidor: atacás la idea que tiene la mayoría de tu público. Un paradigma así se le queda a la persona para toda la vida, y tu nombre queda pegado a la nueva idea. LA LA IDEA CONVENCIONAL (EJEMPLOS DEL MISMO CASO) TU TERRITORIO «SEDUCIR ES SABER QUÉ DECIR» SI LA AUTOIMAGEN ES BAJA, LA TÉCNICA NO SIRVE «CON UNA CHOMBA DE MARCA LEVANTÁS» NADIE MIRA LA MARCA: MIRA CÓMO TE QUEDA «LA ROPA OVERSIZED QUEDA BIEN» SI MEDÍS 1,70, OVERSIZED ABAJO Y AJUSTADO ARRIBA NO ATACÁS A UNA PERSONA: ATACÁS LA IDEA EL PARADIGMA QUE LE CAMBIA LA CABEZA AL QUE MIRA QUE TIENE LA MAYORÍA DE TU PÚBLICO ES EL QUE SE ACUERDA PARA TODA LA VIDA ESTRUCTURA 1 2 3 4 LA CREENCIA POR QUÉ FALLA LO QUE SÍ SIN CTA LO QUE TODOS DAN POR CIERTO EL CASO DONDE NO FUNCIONA TU REGLA, DESDE TU DIFERENCIAL QUE LA IDEA SE QUEDE DANDO VUELTAS FIG. 04 — EL REEL MOFU NO VENDE: CAMBIA UNA CREENCIA Y DEJA TU NOMBRE PEGADO A LA NUEVA EJEMPLO Del mismo caso, un reel sobre ropa: «si medís un metro setenta y usás todo oversized parecés un pitufo; pantalón suelto abajo y remera ajustada arriba te hacen más alto». Quien lo ve cambia su forma de vestir para siempre, y se acuerda de quién se lo dijo. → Los reels traen gente. El valor largo que convierte seguidores en gente que confía vive en YouTube, y el cuarto reel de la semana es el que manda ahí. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 02 — LOS PRIMEROS 30 DÍAS ATV 2026 YOUTUBE UN CURSO GRATUITO POR SEMANA TODO EL VALOR, SIN RETENER NADA En esta fase subís un video de YouTube por semana, y todavía ninguno vende: son videos de valor, full marca personal. El formato que construye autoridad más rápido es el curso gratuito o la guía completa: treinta minutos resolviendo un solo problema de punta a punta, sin retener nada. Recién cuando haya diez o doce videos y uno ande bien, entra un video que empuje a la venta. CÓMO ELEGIR EL VIDEO DE LA SEMANA QUÉ NECESITA TU NEGOCIO DE QUÉ QUERÉS HABLAR UN VIDEO CON VISITAS SOBRE ESO DESARMARLO TU VERSIÓN ATENCIÓN · AUTORIDAD · LEADS UN DOLOR CON EL QUE TU ICP RESUENA DE UN REFERENTE, DE TU NICHO O DE OTRO PROBLEMA → PROFUNDIZA → SOLUCIÓN → CTA MISMA ESTRUCTURA, TU CASO, TU FORMATO EL FORMATO QUE CONSTRUYE AUTORIDAD RÁPIDO CURSO GRATUITO · GUÍA COMPLETA EJEMPLO DEL CASO: «CÓMO PERDER LA VERGÜENZA PARA EL PENSAMIENTO NADIE TE DEBE NADA; VOS LE DEBÉS TODO A LA GENTE HABLAR CON MUJERES: GUÍA COMPLETA» 30 MINUTOS · PASO A PASO · UN SOLO PROBLEMA RESUELTO TODO EL VALOR, SIN RETENER NADA TODAVÍA SIN VSL: UN VIDEO POR SEMANA, FULL MARCA PERSONAL A NADIE LE IMPORTÁS HASTA QUE VOS LO HAGAS POSIBLE SI HAY QUE ESTAR TRES DÍAS SIN DORMIR PARA QUE EL VIDEO LA ROMPA, SE ESTÁ CUANDO HAYA 10 O 12 VIDEOS Y UNO ANDE BIEN, RECIÉN AHÍ ENTRA UN VIDEO QUE EMPUJE A LA VENTA FIG. 05 — UN VIDEO DE 30 MINUTOS QUE RESUELVE UN PROBLEMA ENTERO TE POSICIONA COMO NINGÚN REEL PUEDE CÓMO 01 ARMAR EL VIDEO DE LA SEMANA Elegí el tema por lo que necesita tu negocio esta semana (atención, autoridad o leads), no por lo que te dan ganas de contar. 02 Buscá un video con visitas que hable de algo parecido y desarmalo: dónde plantea el problema, dónde profundiza, dónde da la solución, dónde cierra. 03 Hacé tu versión con la misma estructura, en el formato que te sea cómodo y acompañe tu marca. → Reels y YouTube ya están en marcha. Las historias, en esta fase, no venden todavía: cumplen otra función, decirte si estás trayendo a la persona correcta. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 02 — LOS PRIMEROS 30 DÍAS ATV 2026 HISTORIAS LAS HISTORIAS TODAVÍA NO VENDEN TE DICEN A QUIÉN ESTÁS TRAYENDO Las historias construyen relación con los que ya te siguen, pero en los primeros 30 días todavía no hay audiencia, así que no son prioridad. Lo que sí hacen es funcionar como laboratorio: tres encuestas por semana sobre temas de tu nicho hacen que la gente se abra y vos entiendas qué problema tienen de verdad. Y hay una señal clave: si preguntás por lo que tu mecanismo soluciona y nadie responde, no estás atrayendo a la persona correcta. TRES ENCUESTAS POR SEMANA «¿QUÉ OPINÁS DE…?» ENTENDÉS QUÉ PROBLEMA TIENEN DE VERDAD LA GENTE SE ABRE «¿QUÉ TE PASA CUANDO INTENTÁS…?» CON SUS PALABRAS: MATERIA PRIMA PARA REELS Y PARA LA OF Y TE VEN COMO LA SOLUCIÓN EMPIEZAN A PREGUNTAR QUÉ OPINÁS VOS «¿TE PASÓ ALGUNA VEZ QUE…?» LA SEÑAL: PREGUNTÁ POR LO QUE TU MECANISMO SOLUCIONA NADIE RESPONDE RESPONDEN VARIOS NO ESTÁS ATRAYENDO GENTE CON EL PROBLEMA QUIEREN SABER QUÉ OPINÁS VOS: QUE VOS RESOLVÉS: AJUSTÁ EL TOFU EL ICP ES EL CORRECTO Y TE VE COMO SOLUCIÓN MÁS: DETRÁS DE CÁMARAS DE LO QUE HACÉS Y UN CTA SUAVE A YOUTUBE; PERO LAS HISTORIAS NO SON PRIORIDAD HASTA QUE HAYA AUDIENCIA FIG. 06 — LAS HISTORIAS NO VENDEN TODAVÍA: TE DICEN SI EL CONTENIDO TRAE A LA PERSONA CORRECTA CÓMO USAR LAS HISTORIAS EN ESTA FASE 01 Programá tres encuestas por semana, siempre sobre el problema que resolvés, con distintas preguntas. 02 Guardá las respuestas textuales: son materia prima para los próximos reels y para ajustar la oferta. 03 Sumá detrás de cámaras de lo que hacés y, una vez por semana, un CTA suave al video de YouTube. → Con reels, YouTube y el laboratorio de historias, los 30 días están armados. Los próximos siete días los ponen en marcha. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 02 — LOS SIETE PRIMEROS 30 DÍAS ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana para dejar armados los 30 días. Después, contenido, contenido, contenido. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 CALENDARIO DÍA 03 CUATRO MOFU DÍA 02 OCHO TOFU DÍA 01 DÍA 05 PRIMERA TANDA DÍA 04 YOUTUBE DÍA 07 REVISIÓN LISTO DÍA 06 ENCUESTAS Armá el calendario de cuatro semanas. Cuatro reels por semana con la intención escrita: dos TOFU, un MOFU, un BOFU. Un video de YouTube por semana. DÍA 02 Escribí los ocho TOFU. Ocho dolores de tu ICP, sin mencionar el programa, con «seguime si…» al final. DÍA 03 Escribí los cuatro MOFU. Cuatro creencias convencionales de tu nicho, dónde fallan y tu regla. DÍA 04 Elegí los cuatro videos de YouTube. Por lo que necesita tu negocio. Desarmá un video de referencia para cada uno. DÍA 05 Grabá la primera tanda. Dos reels y el primer video de YouTube. Sin sobrepensar: el objetivo es el hábito. DÍA 06 Programá las encuestas. Tres por semana sobre el problema que resolvés. DÍA 07 Cerrá la semana con la revisión. Qué reel pegó, cuál fue más guardado y qué respondieron en las encuestas. Eso ajusta la semana siguiente. Cómo sabés que funciona Al día 40 tenés 16 a 20 reels y 4 o 5 videos subidos, dos o tres ángulos que pegaron y encuestas que te confirman a quién estás trayendo. Si no llegaste al volumen, el problema no es de ideas: volvé al día 05 y grabá. AUMENTA TU VALOR 08","PLAYBOOK LA 02 — LOS PRIMEROS 30 DÍAS ATV 2026 SERIE ESTE ES EL PLAYBOOK 02 DE 03 Los tres salen de la misma clase: Cómo crear una marca personal de 0. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le c Ó Al día 40 ya tenés data: sabés qué ángulos generaron más guardados, comentarios y DMs. Esta fase no inventa nada nuevo: duplica lo que funcionó y elimina lo que no movió nada. Tomás los dos o tres ángulos ganadores y los trabajás con más profundidad, en distintos formatos pero con la misma idea central. CON LA DATA DE LOS 30 DÍAS VOZ EN OFF EN YOUTUBE A CÁMARA ÁNGULO GANADOR A B C D E F CASO DE OTRO HISTORIA PROPIA GUARDADOS · COMENTARIOS · DMS DOS O TRES GANADORES SE QUEDAN, EL RESTO SE ELIMINA MIRO / PIZARRA CINCO VARIACIONES DEL MISMO CONCEPTO EN EL MES QUÉ CAMBIA RESPECTO A LA FASE ANTERIOR REELS 4 POR SEMANA SIN PENSAR 3 POR SEMANA, MÁS TRABAJADOS YOUTUBE 1 DE VALOR 2: UNO DE VALOR, UNO QUE VENDE SUAVE HISTORIAS LABORATORIO SECUENCIAS QUE LLEVAN AL DM FIG. 02 — NO REINVENTÁS NADA: PROFUNDIZÁS EN LO QUE YA PROBASTE QUE FUNCIONA EJEMPLO Siguiendo el caso del Playbook 01: si el reel sobre lo que aprendió trabajando con creadoras fue el que más DMs trajo, ese es el ángulo. Se hacen cinco variaciones del mismo concepto en el mes: una en voz en off, una a cámara, una contada como historia propia, una sobre un caso y una en YouTube. CÓMO DUPLICAR LO QUE FUNCIONÓ 01 Ordená los reels de los 30 días por DMs y comentarios, no por views. Los tres primeros son tus ángulos. 02 Para cada ángulo escribí cinco formatos distintos de contarlo. Bajás a tres reels por semana, pero cada uno más trabajado. 03 Lo que no movió nada se corta sin pena: ya cumplió su función de prueba. → Con los ángulos claros, YouTube también cambia: hasta ahora era solo valor, y en esta fase se le suma un segundo video por semana que vende. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 03 — DE VIEWS YOUTUBE QUE A DMS CALIFICADOS ATV 2026 VENDE EL VALOR SIGUE Y SE LE SUMA UN VIDEO QUE VENDE En YouTube pasás a dos videos por semana. Uno sigue siendo el de valor, regalando data a lo loco. El segundo es nuevo: un VSL suave, más cercano, que termina en «si querés que te ayude con esto, agendá una llamada». Si todavía no tenés clientes, el caso de éxito sos vos: mostrás tu propio proceso de transformación. VIDEO 1 · VALOR VIDEO SIGUE IGUAL 2 · VSL SUAVE NUEVO EN ESTA FASE REGALAR DATA A LO LOCO «SI QUERÉS QUE TE AYUDE CON X, AGENDÁ UNA LLAMADA» CURSO GRATUITO, GUÍA COMPLETA ANALIZO TU CASO SIN PEDIR NADA CTA CLARO: LLAMADA O INFOPRODUCTO DOS POR SEMANA: EN REELS BAJÁS LA FRECUENCIA Y EN YOUTUBE LA SUBÍS Y SI TODAVÍA NO TENÉS CLIENTES 1 2 3 4 TU PROPIO PROCESO LO MOSTRÁS COMO CASO PRECIO DE LANZAMIENTO DOS O TRES TESTIMONIOS CÓMO ESTABAS, QUÉ CAMBIASTE VOS SOS EL CASO DE ÉXITO LOS PRIMEROS ENTRAN A CAMBIO DE RESULTADOS Y RECIÉN AHÍ CASOS DE CLIENTES LA HISTORIA PERSONAL EN YOUTUBE RECIÉN AL FINAL: PRIMERO VALOR, CUANDO TE SIGUEN QUIEREN SABER QUIÉN SOS FIG. 03 — EL VALOR SIGUE; SE LE SUMA UN VIDEO QUE EMPUJA A LA VENTA CÓMO PASAR DE VALOR A VENTA EN YOUTUBE 01 Elegí el video de valor que mejor anduvo en los 30 días y hacé su versión que vende: mismo tema, con tu caso y un CTA claro al final. 02 Grabá tu propio antes y después en una pieza honesta: qué te pasaba, qué cambiaste, qué resultado tuviste. 03 Dejá tu historia personal para cuando haya seguidores que la pidan: al principio, valor. → Para que ese CTA a una llamada tenga sentido hace falta algo que vender y un precio. En esta fase los dos se arman en el camino, con los primeros clientes. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 03 — DE PRECIO VIEWS Y A DMS CALIFICADOS ATV 2026 PRODUCTO EL PRODUCTO SE ARMA EN EL CAMINO Todos empezamos sin producto, y eso es normal: el producto se arma en el camino. Al principio vendés llamadas con vos, con un precio de lanzamiento: «esto cuesta cuatro mil, pero como estoy lanzando y quiero casos de éxito te lo doy por mil; a los cinco clientes sube al triple». Si en esos primeros clientes PRECIO invertís más de lo que cobrás, ese es el precio de crear una marca personal. EL PRODUCTO SE ARMA EN EL CAMINO DESPUÉS DE 5: 3000 1 LANZAMIENTO: 1000 2 3 «ESTO CUESTA 4000; COMO ESTOY LANZANDO Y QUIERO CASOS DE ÉXITO, ANALIZÁS SU SITUACIÓN ROADMAP CÓMO LO VISTE Y LOS SIGUIENTES PASOS MISIONES HITOS CONCRETOS (EN EL CASO DEL EJEMPLO: HABLARLE A UNA MUJER, CAMBIAR LA ROPA) CLIENTES LOS PRIMEROS CINCO LLAMADA 4 CUMPLE RECIÉN AHÍ LA SEGUNDA LLAMADA TE LO DOY POR 1000; A LOS CINCO CLIENTES SUBE AL TRIPLE» EL PRECIO LO DEFINE LO QUE LA GENTE PERCIBA; ANTES, SACARTE EL MIEDO A VENDER COMO UN JUEGUITO: HITOS, NO CLASES TODOS EMPEZAMOS SIN PRODUCTO; CON LOS PRIMEROS CLIENTES TE DAS CUENTA DE QUÉ NECESITAN Y CÓMO ARMAR EL ROADMAP SIN QUE VOS TENGAS QUE DAR CADA LLAMADA UNA MARCA PERSONAL VIVE POR EL VALOR QUE APORTA Y A CUÁNTAS PERSONAS AYUDÓ: ESO ES LO QUE TE DEJA SUBIR EL PRECIO FIG. 04 — NO PODÉS SER REY CUANDO TODAVÍA SOS PRÍNCIPE: PRIMERO CLIENTES, DESPUÉS PRECIO CÓMO 01 ARMAR EL PRODUCTO CON LOS PRIMEROS CLIENTES Convertí el vehículo del Playbook 01 en llamadas: qué se ve en la primera, qué en la segunda, qué en la tercera. 02 Entre llamada y llamada, misiones: hitos concretos que la persona cumple antes de la siguiente. Un formulario corto te ahorra horas. 03 Anotá cada pregunta de los primeros clientes: eso es el roadmap que después funciona sin que vos des cada llamada. → Con oferta, precio y producto listos, las historias dejan de ser laboratorio y pasan a hacer lo que hasta ahora no hacían: traer conversaciones que terminan en una llamada. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 03 — DE VIEWS HISTORIAS A QUE DMS CALIFICADOS ATV 2026 CONVIERTEN YA NO IMPORTAN LOS VIEWS IMPORTAN LOS DMS CALIFICADOS En esta fase se activa el setting en historias: secuencias, respuestas a encuestas que derivan a conversaciones y preguntas abiertas que invitan al DM. Cada conversación pasa por la calificación antes de mandar una agenda, y acá recién entra el equipo de ventas. Con eso cambia la métrica: ya no importan los views ni los guardados, importa cuántos DMs calificados entran por semana y cuántos se convierten en llamadas. LA SECUENCIA QUE LLEVA AL DM ENCUESTA RESPUESTA TUYA PREGUNTA ABIERTA SETTER AGENDA LA GENTE RESPONDE QUE DERIVA A CONVERSACIÓN QUE INVITA AL DM CALIFICACIÓN ANTES DE AGENDAR LA LLAMADA ACÁ RECIÉN ENTRA EL EQUIPO DE VENTAS: HASTA AHORA LAS HISTORIAS ERAN LABORATORIO LA MÉTRICA CAMBIA VIEWS GUARDADOS COMPARTIDOS SEGUIDORES SERVÍAN EN LOS PRIMEROS 30 DÍAS DMS CALIFICADOS POR SEMANA Y CUÁNTOS SE CONVIERTEN EN LLAMADAS Y AGENDAS YA NO IMPORTA CUÁNTOS TE VIERON: IMPORTA CUÁNTOS TE ESCRIBIERON CON EL PROBLEMA QUE RESOLVÉS OBJETIVO DEL PERÍODO: 50 DMS CALIFICADOS PROCESADOS EN EL CHAT FIG. 05 — LAS HISTORIAS PASAN DE LABORATORIO A CANAL DE CONVERSACIÓN CÓMO ACTIVAR LAS HISTORIAS 01 Convertí las encuestas que más respuestas tuvieron en secuencias: la encuesta, tu respuesta y una pregunta abierta al final. 02 Definí dos o tres preguntas de calificación antes de agendar, y usalas siempre igual. 03 Contá los DMs calificados de cada semana en una sola fila: ese número es el único que mirás a partir de ahora. → Con un solo número por semana se puede diagnosticar en qué capa se traba la máquina. Esa regla de diagnóstico es lo último de los 90 días. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 03 EL — DE VIEWS A DMS CALIFICADOS ATV 2026 DIAGNÓSTICO UN NÚMERO POR SEMANA TE DICE DÓNDE SE TRABA La métrica de DMs te dice dónde está el problema. Si entran menos de veinte DMs calificados por semana, el problema es TOFU: no estás atrayendo a la persona correcta. Si hay DMs pero no agendas, es MOFU: todavía no te ven como la solución. Si hay agendas pero no cerrás, sos vos o la oferta. Del día 70 al 90 se hace más de lo que funciona, se saca lo que no y, si ya hay clientes, se sistematiza. DÓNDE ESTÁ EL PROBLEMA MENOS DE 20 DMS CALIFICADOS POR SEMANA NO TE VEN COMO LA SOLUCIÓN TODAVÍA SOS VOS O LA OFERTA HAY AGENDAS PERO NO CERRÁS DÍA NO ESTÁS ATRAYENDO A LA PERSONA CORRECTA EL PROBLEMA ES MOFU HAY DMS PERO NO HAY AGENDAS EL EL PROBLEMA ES TOFU EL VEHÍCULO O CÓMO LO CONTÁS 90 3a5 10 a 14 perfil 50 CLIENTES CERRADOS VIDEOS EN YOUTUBE OPTIMIZADO Y CONSISTENTE DMS CALIFICADOS PROCESADOS CON ESOS NÚMEROS TENÉS UN NEGOCIO DE VERDAD, NO UNA CUENTA QUE SUBE CONTENIDO POR CONTENIDO FIG. 06 — DEL 70 AL 90: MÁS DE LO QUE FUNCIONA, MENOS DE LO QUE NO, Y SISTEMATIZAR SI YA HAY CLIENTES CÓMO 01 LEER EL DIAGNÓSTICO Cada semana mirá el número de DMs y aplicá la regla: menos de veinte, TOFU; sin agendas, MOFU; sin cierres, oferta. 02 Corregí una sola cosa por semana, en la capa que falla, y volvé a medir. 03 Al día 90 compará con los cuatro objetivos. Lo que falte es el plan del mes siguiente. → Noventa días, tres fases, un negocio de verdad. Los próximos siete días arrancan la última. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 03 — DE SIETE VIEWS A DMS CALIFICADOS ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana para arrancar la fase que convierte. Después, cincuenta días de hacer más de lo que funciona. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 ÁNGULOS DÍA 03 VSL SUAVE DÍA 02 VARIACIONES DÍA 05 PRODUCTO DÍA 04 PRECIO DÍA 07 DMS LISTO DÍA 06 SECUENCIAS DÍA 01 Ordená tus reels por DMs y comentarios. Los tres ángulos de arriba son los que seguís. El resto se corta. DÍA 02 Escribí cinco variaciones por ángulo. Voz en off, a cámara, historia propia, caso y YouTube. DÍA 03 Grabá tu VSL suave. Tu propio proceso como caso de éxito y un CTA claro a agendar. DÍA 04 Definí el precio de lanzamiento. Precio real, precio de lanzamiento y a cuántos clientes sube. DÍA 05 Armá el producto en llamadas y misiones. Qué se ve en cada llamada y qué hitos cumple la persona entre una y otra. DÍA 06 Activá las secuencias de historias. Encuesta, respuesta, pregunta abierta y las preguntas de calificación. DÍA 07 Empezá a contar DMs calificados. Una fila por semana y la regla de diagnóstico al lado. Cómo sabés que funciona Al día 90 tenés tres a cinco clientes, diez a catorce videos, el perfil consistente y cincuenta DMs calificados procesados. Si falta alguno, el diagnóstico de la página 05 te dice en qué capa trabajar. AUMENTA TU VALOR 08","PLAYBOOK LA 03 — DE VIEWS A DMS CALIFICADOS ATV 2026 SERIE ESTE ES EL PLAYBOOK 03 DE 03 Los tres salen de la misma clase: Cómo crear una marca personal de 0. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo definir las bases de tu marca personal antes de grabar 01 Los primeros diez días: a quién le hablás, qué te hace distinto, qué vendés y cómo se ve tu perfil. Cómo armar tus primeros 30 días de contenido 02 Del día 10 al 40: volumen con intención, cuatro reels por semana, un video de YouTube y las historias como laboratorio. Cómo pasar de views y guardados a DMs calificados que agendan 03 Del día 40 al 90: duplicar lo que funcionó, pasar de valor a venta y medir DMs en vez de views. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s3-1":["PLAYBOOK 01 HISTORIAS QUE VENDEN","PLAYBOOK ANTES 01 DE — HISTORIAS QUE VENDEN ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el primer playbook de la serie: por qué las historias que venden te las ve poca gente y cómo arreglarlo sin dejar de vender. Vas a ver el síntoma con un caso real, el marco A → B → vehículo, un ejemplo de otro nicho llevado a ese caso, cómo medir una secuencia por calificados y no por views, y por qué variar el formato cada semana. Al terminar tenés una secuencia reescrita, una tabla de medición y un PLAYBOOK 03 · IDEAS Y N ME CO NO S formato nuevo programado. DO CA TO DA MÉ VE Z EL DE DÓNDE SALEN Y CÓMO S DA RI CA ND E : O SE Y PLAYBOOK 02 · ENCONTRAR LO QUE FUNCI MI NA SM MA LA MENTALIDAD DEL MARKETING DO A → B → VEHÍCULO LA AN MÉ E TO : QU RE S PE MÁ TÍ E S ND LO RI PLAYBOOK 01 · HISTORIAS QUE VENDEN RI SI N TE OR HOY: EL CONTENIDO RINDE MENOS DE LO QUE DEBERÍA FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 El síntoma — no les interesa el vehículo 02 El marco — a → b → vehículo 03 El ejemplo — primero el deseo, después el vehículo 04 La medida — calificados, no respuestas 05 La variedad — mismo marco, otro formato 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 01 EL — HISTORIAS QUE VENDEN ATV 2026 SÍNTOMA NO ES QUE NO QUIERAN COMPRAR ES QUE NO LES INTERESA EL VEHÍCULO Un caso real para entender el problema: una cuenta de 209.000 seguidores que le vende marketing a profesores de yoga. Cuando sus historias hablan de yoga, que es lo que su audiencia vive todos los días, hacen 4.000 views. Cuando hablan de marketing, de ofertas o de sistemas, caen a 900. La lectura fácil es «a mi audiencia no le interesa comprar». La real es otra: a la audiencia no le interesa el vehículo, porque ni siquiera sabe que lo necesita. El profesor de yoga no quiere hacer marketing: quiere dejar de sentir algo (el VIEWS verano sin clases, tirar de ahorros) y empezar a sentir algo nuevo (libertad, estabilidad). Y ADENTRO DE LA SECUENCIA 5500 PERSONAS 2300 YOGA YOGA MARKETING MARKETING YOGA MARKETING HISTORIAS SOBRE YOGA, LO QUE VIVE SU AUDIENCIA: 4000 VIEWS 50% DE DROP-OFF: HAY UN PUNTO EXACTO DONDE LA GENTE DESCONECTA HISTORIAS SOBRE EL VEHÍCULO (MARKETING, OFERTAS): 900 VIEWS, EN UNA CUENTA DE 209.000 SEGUIDORES NO ES QUE A TU AUDIENCIA NO LE INTERESE COMPRAR: NO LE INTERESA EL VEHÍCULO, PORQUE NI SIQUIERA SABE QUE LO NECESITA EN EL CASO: EL PROFESOR DE YOGA NO QUIERE HACER MARKETING; QUIERE DEJAR DE SENTIR ALGO Y EMPEZAR A SENTIR ALGO NUEVO FIG. 02 — EL CASO REAL: LAS VIEWS CAEN JUSTO CUANDO APARECE LO QUE VENDÉS CÓMO 01 DETECTAR EL PROBLEMA Mirá tus últimas diez secuencias y marcá en cuáles hablaste del vehículo (lo que hacés) y en cuáles del cambio (lo que la persona siente). 02 En la de mejor resultado, buscá el punto exacto de drop-off: ahí está la frase donde la gente desconecta. 03 Anotá, con las palabras de tu audiencia, qué quiere dejar de sentir y qué quiere empezar a sentir. Eso es materia prima para el marco que sigue. → Si hablar del vehículo espanta, la solución no es dejar de venderlo: es camuflarlo. El marco para hacerlo, A → B → vehículo, es lo que sigue. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 01 EL — HISTORIAS QUE VENDEN ATV 2026 MARCO VENDÉS EL CAMBIO NO LA HERRAMIENTA El marco es simple: todo lo que vendés es un vehículo que lleva a una persona de un punto A (lo que siente hoy) a un punto B (lo que quiere sentir). La historia habla de A y de B: del punto A en su lado negativo, del punto B con deseo, con cosas que entretienen y retienen. El vehículo va camuflado en el medio y aparece recién cuando la persona entendió que lo necesita. PUNTO A EL VEHÍCULO PUNTO B LO QUE SIENTE HOY CAMUFLADO EN EL MEDIO LO QUE QUIERE SENTIR DE ESTO HABLÁS DE ESTO NO Y DE ESTO MARKETING VIAJAR EN VERANO VERANO SIN CLASES TIRAR DE AHORROS OFERTA SIN LIBERTAD NI ESTABILIDAD SISTEMAS TRABAJAR MENOS HORAS ESTABILIDAD EMBUDOS EL VEHÍCULO APARECE CUANDO LA PERSONA YA ENTENDIÓ QUE LO NECESITA PARA PASAR DE A A B LA REGLA HABLÁ DE COSAS QUE ENTRETIENEN Y RETIENEN; MOSTRÁ EL PUNTO B CON DESEO Y EL PUNTO A EN SU LADO NEGATIVO; Y RECIÉN AHÍ NOMBRÁS EL VEHÍCULO SI NO LO HACÉS CON ESTE MARCO, MOSTRAR TU DÍA A DÍA TAMPOCO FUNCIONA: SE VUELVE LIFESTYLE SIN DIRECCIÓN FIG. 03 — EL MARCO A → B → VEHÍCULO: VENDÉS EL CAMBIO DE SENSACIÓN, NO LA HERRAMIENTA CÓMO 01 APLICAR EL MARCO Escribí el punto A y el punto B de tu cliente en términos de sensaciones, no de herramientas: «sin libertad» y «viajar en verano», no «sin embudo» y «con embudo». 02 Armá cada secuencia con esa estructura: B visible, A reconocible, vehículo en una frase, CTA. 03 Si una historia solo habla del vehículo, no la subas: reescribila desde A o desde B. → El marco se entiende mejor con un caso real de otro nicho, y después lo llevamos al del profesor de yoga. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 01 EL — HISTORIAS QUE VENDEN ATV 2026 EJEMPLO PRIMERO EL DESEO DESPUÉS EL VEHÍCULO Un ejemplo real de otro nicho, el de la alimentación y el físico. Una creadora muestra en sus historias el punto B: ya tiene el cuerpo que su audiencia quiere tener. Sale comiendo un helado (el punto A de quien la mira: la resistencia a la comida), dice que a ella no le afecta porque lo desintoxica con un jugo especial (el vehículo, en una frase) y cierra con «comentame la palabra tal y te mando la receta». Abre cientos de conversaciones sin hablar del jugo directamente. 1 SE LA VE EN EL PUNTO B EL FÍSICO QUE LA AUDIENCIA QUIERE TENER; SALE COMIENDO UN HELADO EL MISMO MARCO, LLEVADO AL CASO DEL PROFESOR DE Y SE LO VE VIAJANDO EN VERANO (B) 2 APARECE EL PUNTO A «A MÍ NO ME AFECTA COMO A VOS»: LA RESISTENCIA A LA COMIDA «ANTES EL VERANO ERA TIRAR DE AHORROS» (A) 3 EL VEHÍCULO, EN UNA FRASE «LO DESINTOXICO CON UN JUGO ESPECIAL» «HOY NO DEPENDO DE LAS CLASES POR ESTO» (VEHÍCULO) 4 5 EL CTA «COMENTAME LA PALABRA X Y TE MANDO LA RECETA» «ESCRIBIME Y TE CUENTO CÓMO» (CTA) EL RESULTADO CIENTOS DE CONVERSACIONES SIN HABLAR DEL JUGO DIRECTAMENTE EL DÍA A DÍA SIRVE CUANDO MUESTRA EL PUNTO B; NO CUANDO SOLO MUESTRA EL DÍA A DÍA FIG. 04 — MISMO MARCO, OTRO NICHO: PRIMERO EL DESEO, DESPUÉS EL VEHÍCULO LLEVADO AL CASO DEL PROFESOR DE YOGA El mismo marco llevado al caso de la página 01, la cuenta que le vende a profesores de yoga: se lo ve viajando en verano (B), cuenta que antes el verano era tirar de ahorros porque no había clases (A), explica en una frase por qué hoy no depende de las clases (vehículo) y cierra con «escribime y te cuento cómo» (CTA). → Con el marco funcionando, falta saber si una secuencia funcionó de verdad. Y ahí views y respuestas pueden engañarte. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 01 LA — HISTORIAS QUE VENDEN ATV 2026 MEDIDA VIEWS Y RESPUESTAS NO SON CALIFICADOS Las views no dicen nada por sí solas. Un ejemplo real: un recurso gratuito trajo una avalancha de respuestas, y con ellas una cantidad enorme de gente descalificada; otra secuencia, con la mitad de respuestas, trajo el doble de personas calificadas. Por eso las secuencias se comparan por leads calificados y ventas, y recién en la que mejor midió se mira el drop-off para encontrar dónde desconectan. 150 SECUENCIA A SECUENCIA 20 B 42 70 LA MITAD DE RESPUESTAS, EL DOBLE DE CALIFICADOS RESPUESTAS CALIFICADOS RESPUESTAS CALIFICADOS EJEMPLO REAL: LA SECUENCIA A ERA UN RECURSO GRATUITO Y TRAJO MUCHA GENTE DESCALIFICADA; LA B TRAJO GENTE CON INTENCIÓN DE COMPRAR VIEWS Y RESPUESTAS NO DICEN NADA POR SÍ SOLAS: COMPARÁS SECUENCIAS POR LEADS CALIFICADOS Y VENTAS Y EN LA QUE MEJOR MIDIÓ, MIRÁS EL DROP-OFF PARA ENCONTRAR DÓNDE DESCONECTAN FIG. 05 — LA MÉTRICA DE UNA SECUENCIA ES A QUIÉN TRAJO, NO CUÁNTOS LA VIERON CÓMO 01 MEDIR UNA SECUENCIA Armá una tabla con una fila por secuencia: respuestas, calificados, llamadas y ventas. Las dos primeras columnas no deciden nada. 02 Ordená por calificados. La de arriba es tu referencia, aunque haya tenido menos views. 03 En esa referencia, mirá el drop-off historia por historia y reescribí la que pierde gente. → Medir te dice qué repetir. Pero para comparar hacen falta secuencias distintas, y ese es el último problema: cuando son todas iguales, no hay nada que comparar. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 01 LA — HISTORIAS QUE VENDEN ATV 2026 VARIEDAD MISMO MARCO DISTINTO FORMATO Cuando las secuencias son todas iguales, no hay nada para analizar: repetís algo que no termina de funcionar y esperás otro resultado. El marco A → B → vehículo se mantiene; lo que cambia cada vez es el formato: un viaje contado ciudad por ciudad, un caso en video, una pregunta abierta, el detrás de cámara. Un ejemplo real: una secuencia que tenía que mandar gente a un blog se contó como un viaje, ciudad por ciudad, y cerró con «¿están estancados en ideas? viajen; documenté todo y te lo mando». Cuando probás algo distinto ya ganaste, independientemente del resultado, porque tenés un dato nuevo. LO QUE PASA LO MISMA MISMA MISMA MISMA MISMA SECUENCIA SECUENCIA SECUENCIA SECUENCIA SECUENCIA QUE UN VIAJE CONTADO SIEMPRE SOBRE LO MISMO, DEL MISMO MODO: NO HAY NADA PARA ANALIZAR EJEMPLO REAL: UNA SECUENCIA BRASIL, MAYO PARA MANDAR CÓRDOBA GENTE A UN PROBÁS UN CASO EN VIDEO UNA PREGUNTA ABIERTA DETRÁS DE CÁMARA UNA LISTA DE CIUDADES EL MISMO MARCO A → B → VEHÍCULO, EN FORMATOS DISTINTOS BLOG DE BUENOS AIRES VIAJES, PARIS CONTADA CIUDAD POR CIUDAD MARBELLA MADRID «¿ESTÁN ESTANCADOS EN IDEAS? VIAJEN; DOCUMENTÉ TODO EN UN BLOG Y TE LO MANDO»: UN FORMATO NUEVO CON EL MISMO MARCO CON ESA HISTORIA YA GANASTE, SALGA COMO SALGA: PROBASTE ALGO DISTINTO Y TENÉS UN DATO NUEVO FIG. 06 — EL MARCO SE MANTIENE; LO QUE CAMBIA CADA VEZ ES EL FORMATO CÓMO VARIAR SIN PERDER EL MARCO 01 En cada calendario semanal, una secuencia tiene que ser de un formato que nunca probaste. 02 Mantené el marco: aunque el formato sea un viaje, tiene que mostrar el punto B, nombrar el A y dejar el vehículo en una frase. 03 Buscá referentes de tu nicho en otros países y mirá cómo hacen sus secuencias; es la forma más rápida de encontrar formatos nuevos. → Marco, ejemplo, medida y variedad: las historias ya están armadas. Los próximos siete días lo instalan. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 01 — HISTORIAS SIETE QUE VENDEN ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 DIAGNÓSTICO DÍA 03 REESCRIBIR DÍA 02 A Y B DÍA 01 DÍA 05 SUBIR DÍA 04 LA TABLA DÍA 07 FORMATO NUEVO LISTO DÍA 06 REFERENTES Revisá tus últimas diez secuencias. Marcá cuáles hablan del vehículo y cuáles del cambio. Buscá el drop-off en la mejor. DÍA 02 Escribí el punto A y el punto B. En sensaciones, con las palabras de tu audiencia. DÍA 03 Reescribí una secuencia con el marco. B visible, A reconocible, vehículo en una frase, CTA. DÍA 04 Armá la tabla de medición. Una fila por secuencia: respuestas, calificados, llamadas, ventas. DÍA 05 Subí la secuencia reescrita. Y registrala en la tabla al día siguiente. DÍA 06 Buscá tres referentes de otros países. Anotá dos formatos de secuencia que no hayas probado. DÍA 07 Programá el formato nuevo. Con el mismo marco. Pase lo que pase, es un dato más. Cómo sabés que funciona A las cuatro semanas las secuencias que más calificados traen son las que hablan del cambio, no del vehículo, y cada semana hay una de un formato nuevo. Si las views siguen cayendo cuando aparece lo que vendés, volvé al día 03: el vehículo todavía no está camuflado. AUMENTA TU VALOR 08","PLAYBOOK LA 01 — HISTORIAS QUE VENDEN ATV 2026 SERIE ESTE ES EL PLAYBOOK 01 DE 03 Los tres salen de la misma clase: Rendimiento en el contenido. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo hacer historias que venden sin parecer marketing 01 El marco A → B → vehículo: hablar de lo que la gente quiere y camuflar en el medio lo que vendés. Cómo encontrar siempre el formato que funciona con un registro de pruebas 02 Cambiar de proyector, apagar lámparas y construir el edificio: la mentalidad con la que se afronta el marketing. De dónde sacar ideas y cómo organizar tu semana de contenido 03 Las dos fuentes de ideas, la hoja de una página y los referentes que ya tienen los datos que a vos te faltan. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s3-2":["PLAYBOOK 02 ENCONTRAR LO QUE FUNCIONA","PLAYBOOK ANTES 02 DE — ENCONTRAR LO QUE FUNCIONA ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el segundo playbook de la serie: la mentalidad con la que se afronta el marketing. Vas a ver por qué tu resultado de hoy es lo que probaste ayer, cómo probar concentra energía en vez de gastarla, cuántos errores cuesta cada acierto, cómo registrar cada prueba para que deje un dato y qué marco mental hace falta para sostenerlo. Al terminar tenés un registro de pruebas y una prueba nueva por PLAYBOOK 03 · IDEAS Y N ME CO NO S semana en el calendario. DO CA TO DA MÉ VE Z EL DE DÓNDE SALEN Y CÓMO S DA RI CA ND E : O SE Y PLAYBOOK 02 · ENCONTRAR LO QUE FUNCI MI NA SM MA LA MENTALIDAD DEL MARKETING DO A → B → VEHÍCULO LA AN MÉ E TO : QU RE S PE MÁ TÍ E S ND LO RI PLAYBOOK 01 · HISTORIAS QUE VENDEN RI SI N TE OR HOY: EL CONTENIDO RINDE MENOS DE LO QUE DEBERÍA FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 El proyector — tu resultado es lo que probaste 02 Las lámparas — probar concentra energía 03 El edificio — tres errores, un acierto 04 El registro — primero se juega el partido 05 La mente — no sufrir lo sufrible 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 02 EL — ENCONTRAR LO QUE FUNCIONA ATV 2026 PROYECTOR TU RESULTADO DE HOY ES LO QUE PROBASTE AYER Todo lo que tenés hoy (los datos, el calendario, lo que te compran) es una proyección de lo que probaste en el pasado. Existen otras versiones tuyas en paralelo, con otros resultados, y lo único que las separa es que tus acciones no te llevaron ahí. Para tener datos distintos hay que animarse a cambiar de proyector, y lo que hace la mayoría es lo contrario: agregar cosas sobre la misma proyección. TU EL QUE REPITE LO MISMO REALIDAD DE HOY LOS DATOS QUE TENÉS EL CALENDARIO · LA ESTRATEGIA UN FORMATO NUEVO LO QUE LA GENTE TE COMPRA TODO ESTO ES UNA PROYECCIÓN DE LO QUE PROBASTE ANTES OTRO ÁNGULO SI SOLO AGREGÁS COSAS SOBRE LA MISMA PROYECCIÓN (CRM, SOFTWARE, UN FUNNEL MÁS), CREÁS MÁS DE LA MISMA REALIDAD Y MÁS FRUSTRACIÓN OTRO CANAL EXISTEN TODAS TUS VERSIONES EN PARALELO: SI NO TE ANIMÁS A PROYECTAR OTRA, NUNCA VAS A TENER DATOS DISTINTOS FIG. 02 — LA REALIDAD ES UNA PROYECCIÓN DEL PASADO; CAMBIAR EL RESULTADO ES CAMBIAR DE PROYECTOR EJEMPLO Un ejemplo típico: pasaste de 1K a 10K por mes con una forma de hacer contenido y ahora te da miedo tocarla. Nadie dice que la cambies por completo: saltás a otra proyección un día, volvés a la tuya, saltás a otra al día siguiente. De a poco, estás en 20K. CÓMO CAMBIAR DE PROYECTOR 01 Anotá las tres cosas que repetís en tu contenido desde hace meses. Esa es tu proyección actual. 02 Elegí una y cambiala esta semana por algo que nunca hiciste, sin tocar las otras dos. 03 Buscá a alguien que ya tenga la realidad que querés y mirá qué proyectó antes: eso te muestra el proyector al que saltar. → Cambiar de proyector da miedo porque implica equivocarse. Lo que sigue explica, con la imagen de las cien lámparas, por qué equivocarse no gasta energía: la concentra. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 02 — LAS ENCONTRAR LO QUE FUNCIONA ATV 2026 LÁMPARAS PROBAR NO GASTA ENERGÍA LA CONCENTRA Pensalo como cien lámparas prendidas. Probás una, no funciona, la apagás; la energía que esa lámpara no consume la agarran las otras noventa y nueve. Seguís apagando hasta que quedan una o dos, y esas brillan mucho: ahí hacés plata. Si te quedás con una que medio brilló por miedo a apagar las demás, nunca llegás a las que brillan de verdad. CIEN LÁMPARAS PRENDIDAS: PROBÁS UNA, NO FUNCIONA, LA APAGÁS LA ENERGÍA QUE NO CONSUME LA AGARRAN LAS OTRAS NOVENTA Y NUEVE APAGÁS, APAGÁS, APAGÁS… HASTA QUE QUEDAN UNA O DOS Y BRILLAN MUCHO AHÍ HACÉS PLATA; SI TE QUEDÁS CON UNA QUE MEDIO BRILLÓ POR MIEDO, NUNCA LLEGÁS EQUIVOCARSE MEJORA EL CRITERIO: CADA LÁMPARA APAGADA ES UN CAMINO DESCARTADO FIG. 03 — PROBAR NO ES GASTAR ENERGÍA: ES CONCENTRARLA CÓMO 01 APAGAR LÁMPARAS Listá todos los formatos, ángulos y canales que todavía no probaste: por ejemplo, un caso de éxito en video, una secuencia de historias contada como viaje, un video largo de valor, un reel a cámara sin edición. Esas son tus lámparas prendidas. 02 Cada semana apagá una: probala en serio una vez, con la misma energía que le ponés a lo que ya funciona, y registrá qué pasó. 03 Cuando una brille, no la cuides: seguí apagando el resto para que brille más. → Apagar lámparas tiene un costo, y conviene saberlo de antemano: tres errores por cada acierto. Así se constru
