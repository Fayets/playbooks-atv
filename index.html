ye el edificio, y es lo que viene. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 02 EL — ENCONTRAR LO QUE FUNCIONA ATV 2026 EDIFICIO TRES ERRORES UN ACIERTO El marketing se construye como un edificio: se prueba una, dos, tres veces y no pega; a la cuarta pega y ponés el primer bloque. Cinco, seis, siete, nada; a la octava, el segundo bloque. Tres errores, un acierto, y así subís pisos. Lo que la mayoría imagina (solo aciertos, sin pasar por el rojo) no existe. Los infoproductores top sacan videos que parecen no tener nada que ver: están subiendo al piso diez. LOS INFOPRODUCTORES TOP PRUEBAN COSAS TODO EL TIEMPO: ESTÁN SUBIENDO PISOS BLOQUE 3 TRES ERRORES, UN ACIERTO BLOQUE 2 TRES ERRORES, UN ACIERTO BLOQUE 1 TRES ERRORES, UN ACIERTO CÓMO SE CONSTRUYE DE VERDAD CÓMO LO IMAGINA LA MAYORÍA BLOQUES SÓLIDOS QUE SOSTIENEN EL CRECIMIENTO SOLO ACIERTOS, SIN PASAR POR EL ROJO: NO EXISTE FIG. 04 — PARA ESTAR EN EL PISO CIEN HAY QUE PASAR POR TODOS LOS ERRORES DEL MEDIO CÓMO CONSTRUIR EL EDIFICIO 01 Antes de cada prueba, escribí qué creés que va a pasar. Después compará: eso es lo que entrena el criterio. 02 Contá tus pruebas de los últimos tres meses. Si son menos de doce, no tenés nada para analizar: el problema no es el análisis, es que no probaste. 03 Cuando algo pegue, repetilo dos o tres veces antes de volver a probar: cada bloque se consolida. → Para que el edificio suba, cada prueba, funcione o no, tiene que dejar un dato. Eso se logra con un registro de tres columnas. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 02 — EL ENCONTRAR LO QUE FUNCIONA ATV 2026 REGISTRO PRIMERO SE JUEGA EL PARTIDO DESPUÉS SE ANALIZA No existe la prueba que sale mal: el resultado se analiza después. Primero se juega el partido. Un ejemplo real, el registro de pruebas de YouTube de una cuenta durante un mes: un video que debió tener dos mil views y tuvo mil trescientas dice dónde se fue la gente, qué adelantó y qué le interesó más; con eso se combinó lo mejor de dos pruebas en una tercera, que hizo dos mil doscientas en dos días. Y antes de decir que algo no funciona, fijate dónde pusiste el estándar. EJEMPLO REAL: EL REGISTRO DE PRUEBAS DE YOUTUBE DE UNA CUENTA, EN UN MES FORMATO PROBADO RESULTADO QUÉ SE APRENDIÓ UNA ENTREVISTA GRABADA EN UNA LLAMADA 2.8k FUNCIONA: SE REPITE DOS O TRES VECES UN CASO DE ÉXITO CONTADO JUGANDO AL POOL 1.3k NO TAN BIEN: SE MIRA DÓNDE SE FUE LA GENTE UN SISTEMA DESARMADO EN UNA PIZARRA 1.9k FUNCIONA UN VIDEO QUE COMBINA LOS DOS QUE FUNCIONARON 2.2k en dos días LO MEJOR DE CADA UNO EN UN VIDEO NUEVO UN INICIO DISTINTO A TODO LO ANTERIOR ? YA GANÉ: PROBÉ ALGO QUE CREÍA QUE IBA A FUNCIONAR NO IMPORTA TANTO SI ALGO FUNCIONA O NO: IMPORTA AVANZAR; PRIMERO SE JUEGA EL PARTIDO Y DESPUÉS SE ANALIZA EL ESTÁNDAR DEFINE QUÉ «FUNCIONA»: A CIEN MIL POR MES, UN MES DE CIEN MIL ES UN FRACASO SI QUERÉS UN MILLÓN EN CADA CALENDARIO SEMANAL O MENSUAL, PROBÁ ALGO DISTINTO; INSPIRATE EN QUIEN YA TIENE DATOS FIG. 05 — EL REGISTRO: CADA PRUEBA DEJA UN DATO, FUNCIONE O NO CÓMO LLEVAR EL REGISTRO 01 Llevá un registro de tres columnas por pieza: formato probado, resultado y qué se aprendió. Nada más. 02 Después de cada prueba floja, mirá dónde se fue la gente y dónde adelantó; ahí está la mejora. 03 Cada mes, combiná lo mejor de dos pruebas en una pieza nueva y registrala también. → Todo esto es más mental que técnico: el framework no sirve si la cabeza que lo usa no soporta equivocarse. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 02 LA — ENCONTRAR LO QUE FUNCIONA ATV 2026 MENTE APRENDÉ A NO SUFRIR LO QUE ES SUFRIBLE Todos los frameworks, calendarios y Miros no sirven si no tenés el marco mental para atravesarlos. Lo que define a una persona que emprende es su capacidad de análisis, de autocrítica y de manejo de emociones para seguir avanzando a pesar de. No es mindset ni espiritualidad: si algo duele o baja la autoestima, es una emoción que se aprende a manejar. Y hay un enemigo silencioso: conformarse con la cifra que ya hacés y cuidarla por miedo. AUTOCRÍTICA ANÁLISIS MANEJO DE EMOCIONES QUÉ HICE YO PARA QUE PASE VER QUÉ PASÓ SIN EXCUSAS SEGUIR A PESAR DE LA CAPACIDAD DE VOLVERSE EXITOSO EMPRENDIENDO ES ESTO: ANALIZAR, CRITICARSE Y SEGUIR AVANZANDO A PESAR DE APRENDÉ A NO SUFRIR LO QUE ES SUFRIBLE: SI ALGO DUELE O BAJA LA AUTOESTIMA, ES UNA EMOCIÓN QUE SE APRENDE A MANEJAR Y NO TE CONFORMES CON UNA CIFRA: EL QUE CUIDA LO QUE TIENE POR MIEDO NO CAMBIA DE PROYECTOR NO ES MINDSET NI ESPIRITUALIDAD: ES LA VERDAD DE LA REALIDAD FIG. 06 — ANTES DE CUALQUIER FRAMEWORK, LA MENTE CON LA QUE LO VAS A AFRONTAR EJEMPLO Un ejemplo real que viene de ventas, pero aplica igual al contenido: un closer no se animó a salirse de su guion con un prospecto que ya lo conocía, porque ese guion le daba sus 10K por mes. Para llegar a 20K había que animarse a salir: la gente que paga más ya se sabe el guion. Con el contenido pasa lo mismo: el formato que te dio lo que tenés no te va a dar lo que sigue. CÓMO 01 ENTRENAR EL MARCO MENTAL Cuando una prueba salga mal, escribí la emoción que sentiste y qué vas a hacer igual. Separar las dos cosas es el entrenamiento. 02 Revisá si estás cuidando una cifra. Si la respuesta es sí, esa es la señal de que toca cambiar de proyector. 03 Usá lo que ganás para moverte, no para guardarlo: una cifra no puede conformarte nunca. → Proyector, lámparas, edificio, registro y mente: el método está completo. Los próximos siete días lo instalan. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 02 — ENCONTRAR SIETE LO QUE FUNCIONA ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 PROYECCIÓN DÍA 03 REFERENTE DÍA 02 LÁMPARAS DÍA 05 REGISTRO DÍA 04 LA PRUEBA DÍA 07 ANALIZAR LISTO DÍA 06 SUBIR DÍA 01 Describí tu proyección actual. Las tres cosas que repetís en tu contenido desde hace meses. DÍA 02 Listá las lámparas prendidas. Todo formato, ángulo y canal que todavía no probaste. DÍA 03 Elegí un referente que ya esté donde querés. Mirá qué proyectó antes y anotá dos cosas que vos no hiciste. DÍA 04 Programá la primera prueba. Una sola cosa distinta esta semana, con tu predicción escrita. DÍA 05 Armá el registro. Formato probado, resultado, qué se aprendió. Una fila por pieza. DÍA 06 Subí la prueba. Pase lo que pase, es un dato. No la juzgues antes de analizarla. DÍA 07 Analizá y decidí la siguiente. Dónde se fue la gente, qué adelantó. Apagá la lámpara o repetila. Cómo sabés que funciona A las cuatro semanas tenés cuatro pruebas registradas, una que pegó y tres caminos descartados. Si no probaste nada nuevo, el problema no es de contenido: volvé al día 05 y mirá qué cifra estás cuidando. AUMENTA TU VALOR 08","PLAYBOOK LA 02 — ENCONTRAR LO QUE FUNCIONA ATV 2026 SERIE ESTE ES EL PLAYBOOK 02 DE 03 Los tres salen de la misma clase: Rendimiento en el contenido. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo hacer historias que venden sin parecer marketing 01 El marco A → B → vehículo: hablar de lo que la gente quiere y camuflar en el medio lo que vendés. Cómo encontrar siempre el formato que funciona con un registro de pruebas 02 Cambiar de proyector, apagar lámparas y construir el edificio: la mentalidad con la que se afronta el marketing. De dónde sacar ideas y cómo organizar tu semana de contenido 03 Las dos fuentes de ideas, la hoja de una página y los referentes que ya tienen los datos que a vos te faltan. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s3-3":["PLAYBOOK 03 IDEAS Y ORGANIZACIÓN","PLAYBOOK ANTES 03 DE — IDEAS Y ORGANIZACIÓN ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el tercer playbook de la serie: de dónde salen las ideas y cómo se organizan. Vas a abrir las dos fuentes que ya tenés, armar la hoja de una página, convertir cada respuesta de una llamada en contenido, usar a tus referentes como datos que no pagaste y entender la marca como respaldo de la PLAYBOOK 03 · IDEAS Y N ME CO NO S oferta. Al terminar, las ideas no se acaban y la semana se arma en tres minutos. DO CA TO DA MÉ VE Z EL DE DÓNDE SALEN Y CÓMO S DA RI CA ND E : O SE Y PLAYBOOK 02 · ENCONTRAR LO QUE FUNCI MI NA SM MA LA MENTALIDAD DEL MARKETING DO A → B → VEHÍCULO LA AN MÉ E TO : QU RE S PE MÁ TÍ E S ND LO RI PLAYBOOK 01 · HISTORIAS QUE VENDEN RI SI N TE OR HOY: EL CONTENIDO RINDE MENOS DE LO QUE DEBERÍA FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 Las dos fuentes — onboarding y llamadas 02 La hoja — tres canales, una necesidad 03 Las llamadas — cada respuesta es una pieza 04 Los referentes — ya pagaron las pruebas que vos no hiciste 05 El respaldo — la fuerza detrás de la oferta 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 03 LAS — IDEAS DOS Y ORGANIZACIÓN ATV 2026 FUENTES NO BUSQUES SER CREATIVO MIRÁ ADENTRO Y AFUERA No hace falta ser creativo: la creatividad llega cuando mirás adentro y afuera. Adentro hay dos fuentes que ya tenés. El formulario de onboarding te dice quién te paga y qué consume: si el que más te paga te ve en YouTube, el foco va a YouTube, aunque los reels sigan. Y las llamadas con clientes te dan los problemas reales: cada pregunta que te hacen es un problema de tu cliente ideal, y tu respuesta ya es la solución. EL FORMULARIO DE ONBOARDING LAS LLAMADAS CON CLIENTES QUIÉN TE PAGA Y QUÉ CONSUME LOS PROBLEMAS DE TU CLIENTE IDEAL QUÉ ME CONSUMÍS: YOUTUBE, REELS O HISTORIAS CADA PREGUNTA ES UN PROBLEMA REAL QUÉ TE LLAMÓ LA ATENCIÓN Y QUÉ NO TU RESPUESTA YA ES LA SOLUCIÓN POR QUÉ PROBLEMA ME HABLASTE ANOTÁS PROBLEMA Y SOLUCIÓN; ESO ES UNA PIEZA EL PRÓXIMO CALENDARIO SI QUIEN TE PAGA TE VE EN YOUTUBE, EL FOCO VA A YOUTUBE; LOS REELS SIGUEN, PORQUE PROBABLEMENTE VIO UNO ANTES, PERO LA ENERGÍA VA DONDE COMPRA FIG. 02 — NO BUSCÁS SER CREATIVO: LA CREATIVIDAD LLEGA CUANDO MIRÁS ADENTRO Y AFUERA CÓMO ABRIR LAS DOS FUENTES 01 Agregá a tu onboarding tres preguntas: qué me consumís, qué te llamó la atención y por qué problema me escribiste. 02 Cada tres meses, mirá dónde te ve la gente que más paga y mové ahí tu energía, sin dejar de hacer el resto. 03 Guardá las respuestas en un solo lugar: es el banco del que salen los próximos calendarios. → Con las dos fuentes abiertas, falta ordenar lo que sale de ahí en una semana. Para eso alcanza una hoja de una sola página, y se arma en tres minutos. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 03 LA — IDEAS Y ORGANIZACIÓN ATV 2026 HOJA TRES CANALES UNA NECESIDAD POR SEMANA La organización es más simple de lo que parece. Una hoja con tres canales (YouTube, Reels, Stories) y una pregunta arriba: ¿qué nos falta esta semana? Si faltan chats, las historias van a abrir conversaciones; si hay casos nuevos, se muestran; si el closer recibe objeciones, se rompen. Qué falta lo dice la métrica de la semana (chats, casos, objeciones); acá importa cómo se ordena: para cada canal se define qué y dónde buscar, y después se sale a buscar referencias. ¿QUÉ NOS FALTA ESTA SEMANA? CHATS, PORQUE EL SETTER ESTÁ SIN CONVERSACIONES · HAY CASOS DE ÉXITO NUEVOS · EL CLOSER RECIBE MUCHAS OBJECIONES YOUTUBE REELS STORIES QUÉ QUÉ QUÉ CONTENIDO CON MUCHAS VISITAS QUE HABLE DE XYZ TRES TOFU Y UN MOFU ABRIR CHATS · MOSTRAR CASOS · ROMPER OBJECIONES DÓNDE BUSCAR DÓNDE BUSCAR DÓNDE BUSCAR BUSCAR REFERENCIAS CON VISITAS SOBRE ESE PROBLEMA ADAPTADO A LO QUE TU CREADOR PUEDE HACER SECUENCIAS CON EL MARCO A → B → VEHÍCULO CLICK, BLOQUE, CHAU: TRES CANALES, UNA NECESIDAD, UNA BÚSQUEDA POR CANAL Y DESPUÉS, REFERENCIAS: EL FORMATO YA PROBADO DE ALGUIEN QUE ESTÁ DONDE QUERÉS ESTAR EL CALENDARIO ORDENA; EL CRITERIO DECIDE: SI EL SÁBADO HAY ALGO QUE CONECTA MÁS, SE SUBE ESO Y EL LUNES EL CTA SE CONTESTA FIG. 03 — MÁS SIMPLE DE LO QUE PARECE: LA HOJA ENTERA SE ARMA EN TRES MINUTOS CÓMO ARMAR LA HOJA 01 Armá la hoja: una línea arriba con lo que falta, tres columnas con qué y dónde buscar. 02 Adaptala a lo que tu creador puede hacer de verdad; si no puede tres TOFU, que sean dos. 03 Dejá lugar al criterio: si pasa algo que conecta más que lo planificado, se sube eso y el calendario se corre un día. → La hoja te dice qué buscar cada semana. De las dos fuentes de la página 01, la de las llamadas merece su propia página, porque es la más barata y la que menos gente usa. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 03 LAS — IDEAS Y ORGANIZACIÓN ATV 2026 LLAMADAS CADA RESPUESTA QUE DAS ES UNA PIEZA DE CONTENIDO Cuando un cliente te hace una pregunta, tu cabeza conecta su problema con una solución que ya tenés. Eso es una idea de contenido completa: problema planteado y solución específica. La misma respuesta se convierte en un video de YouTube, en un reel y en una secuencia de historias. Prendés la cámara y hablás, o lo anotás y alguien del equipo busca referencias de quien hizo algo parecido. YOUTUBE EJEMPLO REAL: «ELIMINÉ MIS CREENCIAS LIMITANTES Y MI CONTENI TU RESPUESTA UNA PREGUNTA DE UN CLIENTE PROBLEMA PLANTEADO + SOLUCIÓN ESPECÍFICA REEL EJEMPLO REAL: «¿HACÉS MENOS DE 100K AL MES? PORQUE NO HACÉS HISTORIA LA MISMA IDEA, EN UNA SECUENCIA CON CTA CADA LLAMADA CONECTA UN PROBLEMA REAL CON UNA SOLUCIÓN TUYA: SOLO FALTA COMUNICARLA PRENDÉS LA CÁMARA Y HABLÁS, O LO ANOTÁS; DESPUÉS ALGUIEN DEL EQUIPO BUSCA REFERENCIAS DE QUIEN HIZO ALGO PARECIDO LA IDEA YA ESTÁ: SOLO HAY QUE ENCAJARLA EN UN FORMATO QUE FUNCIONE FIG. 04 — LAS RESPUESTAS QUE DAS EN VIVO SON EL BANCO DE IDEAS MÁS BARATO QUE TENÉS EJEMPLO Un ejemplo real: en una llamada, a un cliente se le explicó cómo sus creencias limitantes le frenaban el contenido. Esa misma explicación es un video de YouTube («eliminé mis creencias limitantes y mi contenido me generó 170K al mes»), un reel («¿hacés menos de 100K al mes? porque no hacés esto») y una secuencia de historias con CTA. Una respuesta, tres piezas. CÓMO CONVERTIR LLAMADAS EN CONTENIDO 01 Después de cada llamada, anotá en una línea el problema y en otra tu respuesta. Dos líneas, nada más. 02 Una vez por semana, elegí las tres mejores y asignales un canal. 03 Pasale las tres a quien busca referencias con una instrucción: «quiero atraer visitas / convertir, con esta idea». → De las llamadas sale la idea; falta el formato en el que se cuenta. Los formatos que ya funcionan los tienen tus referentes, y es lo que sigue. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 03 — LOS IDEAS Y ORGANIZACIÓN ATV 2026 REFERENTES ELLOS YA PAGARON LAS PRUEBAS QUE VOS NO HICISTE Tus referentes son personas que ya están donde vos querés estar, y dejaron huellas: visitas, likes, comentarios, ventas. Probaron cosas que vos no probaste, y sería ridículo no aprovechar esos datos. No se trata de copiarlos: se usa el mismo molde con distinto contenido. Dos trucos. El primero es buscar en otro idioma: un ejemplo real, un coach fitness que trabaja con mujeres tradujo «cómo bajar de peso sin rebote» al inglés, lo buscó en YouTube y encontró un video de 112.000 views de un canal chico, una idea que en su mercado nadie había hecho. El segundo es filtrar por tu personaje: un video de 167 mil views no sirve si tu creador no engancha con esa marca. TU REFERENTE SU PROYECCIÓN LOS DATOS QUE NO TENÉS EL MOLDE ALGUIEN QUE YA ESTÁ DONDE QUERÉS, EN TU NICHO O EN OTRO PAÍS DEJÓ HUELLAS: VISITAS, LIKES, COMENTARIOS, VENTAS PROBÓ COSAS QUE VOS NO PROBASTE MISMO MOLDE, DISTINTO CONTENIDO NO SE TRATA DE COPIARLOS: SERÍA RIDÍCULO NO USAR DATOS QUE ALGUIEN YA PAGÓ CON PRUEBAS EL TRUCO DEL IDIOMA (EJEMPLO: UN COACH FITNESS) EL PERSONAJE DECIDE «CÓMO BAJAR DE PESO RÁPIDO SIN REBOTE NI DIETAS ESTRICTAS» UN VIDEO DE 167K VIEWS PUEDE NO SERVIR SE TRADUCE AL INGLÉS Y SE BUSCA EN YOUTUBE SI TU CREADOR NO ENGANCHA CON ESA MARCA 112.000 VIEWS EN UN MES, DE UN CANAL CHICO: UNA IDEA GANADORA EL PERSONAJE SE DEFINE ANTES QUE LAS REFERENCIAS EJEMPLO REAL: UN CREADOR CON LAS MISMAS VIEWS QUE VOS PROBÓ UN BLOG (1.8K VIEWS) Y DESPUÉS OTRO FORMATO (102K); NO SE CONFORMÓ INGENIERÍA INVERSA DE OTRA REALIDAD: VES QUÉ PROYECTARON Y LO LLEVÁS A LO TUYO FIG. 05 — TUS REFERENTES SON LOS QUE YA PAGARON LAS PRUEBAS QUE VOS NO HICISTE CÓMO USAR A TUS REFERENTES 01 Definí cinco referentes que estén en la realidad que querés, en tu nicho y en otros, en tu idioma y en inglés. 02 Para cada idea de la hoja, buscá en ellos el video con más visitas sobre ese problema y anotá el molde. 03 Descartá cualquier referencia que no vaya con tu personaje, aunque tenga muchas views. → Fuentes, hoja, llamadas y referentes resuelven qué publicar. Queda un uso de la marca que casi nadie ve: no para vender con ella, sino para que la oferta valga más cuando te entran a mirar. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 03 EL — IDEAS Y ORGANIZACIÓN ATV 2026 RESPALDO CUANDO TODOS VENDEN LO MISMO GANA LA FUERZA DETRÁS Cuando todos venden la misma oferta, la diferencia no está en la oferta: está en la fuerza que hay detrás. Casos de éxito, valor en YouTube, un perfil optimizado y videos que muestran que la tenés clara hacen que la misma oferta valga más. Un ejemplo real: una persona que vende prospectando por mensaje usa su marca sin vender con ella. La usa como respaldo para que, cuando escribe entendiendo el problema del otro y lo entran a mirar, la persona diga «este la tiene clara», aunque los videos tengan quince views. Los demás que prospectan no tienen videos, ni fotos, ni YouTube. TODOS VENDEN LO MISMO LA FUERZA DETRÁS CASOS DE ÉXITO OFERTA OFERTA OFERTA OFERTA OFERTA VALOR EN YOUTUBE PERFIL OPTIMIZADO MISMA OFERTA, MISMO DONE FOR YOU VIDEOS QUE MUESTRAN QUE LA TENÉS CLARA LA DIFERENCIA NO ESTÁ EN LA OFERTA LA MISMA OFERTA, CON MÁS FUERZA: VALE MÁS CÓMO LA USA ALGUIEN QUE PROSPECTA 1 2 3 4 TE ESCRIBE ENTRÁS A SU PERFIL «LA TIENE CLARA» SU OFERTA VALE MÁS ENTENDIENDO TU PROBLEMA VIDEOS, FOTOS, YOUTUBE SIN SABER BIEN POR QUÉ QUE LA DE LOS QUE NO TIENEN NADA NO IMPORTA QUE EL VIDEO TENGA 15 VIEWS: ES UN RESPALDO PARA CUANDO TE ENTREN A MIRAR LOS DEMÁS QUE PROSPECTAN NO TIENEN VIDEOS, NI FOTOS, NI YOUTUBE: LA DIFERENCIA SE NOTA SIN QUE NADIE SEPA EXPLICAR POR QUÉ FIG. 06 — CUANDO LA OFERTA ES IGUAL PARA TODOS, GANA LA QUE TIENE MÁS FUERZA DETRÁS CÓMO 01 USAR LA MARCA COMO RESPALDO Antes de prospectar, asegurate de que quien te mire encuentre tres cosas: un caso, un video de valor y un perfil claro. 02 Cuando escribas, hacelo entendiendo el problema de la persona; el perfil hace el resto cuando te entra a mirar. 03 No midas ese contenido por views: medilo por si está o no está cuando alguien te busca. → Fuentes, hoja, llamadas, referentes y respaldo: el sistema de ideas está completo. Los próximos siete días lo instalan. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 03 — IDEAS SIETE DÍAS Y ORGANIZACIÓN ATV 2026 LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 ONBOARDING DÍA 03 LA HOJA DÍA 02 EL FOCO DÍA 01 DÍA 05 REFERENTES DÍA 04 LLAMADAS DÍA 07 RESPALDO LISTO DÍA 06 MOLDES Agregá las tres preguntas al onboarding. Qué me consumís, qué te llamó la atención, por qué problema me escribiste. DÍA 02 Mirá dónde te ve quien más paga. Y decidí dónde va tu foco este trimestre. DÍA 03 Armá la hoja de la semana. Qué falta, tres canales, qué y dónde buscar. DÍA 04 Anotá las respuestas de tus llamadas. Problema y solución, dos líneas por llamada, durante toda la semana. DÍA 05 Definí tus cinco referentes. En tu idioma y en inglés, en tu nicho y en otros. DÍA 06 Buscá un molde por idea. El video con más visitas sobre cada problema; descartá lo que no va con tu personaje. DÍA 07 Revisá tu respaldo. Un caso, un video de valor y un perfil claro, listos para cuando te entren a mirar. Cómo sabés que funciona A las cuatro semanas no te sentás a pensar ideas: las sacás del onboarding, de las llamadas y de los referentes, y la hoja se arma en tres minutos. Si todavía te quedás en blanco, volvé al día 04: no estás anotando lo que respondés. AUMENTA TU VALOR 08","PLAYBOOK LA 03 — IDEAS Y ORGANIZACIÓN ATV 2026 SERIE ESTE ES EL PLAYBOOK 03 DE 03 Los tres salen de la misma clase: Rendimiento en el contenido. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo hacer historias que venden sin parecer marketing 01 El marco A → B → vehículo: hablar de lo que la gente quiere y camuflar en el medio lo que vendés. Cómo encontrar siempre el formato que funciona con un registro de pruebas 02 Cambiar de proyector, apagar lámparas y construir el edificio: la mentalidad con la que se afronta el marketing. De dónde sacar ideas y cómo organizar tu semana de contenido 03 Las dos fuentes de ideas, la hoja de una página y los referentes que ya tienen los datos que a vos te faltan. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s4-1":["PLAYBOOK 01 QUÉ ATRAE Y QUÉ CONVIERTE","PLAYBOOK ANTES 01 DE — QUÉ ATRAE Y QUÉ CONVIERTE ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el primer playbook de la serie: cómo saber por qué te compran los que te compran. Vas a achicar la pregunta a diez o veinte clientes, rastrear de dónde vinieron y desde qué posicionamiento compraron, escribir un documento de conclusiones del que sale todo el contenido, cruzarlo cada semana con los reportes de venta y dejar que el dato decida. Al terminar tenés el documento base y el creador sabe de PLAYBOOK 03 · TAREAS TRADUCIR EL QUÉ EN UN C TO PO MÉ CA EL CL N AR CO ID AD qué hablar. BÉ RU SA ID : O, DO CH S O PLAYBOOK 02 · DE LA MÉTRICA A LA ACC MU EL CH Y A R DA CE TA HA , É MU QU UN PROBLEMA GRANDE POR MES : EQ IÉ SI MB N TA MÉ TUS VEINTE MEJORES CLIENTES PO TO UI DO PLAYBOOK 01 · QUÉ ATRAE Y QUÉ CONVIERTE N HOY: TENÉS MÉTRICAS PERO NO PREDICTIBILIDAD FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 La pregunta — preguntale a los que pagaron 02 La ingeniería inversa — dolor y posicionamiento 03 Las conclusiones — un solo documento 04 El cruce — qué falta para que convierta 05 El dato manda — ni gusto ni vehículo 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 01 LA — QUÉ ATRAE Y QUÉ CONVIERTE ATV 2026 PREGUNTA NO ANALICES TODO PREGUNTALE A LOS QUE PAGARON Tenés métricas, ventas y un creador con audiencia, pero no sabés por qué te compran los que te compran, y eso te deja sin predictibilidad. La reacción habitual es analizar todo: las llamadas cerradas, un resumen con IA, un PDF, un Loom para el creador. Y el creador termina con más ruido y menos claridad. La pregunta correcta es más chica: «esta persona, ¿por qué me compró?», y se responde con diez o veinte clientes, no con toda la base. LO QUE HACÉS HOY LO QUE HACÉS EN CAMBIO ANALIZÁS LAS LLAMADAS CERRADAS RESUMEN CON IA ¿POR QUÉ ME COMPRÓ? UNA PERSONA UN PDF POR ESTO, POR ESTO, POR ESTO UN LOOM PARA EL CREADOR EL CREADOR LO ANALIZA SE LO ESCRIBÍS TEXTUAL MUCHA INFO, NINGUNA CLARIDAD: RUIDO PARA ÉL Y PARA VOS AL CREADOR: HABLÁ DE ESTO REPETÍ LOS PROBLEMAS, NADA MÁS LA PREGUNTA NO ES «QUÉ DICEN TODAS LAS LLAMADAS»: ES «POR QUÉ ME PAGARON LOS QUE ME PAGARON» Y ESO SE RESPONDE CON DIEZ O VEINTE PERSONAS, NO CON TODA LA BASE FIG. 02 — MENOS ANÁLISIS, MEJOR PREGUNTA CÓMO ACHICAR LA PREGUNTA 01 Frená el análisis de todas las llamadas: no lo hagas, es ruido para vos y para el creador. 02 Elegí diez a veinte clientes de los últimos tres meses, priorizando los que pagaron upfront y con pocas objeciones. 03 Para cada uno, anotá en una línea por qué te compró, con sus palabras. Eso ya es contenido. → Con los diez o veinte clientes elegidos, lo que sigue es rastrear de dónde vino cada uno y qué lo trajo. Esa tabla es la ingeniería inversa. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 01 — LA QUÉ ATRAE INGENIERÍA Y QUÉ CONVIERTE ATV 2026 INVERSA EL DOLOR LO TOCA CUALQUIERA EL POSICIONAMIENTO ES TUYO Para cada cliente rastreás tres cosas: de qué historia, reel o video vino y qué conversación contestó; el dolor o tema por el que vino; y el posicionamiento desde el que le mostraste la solución. Las dos últimas son distintas, y la diferencia importa: el dolor también lo toca tu competencia, pero el posicionamiento es lo que hizo que te elija a vos. Un ejemplo real: el dolor era «falta de claridad con el contenido» y el posicionamiento desde el que se mostró la solución fue «damos entregables y uno a uno infinitos». CLIENTE DE CLIENTE 1 UN VIDEO DE YOUTUBE; DESPUÉS CONTESTÓ UNA HISTORIA FALTA DE CLARIDAD CON EL CONTENIDO EJEMPLO: «ENTREGABLES Y UNO A UNO INFINITOS» CLIENTE 2 REEL DE PROCESO POR DENTRO NO SABE QUÉ GRABAR EL MISMO: «UNO A UNO INFINITOS» CLIENTE 3 HISTORIA DE PRODUCTO POR DENTRO FALTA DE CLARIDAD CON EL CONTENIDO EJEMPLO: «ENTREGABLES Y UNO A UNO INFINITOS» … HASTA DIEZ O VEINTE LOS QUE PAGARON UPFRONT Y SIN OBJECIONES LAS DOS COSAS QUE QUÉ HISTORIA O PIEZA VINO DOLOR O TEMA POSICIONAMIENTO IMPORTAN EL DOLOR O TEMA EL POSICIONAMIENTO POR QUÉ VINO; PERO ESTE DOLOR TAMBIÉN LO TOCA DESDE DÓNDE MOSTRASTE LA SOLUCIÓN A ESE DOLOR: TU COMPETENCIA: NO TE DIFERENCIA ESO ES LO QUE TE HIZO ELEGIR A VOS EJEMPLO: «ENTREGABLES Y UNO A UNO INFINITOS» FIG. 03 — CON DIEZ O VEINTE FILAS DESCUBRÍS QUÉ ATRAE Y QUÉ CONVIERTE A TU CLIENTE IDEAL CÓMO LLENAR LA TABLA 01 Armá la tabla con cuatro columnas: cliente, de dónde vino, dolor o tema, posicionamiento. 02 Buscá el primer mensaje de cada uno: ahí está la pieza que lo atrajo. Después, qué historia contestó: ahí está la que lo convirtió. 03 En la columna de posicionamiento escribí la frase o idea exacta con la que mostraste la solución, no el tema. → Diez o veinte filas no se leen una por una: se buscan los patrones, lo que se repite. Eso se convierte en un solo documento, y es lo que sigue. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 01 LAS — QUÉ ATRAE Y QUÉ CONVIERTE ATV 2026 CONCLUSIONES UN SOLO DOCUMENTO Y TE CASÁS CON ÉL Todos los clientes te van a llevar a un solo camino: aparecen patrones. Alguno contestó algo que ningún otro contestó, pero lo importante es ir a lo general. De ahí sale un documento de conclusiones: de dónde vienen, con qué dolor, desde qué posicionamiento y qué pieza los convirtió. Ese documento es con el que se maneja tu creador: siempre saca el contenido de ahí. Se crea una sola vez y te casás con él. DOCUMENTO DE CONCLUSIONES PATRONES LO GENERAL DE DÓNDE VIENEN · QUÉ DOLOR QUÉ POSICIONAMIENTO · QUÉ PIEZA DIEZ O VEINTE CLIENTES ALGUNO CONTESTÓ ALGO QUE NADIE MÁS CONTESTÓ: NO IMPORTA; SE VA A LO GENERAL EL CREADOR SIEMPRE SACA EL CONTENIDO DE ACÁ UN DOCUMENTO BASE; CASATE CON ÉL SE CREA UNA SOLA VEZ; DESPUÉS NO SE REESCRIBE CADA SEMANA: SE CONTRASTA ACÁ DESCUBRÍS QUÉ ATRAE A TU LÍDER IDEAL Y QUÉ LO CONVIERTE FIG. 04 — DE LOS DATOS SUELTOS A UN SOLO DOCUMENTO DEL QUE SALE TODO EL CONTENIDO CÓMO ARMAR EL DOCUMENTO DE CONCLUSIONES 01 Marcá en la tabla lo que se repite en tres o más filas. Solo eso entra al documento. 02 Escribí el documento en una página: de dónde vienen, los tres dolores, los dos posicionamientos, las piezas que convierten. 03 Dáselo al creador con una sola instrucción: todo el contenido sale de acá. → El documento te dice qué atrae y qué convierte. Para saber qué falta, hay que cruzarlo con lo que ventas ve cada semana. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 01 EL — QUÉ ATRAE Y QUÉ CONVIERTE ATV 2026 CRUCE LAS CONCLUSIONES DICEN QUÉ ATRAE EL CRUCE DICE QUÉ FALTA En paralelo, cada semana cruzás el documento con los reportes de venta y hacés una sola pregunta: ¿cambió algo? Si vienen con los mismos dolores pero no cierran, faltan wins: la percepción del producto es baja y piden garantías. Si agendan rápido y no se presentan, falta nutrición. Si ya no entran ese tipo de leads, se cortó la pieza que los traía. Las conclusiones dicen qué atrae; el cruce dice qué falta para que convierta. CONCLUSIONES POR QUÉ COMPRAN LOS QUE COMPRAN ¿CAMBIÓ ALGO? REPORTES DE VENTA QUÉ DICE EL SETTER · QUÉ VE EL CLOSER LA PREGUNTA DE CADA SEMANA LO QUE TE DEVUELVE VIENEN CON LOS MISMOS DOLORES PERO NO CIERRAN FALTAN WINS: LA PERCEPCIÓN DEL PRODUCTO ES BAJA, PIDEN GARANTÍAS AGENDAN MUY RÁPIDO Y NO SE PRESENTAN FALTA NUTRICIÓN: NO HAY THANK YOU PAGE, NO VIERON EL VIDEO YA NO ENTRAN ESE TIPO DE LEADS CAMBIÓ EL ÁNGULO O SE CORTÓ LA PIEZA QUE LOS TRAÍA ENTRAN, PERO CON UNA OBJECIÓN NUEVA ESA OBJECIÓN VA AL CONTENIDO DE LA SEMANA LAS CONCLUSIONES DICEN QUÉ ATRAE; EL CRUCE DICE QUÉ FALTA PARA QUE CONVIERTA FIG. 05 — EL DOCUMENTO NO SE REESCRIBE: SE CONTRASTA CONTRA LO QUE VENTAS VE CADA SEMANA EJEMPLO Un ejemplo real: en un negocio, las ventas venían de gente que ya llegaba con la solución clara, porque había visto el video. Al crecer, los que agendaban venían por fuerza de seguimiento y sin nutrición: el show rate era bajo y el reagendamiento altísimo. El cruce mostró qué faltaba: una thank you page y el video antes de la llamada, cosas que ya estaban hechas pero no activadas. → Queda una advertencia para cerrar: lo que la data te dice no siempre coincide con tu gusto ni con cómo te gustaría presentar la oferta, y la data gana. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 01 EL — QUÉ DATO ATRAE Y QUÉ CONVIERTE ATV 2026 MANDA NO LE PELEES AL DATO NI AL PARA QUÉ Un ejemplo real: las historias de un creador estaban diseñadas de una forma que al que manejaba el negocio no le gustaba nada, pero la gente conectaba con eso y convertía. Entonces se quedan: no le pelees al dato. La misma data te dice cómo empaquetar la oferta. Otro ejemplo real, una mentoría para entrenadores online: la oferta decía «aprendé fisiología, entrenamiento y nutrición», y nadie quiere estudiar eso por sí mismo; lo que quieren es ganar más plata con sus asesorías. Lo que se estudia va adentro, como vehículo; el para qué es lo que se vende. NO LE PELEES AL DATO Y EL PARA QUÉ DE LA OFERTA (EJEMPLO: ENTRENADORES EJEMPLO REAL: LAS HISTORIAS DEL CREADOR ESTÁN DECÍA: «APRENDÉ FISIOLOGÍA, ENTRENAMIENTO Y NUTRICIÓN» DISEÑADAS DE UNA FORMA QUE A VOS NO TE GUSTA NADIE QUIERE ESTUDIAR ESO POR SÍ MISMO PERO LA GENTE CONECTA CON ESO Y CONVIERTE LO QUE QUIEREN: GANAR MÁS PLATA CON SUS ASESORÍAS FUNCIONA: SE QUEDA. EL DATO MANDA, EL PARA QUÉ VENDE; LO QUE SE ESTUDIA NO TU GUSTO VA ADENTRO, COMO VEHÍCULO ONLINE) EN ESE MISMO NEGOCIO, CON LA OFERTA REORGANIZADA, UN SOLO REEL HIZO 5K LA DATA QUE SACÁS DE TUS CLIENTES TAMBIÉN TE DICE CÓMO EMPAQUETAR LA OFERTA, NO SOLO QUÉ CONTENIDO HACER CON ESO CERRÁS EL CÍRCULO: QUÉ ATRAE, QUÉ CONVIERTE Y CÓMO SE PRESENTA LO QUE VENDÉS FIG. 06 — EL DATO DECIDE EL FORMATO Y EL PARA QUÉ DECIDE LA OFERTA CÓMO DEJAR QUE LA DATA DECIDA 01 Antes de cambiar un formato que convierte, pedile al dato permiso: si trae calificados, no se toca. 02 Releé tu oferta y preguntate «¿para qué quiere esto la persona?» hasta llegar a una respuesta simple. Esa respuesta es el titular. 03 Lo que la persona tiene que aprender o hacer se cuenta después, como parte del camino. → Pregunta, tabla, documento, cruce y dato: ya sabés qué atrae y qué convierte. Los próximos siete días lo instalan. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 01 — QUÉ SIETE ATRAE Y QUÉ CONVIERTE ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 TUS VEINTE DÍA 03 DOLOR Y POSIC. DÍA 02 DE DÓNDE DÍA 05 DOCUMENTO DÍA 04 PATRONES DÍA 07 EL PARA QUÉ LISTO DÍA 06 EL CRUCE DÍA 01 Elegí a tus veinte. Clientes de los últimos tres meses, primero los que pagaron upfront y sin objeciones. DÍA 02 Rastreá de dónde vino cada uno. Primer mensaje y última historia que contestó antes de agendar. DÍA 03 Anotá dolor y posicionamiento. Dos columnas distintas: por qué vino y desde dónde le mostraste la solución. DÍA 04 Buscá los patrones. Lo que se repite en tres o más filas. DÍA 05 Escribí el documento de conclusiones. Una página. Dáselo al creador: todo sale de acá. DÍA 06 Hacé el primer cruce. Documento contra el último reporte de ventas: ¿cambió algo? ¿qué falta? DÍA 07 Revisá el para qué de tu oferta. Un titular con lo que la persona quiere, no con lo que tiene que estudiar. Cómo sabés que funciona A las cuatro semanas el creador no te pregunta de qué hablar: lo saca del documento. Si todavía hay ruido, volvé al día 01: estás analizando toda la base en vez de a los que pagaron. AUMENTA TU VALOR 08","PLAYBOOK LA 01 — QUÉ ATRAE Y QUÉ CONVIERTE ATV 2026 SERIE ESTE ES EL PLAYBOOK 01 DE 03 Los tres salen de la misma clase: Entender las métricas para tener resultados. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo saber qué atrae y qué convierte a tu cliente ideal 01 Ingeniería inversa de tus veinte mejores clientes: de qué historias vinieron, qué dolor los trajo y desde qué posicionamiento compraron. Cómo arreglar una métrica baja con una sola acción por mes 02 Las métricas solo te dicen dónde estás; el crecimiento sale de resolver un problema grande por mes y de objetivos simples. Cómo convertir tu estrategia de marketing en tareas simples que se cumplen 03 Sos el traductor: del qué al cómo, un formulario para el setter, un calendario para el creador, un solo documento para todo. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s4-2":["PLAYBOOK 02 UNA ACCIÓN POR MES","PLAYBOOK ANTES 02 DE — DE LA MÉTRICA A LA ACCIÓN ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el segundo playbook de la serie: qué hacer con las métricas una vez que las tenés. Vas a leerlas como un mapa, elegir un problema grande por mes, encontrar la acción que vuelve inevitable el número, escribir objetivos simples para cada persona y repetir el ciclo. Al terminar, cada mes mueve un número y PLAYBOOK 03 · TAREAS TRADUCIR EL QUÉ EN UN C TO PO MÉ CA EL CL N AR CO ID AD sabés por qué. BÉ RU SA ID : O, DO CH S O PLAYBOOK 02 · DE LA MÉTRICA A LA ACC MU EL CH Y A R DA CE TA HA , É MU QU UN PROBLEMA GRANDE POR MES : EQ IÉ SI MB N TA MÉ TUS VEINTE MEJORES CLIENTES PO TO UI DO PLAYBOOK 01 · QUÉ ATRAE Y QUÉ CONVIERTE N HOY: TENÉS MÉTRICAS PERO NO PREDICTIBILIDAD FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 El mapa — dónde estás, no cómo llegás 02 Un problema por mes — no te casás con la proyección 03 La acción inevitable — buscá la acción, no la métrica 04 El objetivo simple — visible y lograble 05 El ciclo — un mes, un problema, una acción 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 02 EL — DE LA MÉTRICA A LA ACCIÓN ATV 2026 MAPA LA MÉTRICA TE DICE DÓNDE ESTÁS NO CÓMO LLEGÁS Sacás las métricas y está bien, seguí haciéndolo. Pero las métricas solo te dicen una cosa: estás aquí. Son el punto del mapa, no el camino. Estás en 30K porque tenés tal show rate, tantas agendas y tantas conversaciones; eso explica dónde estás, no cómo llegás a 100K. El mayor error es creer que alcanza con «conseguir más llamadas»: la pregunta es qué te lleva de un punto al otro y qué está fallando detrás. 100k ¿QUÉ TE LLEVA DE ACÁ A ACÁ? QUERÉS LLEGAR EL MAYOR ERROR: «SI CONSIGO MÁS LLAMADAS, YA ESTÁ» 75k NO: ¿QUÉ FALLA DETRÁS? ¿QUÉ TE LLEVA DE ACÁ A ACÁ? ¿QUÉ TE LLEVA DE ACÁ A ACÁ? 50k 30k ESTÁS AQUÍ LAS MÉTRICAS DE HOY SHOW RATE · AGENDAS · CONVERSACIONES EXPLICAN POR QUÉ ESTÁS EN 30K FIG. 02 — LA MÉTRICA ES EL «ESTÁS AQUÍ»; EL CRECIMIENTO ESTÁ EN EL VEHÍCULO ENTRE UN PUNTO Y EL OTRO CÓMO LEER EL MAPA 01 Dibujá el mapa: dónde estás, dónde querés llegar y dos o tres puntos intermedios. 02 En cada flecha escribí qué tendría que pasar para cruzarla, en acciones, no en números. 03 Si una flecha dice «más llamadas», no está terminada: ¿qué falla para que no haya más llamadas? → Si el camino son acciones, hay que elegir cuál va primero, y la regla es una sola: un problema grande por mes. Es lo que sigue. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 02 UN — DE LA MÉTRICA PROBLEMA POR A LA ACCIÓN ATV 2026 MES NO TE CASÁS CON LA PROYECCIÓN RESOLVÉS UN PROBLEMA POR MES Para escalar no te casás con una proyección de ventas, agendas y conversaciones: demasiadas cosas cambian. Lo que no cambia es que cada mes se resuelve un problema grande. Empieza el mes y preguntás dónde está el problema hoy. Un ejemplo real de tres meses seguidos: primero el proceso de setting, después la frecuencia del contenido, después el propio founder como cuello de botella, metido en cosas que no hacía falta que hiciera. Un solo problema puede estar trabando todo, y arreglar solo el proceso de setting puede llevarte de 150K a 300K sin tocar nada más. EJEMPLO REAL: TRES MESES, TRES PROBLEMAS, EN ORDEN MES 1 MES 2 MES 3 UN PROBLEMA UN PROBLEMA UN PROBLEMA PROCESO DE SETTING FRECUENCIA DE CONTENIDO SOS TU PROPIO CUELLO DE BOTELLA 7,7% → 15% DE AGENDA CUMPLIR EL CALENDARIO SOLTAR LO QUE NO HACE FALTA EL NÚMERO QUE SE MUEVE MÁS CONVERSACIONES TIEMPO PARA EL SIGUIENTE COMO EN EL GIMNASIO: CRECER ES CONSECUENCIA DE CUMPLIR MICROMISIONES; SI LAS CUMPLÍS, EL RESULTADO ES INEVITABLE UN SOLO PROBLEMA PUEDE ESTAR TRABANDO TODO: ARREGLAR SOLO EL SETTING PUEDE LLEVARTE DE 150K A 300K SIN TOCAR NADA MÁS LAS PROYECCIONES (TANTAS VENTAS, TANTAS AGENDAS, TANTAS CONVERSACIONES) ESTÁN BIEN, PERO NADIE SE CASA CON ELLAS DEMASIADAS COSAS CAMBIAN; LO QUE NO CAMBIA ES QUE CADA MES SE RESUELVE UN PROBLEMA FIG. 03 — EMPIEZA EL MES Y PREGUNTÁS: ¿DÓNDE ESTÁ EL PROBLEMA HOY? CÓMO ELEGIR EL PROBLEMA DEL MES 01 El primer día del mes, escribí en una línea cuál es el problema que más traba el negocio. Uno solo. 02 Dedicale el mes a ese problema; los demás esperan, aunque parezcan urgentes. 03 Al cierre, medí qué cambió y elegí el siguiente. Crecer es consecuencia de cumplir micromisiones. → Elegido el problema del mes, falta lo más importante: convertirlo en una acción concreta que haga el resultado inevitable, en vez de pedirle a alguien que mueva un número. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 02 LA — DE LA ACCIÓN MÉTRICA A LA ACCIÓN ATV 2026 INEVITABLE NO BUSQUES LA MÉTRICA BUSCÁ LA ACCIÓN QUE LA LOGRA Es fácil decirle al setter «pasá del 7,7% al 15% de agenda». Pero pasar de una estadística a otra es consecuencia de una acción, y la tarea del founder es pensar cuál. Un ejemplo real: la acción fue una reunión todos los viernes donde el setter presenta su laboratorio, es decir, los problemas que encontró en la semana y cómo los resolvió. Así se mejora solo, sin que vos pongas esfuerzo, y el siguiente setter lee todo lo que no hay que hacer. EJEMPLO REAL: EL OBJETIVO DEL SETTER DE UN MES EL OBJETIVO DE NEGOCIO ¿QUÉ ACCIÓN LO OBJETIVO DEL SETTER DEL 7,7% AL 15% DE AGENDA VUELVE INEVITABLE? PRESENTAR EL LABORATORIO CADA VIERNES LABORATORIO DE SETTING, CADA VIERNES PROMETER Y NO CUMPLIR PASO UNO, PASO DOS EL SETTER SE MEJORA SOLO: EXCESO DE INFORMACIÓN NO HAY QUE DECIR TANTO NO SE EMPATIZA PREGUNTAR ANTES DE PROPONER MARKETING NO EXPLICÓ EL CTA VENTAS NO SABE QUÉ DOLOR TOCA NI SI PONER FRICCIÓN LA AUTOMATIZACIÓN NO ESTABA LISTA EL RECURSO ANTES DEL CTA VOS NO PONÉS ESFUERZO Y EL SIGUIENTE SETTER LEE TODO LO QUE NO HAY QUE HACER PASAR DE UNA ESTADÍSTICA A OTRA ES CONSECUENCIA DE UNA ACCIÓN: BUSCÁ LA ACCIÓN, NO LA MÉTRICA PRIMERO LOS OBJETIVOS DEL NEGOCIO; DESPUÉS, UNO POR INTEGRANTE QUE LOS HAGA INEVITABLES FIG. 04 — EL OBJETIVO NO ES «MÁS AGENDAS»: ES LA REUNIÓN DE LOS VIERNES QUE LAS PRODUCE CÓMO VOLVER INEVITABLE UN NÚMERO 01 Primero los objetivos del negocio; después un objetivo por integrante que los haga inevitables. 02 Para cada objetivo preguntate: ¿qué acción semanal hace que esto pase solo? Esa acción es el objetivo de la persona. 03 Pedí que la acción deje un registro (un laboratorio, un formulario): así sirve para el que viene después. → Una acción inevitable tiene que caber en una línea que la persona pueda cumplir sola. Si el objetivo es complejo o depende de la suerte, el equipo se traba. Cómo simplificarlo es lo que sigue. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 02 EL — DE LA MÉTRICA OBJETIVO A LA ACCIÓN ATV 2026 SIMPLE SIMPLE, VISIBLE Y LOGRABLE «Generar mil leads con contenido» está fuera de tu control: subís un reel, no funciona y te desmotivás. «Cumplir el calendario sin fallar» está en tu control, es visible y es lograble. Y si necesitás más conversaciones, no cambiás el objetivo del creador: cambiás el calendario. Donde había un TOFU y dos MOFU, ponés cuatro MOFU con CTA al chat y redirigís el TOFU. Las dos mil conversaciones llegan como consecuencia. FUERA Y SI DE TU CONTROL EN TU CONTROL «GENERAR MIL LEADS CON CONTENIDO» «CUMPLIR EL CALENDARIO SIN FALLAR» SUBÍS UN REEL, NO FUNCIONA, TE DESMOTIVÁS SIMPLE, VISIBLE, LOGRABLE NECESITÁS MÁS CONVERSACIONES, CAMBIÁS ANTES EL CALENDARIO, NO EL OBJETIVO (EJEMPLO REAL) AHORA 1 TOFU 4 MOFU CON CTA AL CHAT 2 MOFU CON CTA 1 MOFU · 1 BOFU 1 BOFU SIN CTA EL TOFU REDIRIGE AL CHAT MISMA CONSIGNA PARA EL CREADOR, OTRA FRECUENCIA: DE MIL A DOS MIL CONVERSACIONES COMO CONSECUENCIA LO VALIOSO NO ES PASAR DE UNA MÉTRICA A OTRA: ES CÓMO LO PONÉS EN UN OBJETIVO SIMPLE QUE EL SETTER, EL CLOSER O EL CREADOR SE CONFUNDAN ES TU RESPONSABILIDAD FIG. 05 — EL BACKEND LO ENTENDÉS VOS; AL EQUIPO LE LLEGA UN OBJETIVO DE UNA LÍNEA CÓMO SIMPLIFICAR UN OBJETIVO 01 Reescribí cada objetivo del equipo hasta que quepa en una línea que la persona pueda cumplir sola. 02 Si el número que querés mover es de marketing, tocá la frecuencia o la mezcla del calendario, no la consigna. 03 Lo que vos entendés del backend queda con vos; al equipo le llega la línea. → Mapa, problema, acción y objetivo simple se repiten cada mes. El ciclo completo cierra el playbook. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 02 EL — DE LA MÉTRICA A LA ACCIÓN ATV 2026 CICLO UN MES UN PROBLEMA, UNA ACCIÓN El ciclo del mes es siempre el mismo: dónde está el problema, qué objetivo de negocio lo resuelve, qué acción lo vuelve inevitable, qué objetivo le toca a cada persona, y medir para volver a empezar. Las métricas se siguen sacando, pero ya no son el objetivo: son el mapa. La clave de todo es el vehículo con el que vas a llegar al punto siguiente. ¿DÓNDE ESTÁ EL PROBLEMA? MEDIR Y VOLVER OBJETIVO DE NEGOCIO UN MES UN PROBLEMA · UNA ACCIÓN UN OBJETIVO POR PERSONA LA ACCIÓN INEVITABLE LAS MÉTRICAS SE SIGUEN SACANDO; SOLO QUE YA NO SON EL OBJETIVO: SON EL MAPA AHÍ ESTÁ LA CLAVE DE TODO: CUÁL ES EL VEHÍCULO CON EL QUE VAS A LLEGAR A ESE PUNTO FIG. 06 — EL CICLO MENSUAL QUE CONVIERTE MÉTRICAS EN CRECIMIENTO EJEMPLO El mismo ejemplo real de las páginas anteriores, visto como ciclo: un mes el problema fue el setting; la acción fue la reunión de los viernes y el objetivo del setter, presentar el laboratorio. Al mes siguiente el problema fue la frecuencia de contenido: la acción fue cambiar el calendario y el objetivo del creador, cumplirlo sin fallar. → El ciclo está. Los próximos siete días lo arrancan con el primer problema del mes. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 02 — DE SIETE LA MÉTRICA A LA ACCIÓN ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 EL MAPA DÍA 03 EL PROBLEMA DÍA 02 LAS ACCIONES DÍA 05 ACCIÓN INEVITABLE DÍA 04 OBJETIVO DÍA 07 REVISIÓN LISTO DÍA 06 POR PERSONA DÍA 01 Dibujá el mapa. Dónde estás, dónde querés llegar y los puntos intermedios. DÍA 02 Escribí la acción de cada flecha. Qué tiene que pasar para cruzarla. Nada de «más llamadas». DÍA 03 Elegí el problema del mes. Uno solo, el que más traba. DÍA 04 Definí el objetivo de negocio. El número que ese problema resuelto va a mover. DÍA 05 Encontrá la acción inevitable. La reunión, el laboratorio o el formulario semanal que lo produce solo. DÍA 06 Escribí un objetivo por persona. Una línea, en su control, visible y lograble. DÍA 07 Fijá la revisión de fin de mes. Qué cambió y cuál es el siguiente problema. Cómo sabés que funciona Al cierre del mes un número se movió y sabés por qué acción. Si solo tenés métricas nuevas y ninguna acción cumplida, volvé al día 05: el objetivo todavía era una métrica. AUMENTA TU VALOR 08","PLAYBOOK LA 02 — DE LA MÉTRICA A LA ACCIÓN ATV 2026 SERIE ESTE ES EL PLAYBOOK 02 DE 03 Los tres salen de la misma clase: Entender las métricas para tener resultados. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo saber qué atrae y qué convierte a tu cliente ideal 01 Ingeniería inversa de tus veinte mejores clientes: de qué historias vinieron, qué dolor los trajo y desde qué posicionamiento compraron. Cómo arreglar una métrica baja con una sola acción por mes 02 Las métricas solo te dicen dónde estás; el crecimiento sale de resolver un problema grande por mes y de objetivos simples. Cómo convertir tu estrategia de marketing en tareas simples que se cumplen 03 Sos el traductor: del qué al cómo, un formulario para el setter, un calendario para el creador, un solo documento para todo. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s4-3":["PLAYBOOK 03 TAREAS SIMPLES","PLAYBOOK ANTES 03 DE — TAREAS SIMPLES ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el tercer playbook de la serie: cómo convertir lo que vos entendés en instrucciones que el equipo pueda cumplir. Vas a verte como traductor, armar el formulario del setter, darle al creador pilares y un objetivo de una línea, acompañar cada CTA con una ficha para ventas y guardar todo en un solo lugar. Al PLAYBOOK 03 · TAREAS TRADUCIR EL QUÉ EN UN C TO PO MÉ CA EL CL N AR CO ID AD terminar, el equipo no te pregunta cómo. BÉ RU SA ID : O, DO CH S O PLAYBOOK 02 · DE LA MÉTRICA A LA ACC MU EL CH Y A R DA CE TA HA , É MU QU UN PROBLEMA GRANDE POR MES : EQ IÉ SI MB N TA MÉ TUS VEINTE MEJORES CLIENTES PO TO UI DO PLAYBOOK 01 · QUÉ ATRAE Y QUÉ CONVIERTE N HOY: TENÉS MÉTRICAS PERO NO PREDICTIBILIDAD FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 El traductor — de tu idioma al de cada uno 02 El setter — un formulario diario 03 El creador — pilares, no corsé 04 El CTA — con ficha para ventas 05 Un solo lugar — antes de pedir claridad, dala 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 03 EL — TAREAS SIMPLES ATV 2026 TRADUCTOR LA DATA LLEGA EN CHINO AL EQUIPO LE LLEGA EN ESPAÑOL Un problema real de quien dirige el marketing de un negocio: explica mucho el qué y poco el cómo. Al creador le dice qué hay que hacer y, cuando el creador llega al cómo, tiene un cacao en la cabeza. Al setter le pide conclusiones y se le explota el cerebro. Tu habilidad como director no es sacar conclusiones: es traducirlas. La data te llega en chino; al equipo le tiene que llegar en español. Y antes de traducir para otro, simplificate a vos: si vos no tenés claridad, no podés darla. LA DATA VOS EL EQUIPO EN CHINO EL TRADUCTOR EN ESPAÑOL MIROS, CONCLUSIONES, UNA LÍNEA, UN FORMULARIO, REPORTES, MÉTRICAS UN CALENDARIO TU HABILIDAD COMO DIRECTOR NO ES SACAR CONCLUSIONES: ES TRADUCIRLAS VOS ENTENDÉS EL BACKEND; ESO SE QUEDA CON VOS Y ANTES DE TRADUCIR PARA OTRO, SIMPLIFICATE A VOS: SI VOS NO TENÉS CLARIDAD, NO PODÉS DARLA FIG. 02 — TRADUCIR DE TU IDIOMA AL DE CADA PERSONA; TU MIRO NO ES SU MIRO CÓMO 01 EMPEZAR A TRADUCIR Agarrá la última instrucción que le diste a alguien del equipo y preguntate: ¿se puede cumplir sin preguntarme nada? Si no, no está traducida. 02 Primero ordenate vos: tu Miro, tus conclusiones, tu prioridad. Eso no se lo mostrás a nadie. 03 Después, para cada persona, una sola cosa en su idioma. → La traducción tiene una forma concreta para cada rol del equipo. Empecemos por el setter, donde la traducción es un formulario de tres preguntas. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 03 EL — TAREAS SIMPLES ATV 2026 SETTER UNA CONSIGNA UN FORMULARIO DIARIO «Sacá conclusiones diarias y dale ideas a marketing» es un quilombo: ¿cuántas ideas, qué conclusiones, a qué te referís? «Completá este formulario todos los días» es una línea. Y el formulario lleva adentro lo que vos necesitás: cómo sentiste el setting hoy (te saca conclusiones), con qué objeciones llegaron (te da ideas de marketing), cuál fue el problema principal con el que llegaron (te dice cómo viene el marketing). CÓMO LO DECÍAS CÓMO «SACÁ CONCLUSIONES DIARIAS Y DALE IDEAS A MARKETING» ¿CUÁNTAS IDEAS? ¿QUÉ CONCLUSIONES? ¿A QUÉ TE REFERÍS? UN QUILOMBO LO QUE HAY ADENTRO DEL LO DECÍS «COMPLETÁ ESTE FORMULARIO TODOS LOS DÍAS» NADA MÁS; EL RESTO LO RESOLVÉS VOS FORMULARIO 1 ¿CÓMO SENTISTE EL SETTING HOY? TE ESTÁ SACANDO CONCLUSIONES 2 ¿CON QUÉ OBJECIONES LLEGARON LOS LEADS? TE ESTÁ DANDO IDEAS DE MARKETING 3 ¿CUÁL SENTÍS QUE FUE EL PROBLEMA PRINCIPAL CON EL QUE LLEGARON? TE ESTÁ DICIENDO CÓMO VIENE EL MARKETING ÉL RESPONDE TRES PREGUNTAS; VOS RECIBÍS CONCLUSIONES, IDEAS Y DIAGNÓSTICO LO MISMO VALE PARA EL CLOSER: EN VEZ DE CHATS, LLAMADAS FIG. 03 — LA PREGUNTA SIMPLE LLEVA ADENTRO LO QUE VOS NECESITÁS SABER CÓMO 01 ARMAR EL FORMULARIO Armá el formulario con tres o cuatro preguntas simples. Cada pregunta responde a algo que vos querés saber, pero no lo decís. 02 La consigna es una: completarlo todos los días. Nada de «y además fijate…». 03 Hacé la versión del closer cambiando chats por llamadas. → El setter ya tiene su formulario. Al creador le toca otra traducción, porque su problema es distinto: no le falta información, le falta el cómo. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 03 EL — TAREAS SIMPLES ATV 2026 CREADOR PILARES Y ESTRUCTURA PERO NO ENCORSETADO Al creador no le sirve ni el 100% de estructura, porque se siente encorsetado, ni el 100% de libertad, porque el contenido sale mal. Le sirven pilares y una estructura con margen. Lo que más le faltaba era el cómo: el avatar con nombre y apellido, tres dolores y su situación de partida; un dolor por secuencia; el CTA y la estructura de cada historia. Y un objetivo de una línea: este mes no es abrir conversaciones, es cumplir el calendario. EL EQUILIBRIO 100% ESTRUCTURA PILARES + ESTRUCTURA 100% LIBRE SE SIENTE ENCORSETADO CLARIDAD Y MARGEN EL CONTENIDO SALE MAL DEL QUÉ AL CÓMO EL QUÉ: «HAY QUE HABLAR DE ESTE DOLOR» EL CÓMO: CONCRETO Y BAJADO A TIERRA MUCHA INFO Y UN CACAO EN LA CABEZA: · EL AVATAR CON NOMBRE, TRES DOLORES Y SU SITUACIÓN «YO NO SÉ HACER ESTO» · UN DOLOR POR SECUENCIA · EL CTA Y LA ESTRUCTURA DE LA HISTORIA Y EL OBJETIVO DE UNA LÍNEA «ESTE MES TU OBJETIVO NO ES ABRIR CONVERSACIONES: ES CUMPLIR EL CALENDARIO DE CONTENIDO» SÚPER SIMPLE, SÚPER VISIBLE, SÚPER LOGRABLE; VOS LUCHÁS PARA QUE ESE OBJETIVO SE CUMPLA LA FRECUENCIA Y LA MEZCLA LAS TOCÁS VOS (PLAYBOOK 02); EL CREADOR SOLO CUMPLE FIG. 04 — CLARIDAD PARA EL CREADOR: UNA PERSONA, UN DOLOR, UNA FORMA DE CREAR, UN OBJETIVO CÓMO DARLE CLARIDAD AL CREADOR 01 Escribí el avatar en cinco líneas: nombre inventado, situación, tres dolores. Dáselo al creador. 02 Para cada secuencia de la semana, un solo dolor y la estructura de la historia. Él decide cómo contarla. 03 El objetivo del mes cabe en una línea y está en su control. Lo demás es tuyo. → Setter y creador ya tienen su traducción. Falta una que casi nadie hace: la que va de marketing a ventas cada vez que sale un CTA, porque ahí también se pierde claridad. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 03 EL — TAREAS SIMPLES ATV 2026 CTA CADA CTA SALE CON UNA FICHA PARA VENTAS Un error que se repite: marketing crea un CTA y no le dice a ventas cómo sacarle provecho. El setter no sabe si poner fricción, qué dolor está tocando ni si el recurso está listo, y termina improvisando la conversación. Cada CTA sale con una ficha de cuatro líneas: qué dolor toca, cuánta fricción, qué recurso (y si la automatización está lista) y cuál es el objetivo. EL ERROR: EL CTA SALE Y VENTAS NO SABE QUÉ HACER CON ÉL MARKETING VENTAS CREA EL CTA RECIBE LOS CHATS ¿PONER FRICCIÓN? ¿QUÉ DOLOR TOCA? ¿EL RECURSO ESTÁ LISTO? LA FICHA QUE ACOMPAÑA A CADA CTA QUÉ DOLOR TOCA PARA QUE EL SETTER SEPA DESDE DÓNDE ARRANCA LA CONVERSACIÓN CUÁNTA FRICCIÓN SI CALIFICA FUERTE O DEJA PASAR QUÉ RECURSO Y SI ESTÁ LISTO LA AUTOMATIZACIÓN ANTES DE PUBLICAR CUÁL ES EL OBJETIVO NUTRIR, ABRIR CHATS O AGENDAR UN CTA SIN FICHA ES UNA CONVERSACIÓN QUE EL SETTER IMPROVISA; CON FICHA, ES UNA ESTRATEGIA DE SETTING FIG. 05 — LA CLARIDAD TAMBIÉN CRUZA DE MARKETING A VENTAS CÓMO CONECTAR MARKETING CON VENTAS 01 Antes de publicar un CTA, completá la ficha y pasásela al setter. 02 Si el recurso o la automatización no están listos, el CTA no sale. 03 Después de la semana, el formulario del setter te dice si la ficha sirvió: qué objeciones llegaron y con qué problema. → Formulario, pilares, ficha: cada rol tiene su traducción. Queda guardar todo en un solo lugar, para vos y para el que venga. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 03 UN — TAREAS SOLO SIMPLES ATV 2026 LUGAR ANTES DE PEDIR CLARIDAD DALA Todo lo que cambia en el negocio va a un solo lugar: un Miro con marketing, ventas y producto, donde cada cambio se documenta como «este era el proceso antes, este es el de ahora». Sirve para vos, para el setter que entra mañana y para quien te ayuda de afuera: ya tiene el contexto y no tiene que preguntarte por qué la gente te escribe al DM. Y los cuellos de botella aparecen solos cuando el negocio está documentado. EL VOS MIRO DEL NEGOCIO MARKETING VENTAS PRODUCTO CONCLUSIONES PROCESO DE SETTING ONBOARDING CALENDARIO FORMULARIO DIARIO ROADMAP FICHAS DE CTA LABORATORIO OBJECIONES EL SETTER QUIEN ENTRA MAÑANA QUIEN TE AYUDA DE AFUERA CADA CAMBIO: «ESTE ERA EL PROCESO ANTES, ESTE ES EL DE AHORA» MÉTRICAS, PROCESOS, TODO ALMACENADO ACÁ CUANDO LE PEDÍS AYUDA A ALGUIEN, YA TIENE EL CONTEXTO: NO TIENE QUE PREGUNTARTE POR QUÉ LA GENTE TE ESCRIBE AL DM LOS CUELLOS DE BOTELLA APARECEN SOLOS CUANDO EL NEGOCIO ESTÁ DOCUMENTADO EN UN SOLO LUGAR FIG. 06 — UN SOLO LUGAR PARA TODO: ANTES DE PEDIR CLARIDAD, DALA CÓMO 01 TENER TODO EN UN SOLO LUGAR Abrí un solo tablero con tres columnas: marketing, ventas, producto. Pegá ahí las conclusiones, el calendario, los formularios y el proceso de setting. 02 Cada vez que cambies algo, no lo reemplaces: dejá el antes y el ahora. 03 Cuando pidas ayuda, mandá el tablero antes que la pregunta. → Traductor, formulario, pilares, ficha y tablero: la claridad está instalada. Los próximos siete días la ponen en marcha. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 03 — TAREAS SIETE SIMPLES ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 VOS PRIMERO DÍA 03 EL AVATAR DÍA 02 FORMULARIO DÍA 05 LA FICHA DÍA 04 UNA LÍNEA DÍA 07 EL VIERNES LISTO DÍA 06 EL TABLERO DÍA 01 Ordenate vos. Tu prioridad del mes en una línea. Si no la tenés, no traduzcas nada todavía. DÍA 02 Armá el formulario del setter. Tres o cuatro preguntas simples con tus preguntas escondidas adentro. DÍA 03 Escribí el avatar para el creador. Nombre, situación, tres dolores. Cinco líneas. DÍA 04 Dale al creador su objetivo de una línea. Cumplir el calendario. La frecuencia la definís vos. DÍA 05 Hacé la ficha del próximo CTA. Dolor, fricción, recurso listo, objetivo. Pasásela a ventas. DÍA 06 Abrí el tablero único. Marketing, ventas, producto. Pegá lo que ya existe. DÍA 07 Revisá el formulario del viernes. Qué objeciones y qué problema llegaron. Eso es la idea de la semana que viene. Cómo sabés que funciona A las cuatro semanas nadie del equipo te pregunta «¿y cómo hago esto?». Si siguen preguntando, volvé al día 01: la instrucción todavía está en chino. AUMENTA TU VALOR 08","PLAYBOOK LA 03 — TAREAS SIMPLES ATV 2026 SERIE ESTE ES EL PLAYBOOK 03 DE 03 Los tres salen de la misma clase: Entender las métricas para tener resultados. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo saber qué atrae y qué convierte a tu cliente ideal 01 Ingeniería inversa de tus veinte mejores clientes: de qué historias vinieron, qué dolor los trajo y desde qué posicionamiento compraron. Cómo arreglar una métrica baja con una sola acción por mes 02 Las métricas solo te dicen dónde estás; el crecimiento sale de resolver un problema grande por mes y de objetivos simples. Cómo convertir tu estrategia de marketing en tareas simples que se cumplen 03 Sos el traductor: del qué al cómo, un formulario para el setter, un calendario para el creador, un solo documento para todo. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s5-1":["PLAYBOOK 01 DE LA LLAMADA AL REEL","PLAYBOOK ANTES 01 DE — DE LA LLAMADA AL REEL ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el primer playbook de la serie: cómo aprovechar que tus mejores ideas salen cuando explicás algo en una llamada. Vas a ver por qué se pierden al cortar, el sistema de captura con cámara y libreta, cómo pensar el hook en vivo, cómo hablar en el contenido igual que en la llamada y qué hacer con los reels viejos de valor. Al terminar, cada bloque de llamadas deja un reel grabado. CO N LAS BASES QUE ALIMENTAN : NI DO CA TO LI MÉ DA D EL PLAYBOOK 03 · EL VID OM QUE LO VEA MUCHA GENTE CO ZO O SI ID N EN HO NT OK CO PLAYBOOK 02 · ENGAÑAR AL ALGORITMO N DE TU E RE QU CO RT Z, ES VO DO : LO MÉ OS SI CH N MU CAPTURAR EL FLOW STATE N TO VE PLAYBOOK 01 · DE LA LLAMADA AL REEL Y VE HOY: TUS MEJORES IDEAS SE PIERDEN AL CORTAR LA LLAMADA ND E FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 El flow state — las ideas salen y se pierden 02 La captura — cámara, libreta, grabar al cortar 03 El hook en vivo — pensá el hook primero 04 La voz — que llegue a su propia conclusión 05 Rehacer — el valor ya lo tenías 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 01 EL — DE FLOW LA LLAMADA AL REEL ATV 2026 STATE TUS MEJORES IDEAS SALEN EN LLAMADAS Y SE PIERDEN AL CORTAR Cuando explicás algo en una llamada entrás en flow state y ahí salen tus mejores ideas: terminás diciendo «¿de dónde salió esto?». El problema es que el cerebro guarda ese conocimiento en el subconsciente y lo olvida hasta que alguien te lo vuelve a preguntar. Pasás a la siguiente reunión, y cuando te sentás a crear contenido en frío, la idea ya no está. La ventana para capturarla es corta: apenas cortás. CLARIDAD DE LA IDEA FLOW STATE: EXPLICÁS ALGO Y DECÍS «¿DE DÓNDE SALIÓ ESTO?» LA VENTANA: APENAS CORTÁS ACÁ SE GRABA O SE ANOTA PASÁS A LA SIGUIENTE REUNIÓN Y LA IDEA VOLVIÓ AL SUBCONSCIENTE TIEMPO LA LLAMADA RESOLVÉS COSAS DIFÍCILES RÁPIDO Y BAJO PRESIÓN: EL CEREBRO GUARDA EL CONOCIMIENTO Y LO OLVIDA HASTA QUE ALGUIEN TE LO PREGUNTA SI TE SENTÁS A CREAR EL CONTENIDO EN FRÍO, NO ESTÁ; SI GRABÁS CUANDO ACABA DE SALIR, ESTÁ ENTERO FIG. 02 — LA IDEA EXISTE UN RATO DESPUÉS DE LA LLAMADA; DESPUÉS HAY QUE IR A BUSCARLA CÓMO 01 ENCONTRAR TU VENTANA Identificá en qué llamadas entrás en flow state: las de uno a uno con tu equipo y las de clientes, donde te hacen preguntas. 02 Marcá en la agenda diez minutos libres después de esas llamadas. Ese tiempo es para capturar, no para la siguiente reunión. 03 Si no podés grabar en ese momento, anotá la idea completa como si fuera el guion: en dos horas no la vas a reconstruir. → Para que la ventana no se pierda hace falta un sistema de captura. Es simple y tiene tres piezas: una cámara, una libreta y una regla. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 01 LA — DE LA LLAMADA AL REEL ATV 2026 CAPTURA CÁMARA, LIBRETA Y GRABAR AL CORTAR El sistema tiene tres piezas. Una cámara apuntándote durante las reuniones, grabando con OBS: después se parte la pantalla y se corta. Una libreta entre llamadas: si de cuatro seguidas salieron ideas en la primera y la segunda, se anotan con el reel imaginado y, al terminar la cuarta, te grabás. Y una regla: no se sube el recorte del Zoom. El recorte saca la idea; después se baja a tierra y se graba bien. LLAMADA 1 LLAMADA 2 LLAMADA 3 LLAMADA 4 BUENA IDEA BUENA IDEA NADA NADA ME GRABO LA LIBRETA PROBLEMA, RESPUESTA Y EL REEL IMAGINADO LA CÁMARA EN LAS LLAMADAS LO QUE NO SE HACE UNA CÁMARA EN FULL HD APUNTÁNDOTE DURANTE LAS REUNIONES RECORTAR EL ZOOM O EL FATHOM Y SUBIRLO SE GRABA CON OBS; DESPUÉS SE PARTE LA PANTALLA AL MEDIO SIN HOOK, SIN PENSAR, SIN CALIDAD: ERA POR SUBIR Y SABIENDO QUE TE GRABAN, LOS HOOKS SALEN A PROPÓSITO EL RESTO ES EJECUCIÓN EL RECORTE SACA LA IDEA; DESPUÉS SE BAJA A TIERRA Y SE GRABA BIEN CUATRO LLAMADAS SEGUIDAS: DE LA PRIMERA Y LA SEGUNDA SALIERON IDEAS; SE ANOTAN, TERMINA LA CUARTA, TE GRABÁS NO TE LA COMPLIQUES: EL MISMO QUE SOS EN LA LLAMADA ES EL QUE TENÉS QUE SER EN EL CONTENIDO FIG. 03 — EL SISTEMA DE CAPTURA: LA IDEA NO SE PIERDE Y NO SE SUBE UN RECORTE EJEMPLO Un ejemplo real: una persona grababa un Loom para un cliente y sabía que la cámara la estaba filmando. Dijo el hook a propósito («la única razón por la que te contestan poco es que pensás en recibir antes que dar»), se quedó callada un segundo y lo desarrolló. Ese reel salió de una reunión de trabajo, sin sentarse a crear. CÓMO ARMAR EL SISTEMA DE CAPTURA 01 Poné una cámara fija en tu lugar de reuniones y grabá las llamadas en las que explicás cosas. 02 Tené la libreta abierta: problema, tu respuesta y cómo te imaginás el reel. Tres líneas. 03 Al terminar el bloque de llamadas, grabate. Sin guion supremo: el mismo que sos en la llamada. → Grabar apenas cortás resuelve que la idea no se pierda. Lo que define si la ven es cómo arranca el reel, el hook, y eso también se practica en vivo, en la misma llamada. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 01 EL — DE LA LLAMADA HOOK EN VIVO AL REEL ATV 2026 PENSÁ EL HOOK PRIMERO DESPUÉS DESARROLLÁ Un ejemplo real de cómo la misma idea puede arrancar de dos formas. «Me di cuenta de que mi error más grande fue no subir contenido» la gente lo saltea. «Acabo de tener una llamada con alguien al que le pagué más de 45.000 dólares» retiene a todo el mundo: ¿qué tan crack hay que ser para eso? Y cuando revelás que te dijo algo muy simple, el cerebro hace crack. El hook se piensa primero, en vivo, y después se desarrolla. LA MISMA IDEA, DOS ARRANQUES (EJEMPLO REAL) «ME DI CUENTA DE QUE MI ERROR MÁS GRANDE «ACABO DE TENER UNA LLAMADA CON ALGUIEN FUE NO SUBIR CONTENIDO» AL QUE LE PAGUÉ MÁS DE 45.000 DÓLARES…» LA GENTE LO SALTEA ¿QUÉ TAN CRACK HAY QUE SER? TODOS SE QUEDAN Y LO QUE DIJO FUE ALGO MUY SIMPLE: «SUBÍ MÁS CONTENIDO»; EL CEREBRO HACE CRACK: «¿ESO? TE LO PODRÍA HABER DICHO YO» CÓMO SE HACE EN VIVO 1 SABÉS QUE TE GRABAN 2 DECÍS EL HOOK PRIMERO 3 TE QUEDÁS CALLADO UN SEGUNDO 4 UN MARCO MENTAL, UNA FRASE O QUE VAS A GRABAR AL CORTAR «LA ÚNICA RAZÓN POR LA QUE TE CONTESTAN POCO ES QUE PENSÁS EN RECIBIR ANTES QUE DAR» EL HOOK YA ESTÁ; AHORA LO DESARROLLÁS «SI TE PUDIERA DAR UN SOLO MARCO PARA ESTO, ES…» LOS QUE PARECEN CRACKS DEL CONTENIDO LO TRABAJARON COMO EN EL GIMNASIO: AL PRINCIPIO CUESTA, DESPUÉS SALE SOLO FIG. 04 — PENSÁ EL HOOK, DESPUÉS DESARROLLÁ; CON PRÁCTICA LO HACÉS SIN DARTE CUENTA CÓMO PENSAR EL HOOK EN VIVO 01 Antes de desarrollar una idea en una llamada, decí en una frase lo más llamativo que tiene. Ese es el hook. 02 Si te graban, hacelo a propósito: hook, silencio de un segundo, desarrollo. 03 Si al principio te cuesta, es normal: es práctica, como el gimnasio. Los que parecen cracks lo trabajaron. → El hook abre; el cuerpo del reel convence. Y convence igual que en una llamada: sin que vos trates de convencer a nadie. Es lo que sigue. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 01 LA — DE LA LLAMADA AL REEL ATV 2026 VOZ QUE LA PERSONA LLEGUE A SU PROPIA CONCLUSIÓN Un ejemplo real de una llamada: un closer que quiere ser el mejor, pero no completa los reportes. No lo convencés: le contás que en tu mejor mes como closer hiciste 20K y que no fue por vender más ni por madrugar, fue por darle datos a marketing con los reportes. Y le preguntás si quiere depender de los leads que le llegan o tener buenos leads. Él se convence de su propia idea; vos solo comunicaste. El contenido es exactamente lo mismo: no es problema-solución, es hacer que la persona se vea reflejada y llegue sola a la conclusión. Es lo que hacés en una llamada, explicado como se lo explicarías a alguien que no es del rubro. EN LA LLAMADA (EJEMPLO REAL) 1 UN CLOSER QUIERE SER EL MEJOR 2 «YO COMO CLOSER HICE 20K EN MI MEJOR MES» 3 «NO FUE VENDER MÁS NI MADRUGAR: 4 «¿QUERÉS DEPENDER DE LOS LEADS QUE TE LLEGAN 5 ÉL SE CONVENCE DE SU PROPIA IDEA PERO NO COMPLETA LOS REPORTES EN EL CONTENIDO NO ES PROBLEMA → SOLUCIÓN ES EXACTAMENTE LO MISMO QUE HACÉS EN LA LLAMADA: LA PERSONA SE VE REFLEJADA Y LLEGA SOLA A LA CONCLUSIÓN AUTORIDAD COMO SE LO EXPLICARÍAS A ALGUIEN DE AFUERA DEL RUBRO: SIN TECNICISMOS, CON LA MISMA VOZ, SIN GUION FUE DARLE DATOS A MARKETING CON REPORTES» O QUERÉS BUENOS LEADS?» AHÍ SALE AUTÉNTICO, Y LA AUTENTICIDAD ES UN SKILL CADA VEZ MÁS IMPORTANTE VOS SOLO COMUNICASTE HOOK · BODY · CTA SIRVE COMO MAPA, PERO EL BODY NO SE PIENSA: SE HABLA COMO A LA PERSONA QUE TENÉS ENFRENTE EL QUE PROCRASTINA ESPERANDO EL FRAMEWORK MÁGICO NO PLANTA EL ROBLE; EL QUE GRABA HOY, EN CUATRO MESES ES OTRO FIG. 05 — EL MEJOR MOMENTO PARA PLANTAR EL ROBLE ERA HACE VEINTE AÑOS; EL SEGUNDO ES HOY CÓMO 01 HABLAR EN EL CONTENIDO Cuando escribas o grabes, no pienses «problema y solución»: pensá en la persona con la que lo hablaste y repetí lo que le dijiste. 02 Sacá los tecnicismos hasta que lo entienda alguien de afuera; ahí sale auténtico. 03 No esperes el framework perfecto: grabá hoy. En cuatro meses de práctica tu cerebro ya sabe cómo funciona el contenido. → Con la voz y el hook resueltos, hay un atajo para no arrancar de cero: los reels de valor que ya grabaste y que quedaron mal por el formato. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 01 — DE LA LLAMADA AL REEL ATV 2026 REHACER EL VALOR YA LO TENÍAS FALTABA EL FORMATO Tenés reels viejos con mucho valor y mal formato: recortes, sin hook, sin cámara. Con el frame nuevo los vas a mirar y vas a decir «qué hook le hubiese puesto». Esos se rehacen. Un ejemplo real: un reel usaba la analogía de fichar a la estrella de un equipo de fútbol para hablar de contratar closers, y arrancaba con «si buscás a la estrella de los closers, va a destruir tu equipo». Mencionaba closers en el hook y eso filtraba a casi todos. Rehecho, arranca con «la estrella va a destruir todos los equipos posibles», que lo entiende cualquiera, y recién después llega a los closers. Hacé mitad y mitad: ideas nuevas de las llamadas y reels viejos rehechos. REEL VIEJO CON EL FRAME NUEVO REHECHO MUCHO VALOR, MAL FORMATO: RECORTE, SIN HOOK «UH, QUÉ HOOK LE HUBIESE PUESTO» MISMO VALOR, HOOK ABIERTO, CÁMARA, GRABADO BIEN EJEMPLO REAL: UN REEL CON LA ANALOGÍA DE FICHAR A LA ESTRELLA DEL FÚTBOL DECÍA «LA ESTRELLA DE LOS CLOSERS VA A DESTRUIR TU EQUIPO» MENCIONABA CLOSERS EN EL HOOK Y FILTRABA; REHECHO ARRANCA CON «LA ESTRELLA VA A DESTRUIR TODOS LOS EQUIPOS» Y RECIÉN DESPUÉS, CLOSERS MITAD Y MITAD: IDEAS NUEVAS DE LAS LLAMADAS Y REELS VIEJOS REHECHOS; VAS VIENDO DÓNDE TE SENTÍS MEJOR SI VAS ALL-IN, UNA BUENA CÁMARA CON GRAN ANGULAR PARA GRABARTE CERCA: LA CALIDAD SE NOTA Y COMPITE TU REEL ESTÁ COMPITIENDO TODO EL TIEMPO CON OTROS: SI EL TUYO ES UN RECORTE, NO LE GANA A NADIE FIG. 06 — EL VALOR YA LO TENÍAS; LO QUE FALTABA ERA EL FORMATO CÓMO REHACER LO QUE YA TENÍAS 01 Revisá tus reels de los últimos seis meses y marcá los que tienen valor y mal formato. 02 Para cada uno, escribí el hook nuevo y grabalo con cámara, no con recorte. 03 Si vas all-in, invertí en una buena cámara con gran angular: la calidad se nota, y tu reel compite con otros todo el tiempo. → Flow state, captura, hook, voz y rehacer: el método está completo. Los próximos siete días lo ponen en marcha. AUMENTA TU VALOR 07","PLAYBOOK ( 06 ) 01 — DE SIETE LA LLAMADA AL REEL ATV 2026 DÍAS LA INSTALACIÓN Una hora por día durante una semana. Cada día se apoya en el anterior, así que conviene seguir el orden. CADA DÍA SE APOYA EN EL ANTERIOR: EL ARCO CRECE DÍA 01 TUS LLAMADAS DÍA 03 LA LIBRETA DÍA 02 LA CÁMARA DÍA 01 DÍA 05 TRES VIEJOS DÍA 04 PRIMER REEL DÍA 07 CERRAR LISTO DÍA 06 REHACER UNO Marcá tus llamadas de flow state. Las de uno a uno y las de clientes donde explicás. Diez minutos libres después de cada bloque. DÍA 02 Instalá la cámara. Fija, en full HD, apuntándote en las reuniones. Grabación con OBS. DÍA 03 Abrí la libreta. Problema, respuesta, reel imaginado. Tres líneas por idea. DÍA 04 Grabá el primer reel al cortar. Con el hook primero y la misma voz de la llamada. Sin recorte. DÍA 05 Elegí tres reels viejos para rehacer. Los de más valor y peor formato. Escribí el hook nuevo de cada uno. DÍA 06 Grabá uno rehecho. Con cámara. Compará con el original. DÍA 07 Cerrá la semana. Cuántas ideas capturaste y cuántas grabaste. La diferencia es lo que se perdió al cortar. Cómo sabés que funciona A las cuatro semanas cada bloque de llamadas deja uno o dos reels grabados, y ninguno es un recorte. Si capturás ideas y no las grabás, volvé al día 04: estás esperando el guion perfecto. AUMENTA TU VALOR 08","PLAYBOOK LA 01 — DE LA LLAMADA AL REEL ATV 2026 SERIE ESTE ES EL PLAYBOOK 01 DE 03 Los tres salen de la misma clase: Cómo crear contenido. Cada uno resuelve un problema distinto, en orden. No repiten información entre sí: si algo no está acá, está en el que le corresponde. Cómo convertir lo que explicás en llamadas en contenido grabado 01 El flow state: capturar tus mejores respuestas, pensar el hook en vivo y grabar apenas cortás, con la misma voz que usás en la llamada. Cómo hacer que un reel de nicho lo vea mucha gente 02 Engañar al algoritmo: hook abierto, mostrar cosas, revelar tarde y camuflar el caso de éxito en valor. Cómo explicar tu mecanismo en un video de YouTube y ponerle una promesa que venda 03 El mecanismo explicado sin nombrarlo, los fijados, las destacadas y por qué las bases se renuevan cada tres a seis meses. SI QUERÉS LOS OTROS DOS Escribime \"PLAYBOOK\" por DM a @juanxcarrizo y te paso el que sigue. JUAN CARRIZO AUMENTA TU VALOR — 2026"],"s5-2":["PLAYBOOK 02 REEL DE NICHO, MUCHA GENTE","PLAYBOOK ANTES 02 DE — ENGAÑAR AL ALGORITMO ATV 2026 EMPEZAR QUÉ VAS A INSTALAR CON ESTE PLAYBOOK Este es el segundo playbook de la serie: por qué los reels hechos para tu ICP se estancan y cómo hacer que los vea todo el mundo sin cambiar de tema. Vas a ver cómo compite un reel, el hook abierto, un ejemplo de tema aburrido en 220.000 views, cómo hacer que guarden y camuflar el caso de éxito, y cómo se lee tu perfil entero. Al terminar, tus reels de nicho pasan las mil views y traen gente calificada. CO N LAS BASES QUE ALIMENTAN : NI DO CA TO LI MÉ DA D EL PLAYBOOK 03 · EL VID OM QUE LO VEA MUCHA GENTE CO ZO O SI ID N EN HO NT OK CO PLAYBOOK 02 · ENGAÑAR AL ALGORITMO N DE TU E RE QU CO RT Z, ES VO DO : LO MÉ OS SI CH N MU CAPTURAR EL FLOW STATE N TO VE PLAYBOOK 01 · DE LA LLAMADA AL REEL Y VE HOY: TUS MEJORES IDEAS SE PIERDEN AL CORTAR LA LLAMADA ND E FIG. 01 — LA SERIE COMO UN SISTEMA: TRES PLANOS, ESTE PLAYBOOK ES UNO DE ELLOS ÍNDICE 01 La competencia — tu reel vs todo lo demás 02 El hook abierto — que lo vea cualquiera y se quede 03 El ejemplo — un tema aburrido en 220.000 views 04 Mostrar y camuflar — capturas y el caso al final 05 El perfil — variedad de intención 06 Siete días — la instalación AUMENTA TU VALOR 02","PLAYBOOK ( 01 ) 02 LA — ENGAÑAR AL ALGORITMO ATV 2026 COMPETENCIA TU REEL NO COMPITE CON TU NICHO COMPITE CON TODO LO DEMÁS Cuando subís un reel, Instagram lo pone a competir con otros dos y se lo muestra a cien personas. Si tu reel está hecho alrededor de tu ICP, tres de esas cien son tu ICP: lo ven hasta el final, comentan y guardan. Las otras noventa y siete dicen «qué video aburrido» y se van, y el reel se estanca en 900 views. Instagram se creó para entretener; la gente entra a ver gatos y peleas, no a estudiar. Crear alrededor de tu ICP está bien para que te vea tu ICP, pero para que te vea, primero lo tiene que ver todo el mundo: es mejor llegarle a 3000 ICPs que a 3. 3 SON TU ICP: VEN HASTA EL FINAL, COMENTAN, GUARDAN 97 DICEN «QUÉ VIDEO ABURRIDO» Y SE VAN CONTENIDO A CONTENIDO B TU REEL (C) INSTAGRAM MUESTRA LOS TRES A CIEN PERSONAS RESULTADO: EL REEL SE ESTANCA EN 900 VIEWS 30 PERSONAS A LAS QUE LES GUSTÓ, 970 QUE SE FUERON Y ESCALA AL QUE LE VA MEJOR INSTAGRAM SE CREÓ PARA ENTRETENER; LA GENTE ENTRA A VER GATOS SALTANDO Y PELEAS, NO A ESTUDIAR CREAR ALREDEDOR DE TU ICP ESTÁ BIEN PARA QUE TE VEA TU ICP; PERO PARA QUE TE VEA, PRIMERO LO TIENE QUE VER TODO EL MUNDO ES MEJOR LLEGARLE A 300 O 3000 ICPS QUE A 30 O 3 FIG. 02 — TU REEL NO COMPITE CONTRA TU NICHO: COMPITE CONTRA TODO LO DEMÁS CÓMO DIAGNOSTICAR TUS REELS 01 Mirá tus últimos diez reels y preguntate por cada hook: ¿lo entiende alguien que no es de tu nicho? 02 Separá los que se estancaron en pocas views: casi siempre filtran en los primeros tres segundos. 03 Aceptá que al principio te va a incomodar hablarle a gente que no te va a comprar; es el precio de que te vea quien sí. → La solución no es cambiar de tema ni dejar de hablarle a tu ICP: es cambiar cómo arranca el reel para que lo vea todo el mundo. Eso es el hook abierto, y es lo que sigue. AUMENTA TU VALOR 03","PLAYBOOK ( 02 ) 02 EL — ENGAÑAR HOOK AL ALGORITMO ATV 2026 ABIERTO QUE LO VEA CUALQUIERA Y SE QUEDE Un ejemplo real con la misma idea y dos hooks. «Cómo subir el show rate al 90%» filtra en el hook: solo lo entiende tu ICP, y a tu ICP nadie se lo muestra. «Por esto nadie quiere tomar una llamada con vos» lo puede ver alguien que no tiene nada que ver con ventas, tu madre por ejemplo: se siente reflejada porque su hijo nunca la llama, y se queda. Después descubre que el video es de ventas y se va, pero ya contó como view completa: Instagram entiende que interesó hasta el final y lo muestra más. Pensalo como un embudo: abierto al principio, se cierra tarde. EJEMPLO CÓMO REAL: LA MISMA IDEA CON DOS HOOKS «CÓMO SUBIR EL SHOW RATE AL 90%» «POR ESTO NADIE QUIERE TOMAR UNA LLAMADA CON VOS» FILTRA EN EL HOOK: SOLO LO VE TU ICP LO VE ALGUIEN AJENO A VENTAS (TU MADRE) Y SE VE REFLEJADA Y A TU ICP NADIE SE LO MUESTRA SE QUEDA; DESPUÉS DESCUBRE QUE ES DE VENTAS FUNCIONA COMO EMBUDO EL HOOK: ABIERTO PARA CUALQUIERA ENGAÑÁS AL ALGORITMO EL CUERPO: RETENÉS SIN QUE SE DÉ CUENTA MIENTRAS MÁS TARDE EN DARSE CUENTA, MEJOR AL FINAL: ACLARÁS QUE ES DE VENTAS SE VA EL QUE NO ES, PERO YA CONTÓ COMO VIEW COMPLETA INSTAGRAM DICE: «LE INTERESÓ HASTA EL FINAL, MUESTRO MÁS ESTE VIDEO», Y LO VEN 300 ICPS EN VEZ DE 3 FIG. 03 — SÚPER ABIERTO AL PRINCIPIO, SE VA CERRANDO DESPUÉS; EL QUE NO ES TU ICP SE VA TARDE CÓMO 01 ABRIR EL HOOK Reescribí el hook de tu próximo reel hasta que lo pueda sentir alguien ajeno a tu nicho: la prueba es imaginarte que lo ve tu madre y preguntarte si se queda. 02 Retené sin aclarar de qué va: mientras más tarde se dé cuenta el que no es tu ICP, mejor. 03 Aclará el nicho recién al final. El que no es se va, pero ya te dio la retención. → El hook abierto funciona hasta con temas aburridos. Un ejemplo real: un reel sobre cómo contratar equipo que hizo 220.000 views, y que vamos a desarmar paso por paso. AUMENTA TU VALOR 04","PLAYBOOK ( 03 ) 02 EL — ENGAÑAR AL ALGORITMO ATV 2026 EJEMPLO UN TEMA ABURRIDO EN 220.000 VIEWS Un ejemplo real: un reel sobre por qué no contratar «A players» (gente con mucha experiencia, los mejores de cada puesto) es un tema aburrido para cualquiera que no tenga un equipo. Arrancó con «despedí a ocho personas de un negocio que hacía 30K al mes y fue la mejor decisión», siguió con un caos que cualquiera reconoce, soltó un término que el que no es del nicho no entiende («A players») y lo explicó sin que se diera cuenta. Recién a la mitad del video es de nicho. 220.000 views, y de ahí llegó gente con 284.000 seguidores. EJEMPLO REAL: UN TEMA ABURRIDO (POR QUÉ NO CONTRATAR «A PLAYERS», GENTE CON EXPERIENCIA) 1 «DESPEDÍ A 8 PERSONAS DE UN NEGOCIO QUE HACÍA 30K AL MES, Y FUE LA MEJOR DECISIÓN» 2 «HACE UN AÑO FACTURABA 30K CON 50% DE MARGEN, PERO MI VIDA ERA UN CAOS» 3 «EL ERROR: CONTRATAR A LOS FAMOSOS A PLAYERS» 4 «GENTE CON EXPERIENCIA QUE SE SUPONÍA QUE ME IBA A DAR RESULTADOS: EL MEJOR CLOSER, LOS MEJORES … 5 «HASTA QUE ENTENDÍ: NO NECESITABA A PLAYERS, NECESITABA MIS PROPIOS PLAYERS» HOOK: CURIOSIDAD PARA CUALQUIERA IDENTIFICACIÓN: EL CAOS LO CONOCE TODO EL MUNDO UN TÉRMINO QUE EL QUE NO ES DEL NICHO NO ENTIENDE… Y SE QUEDA PARA SABER QUÉ ES SE LO EXPLICÁS AL NPC SIN QUE SE DÉ CUENTA Y RECIÉN ACÁ, EL 50% DEL VIDEO, ES DE NICHO RESULTADO: 220.000 VIEWS EN UN TEMA QUE ES «CÓMO CONTRATAR EQUIPO»; Y DE ESE REEL VINO GENTE CON 284.000 SEGUIDORES EL MISMO MOLDE SIRVIÓ DESPUÉS PARA UN VIDEO SOBRE CONTENIDO: «DEJÉ DE TRABAJAR PARA MI NEGOCIO QUE ME GENERABA 40K» FIG. 04 — ESTÁ TAN BIEN HECHO QUE LO PUEDE VER UN NPC, Y POR ESO LO VE TU ICP CÓMO HACER UN TEMA ABURRIDO PARA TODOS 01 Buscá en tu tema aburrido el hecho que cualquiera entiende: un número, una decisión drástica, un caos. 02 Si usás un término de nicho, usalo como intriga y explicalo al toque, como si no supieran. 03 Guardá el molde: el mismo sirvió después para un video sobre contenido con otro hook. → Cuando lo que tenés que decir es aburrido de verdad y ningún hook lo salva, hay otro recurso: mostrar cosas en pantalla. Es lo que sigue. AUMENTA TU VALOR 05","PLAYBOOK ( 04 ) 02 — ENGAÑAR MOSTRAR Y AL ALGORITMO ATV 2026 CAMUFLAR DALES ALGO PARA CAPTURAR Y EL CASO VA AL FINAL Si lo que decís es aburrido, mostrá cosas: un calendario, un estándar, los reportes. La gente lo lee, saca captura y lo guarda; nunca lo vuelve a ver, pero el algoritmo lo lee como interés. Y el caso de éxito se camufla en valor. Un ejemplo real: «tengo que confesar algo: hago más de 150K por mes y soy un procrastinador serial», después el proceso completo que resuelve eso, y recién al final «esto funcionó con un cliente: de 10K a 100K en treinta días». A la gente le importa poco tu caso; quiere saber cómo con tu caso se lleva algo. CUANDO LO QUE DECÍS ES ABURRIDO, MOSTRÁ COSAS CALENDARIO DE CONTENIDO ESTÁNDAR DEL EQUIPO DE VENTAS REPORTES SEMANALES LOS ROLES POR ÁREA LA GENTE LO LEE LA GENTE LO LEE LA GENTE LO LEE LA GENTE LO LEE Y SACA CAPTURA Y SACA CAPTURA Y SACA CAPTURA Y SACA CAPTURA 246 GUARDADOS: SON VIDEOS QUE GUARDAN Y NO VUELVEN A VER, PERO EL ALGORITMO LO LEE COMO INTERÉS Y EL CASO DE ÉXITO SE CAMUFLA EN VALOR (EJEMPLO REAL) «TENGO QUE CONFESAR ALGO» CURIOSIDAD «HAGO MÁS DE 150K POR MES… Y SOY UN PROCRASTINADOR SERIAL» AUTORIDAD + IDENTIFICACIÓN: TODOS PROCRASTINAMOS «CREÉ SISTEMAS ANTI-EJECUCIÓN PARA TENER RESULTADOS SIN PONER MI TIEMP… RESPONDE LA PREGUNTA QUE EL CEREBRO SE HIZO «ESTO ES LO QUE HICE: PROCESOS, ROLES, MÉTRICAS, REPORTES» EL VALOR: LA GENTE GUARDA «Y FUNCIONÓ CON UN CLIENTE: DE 10K A 100K EN 30 DÍAS» EL CASO, AL FINAL, COMO PRUEBA DEL VALOR A LA GENTE LE IMPORTA POCO TU CASO DE ÉXITO; QUIERE SABER CÓMO CON TU CASO SE LLEVA ALGO FIG. 05 — UN VIDEO BOFU HECHO PARA QUE LO VEA TODO EL MUNDO: PRIMERO EL VALOR, DESPUÉS LA PRUEBA CÓMO HACER QUE GUARDEN 01 Para cada reel de valor, preparé una cosa que se vea en pantalla y que valga una captura. 02 Cuando hagas un caso de éxito, no arranques por el cliente: arrancá por lo que vos tenés en común con quien mira. 03 El caso va al final, como prueba de que el valor funciona. → Hasta acá, reel por reel. Falta mirar el perfil entero, porque el que entra desde un reel abierto ve los nueve últimos juntos: si todos se parecen, se va. AUMENTA TU VALOR 06","PLAYBOOK ( 05 ) 02 EL — ENGAÑAR AL ALGORITMO ATV 2026 PERFIL NUEVE VERSIONES DEL MISMO REEL Y EL QUE ENTRA SE VA Cuando alguien entra a tu perfil y ve que un reel es igual a este, a este y a este, se va. En rojo quedan los que se repiten. Lo que tiene que verse es variedad de intención: TOFU abiertos, que al principio incomodan hacerlos pero traen las views; MOFU que rompen una creen
